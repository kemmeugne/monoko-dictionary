name: Monoko checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  authenticated-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run authenticated smoke
        run: |
          missing=""
          for name in TEST_SUPABASE_URL TEST_SUPABASE_ANON_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Authenticated smoke is required on main; missing:$missing"
              exit 1
            fi
            echo "Authenticated smoke skipped for this pull request; missing:$missing"
          else
            npm run test:browser -- --project=desktop tests/smoke/authenticated.spec.js
          fi
