<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monɔkɔ — Dictionnaire multilingue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/course-trail-meta.js?v=20260822-1"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#F7F3ED}
    input::placeholder{color:var(--m-muted)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:#D4C8B4;border-radius:4px}
    @keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,0.5),0 4px 20px rgba(22,163,74,0.4)}50%{box-shadow:0 0 0 18px rgba(22,163,74,0),0 4px 20px rgba(22,163,74,0.4)}}
    @keyframes dots{0%,100%{opacity:0.2}50%{opacity:1}}
    @keyframes waveA{0%{height:4px}100%{height:26px}}
    @keyframes waveB{0%{height:8px}100%{height:20px}}
    @keyframes waveC{0%{height:14px}100%{height:32px}}
    @keyframes micRing{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,0.4),0 6px 24px rgba(0,0,0,0.2)}50%{box-shadow:0 0 0 16px rgba(22,163,74,0),0 6px 24px rgba(22,163,74,0.35)}}
  </style>
  <link rel="stylesheet" href="/monoko-ui.css?v=20260825-1">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const SUPABASE_URL = window.__MONOKO_SUPABASE_URL__ || "https://haioiccujncsehadipzb.supabase.co";
    const SUPABASE_KEY = window.__MONOKO_SUPABASE_KEY__ || "sb_publishable_W6hYzyecMTm06Cr9siLV1A_4qtR5ect";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function supaFetch(table, params = "") {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      });
      if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
      return res.json();
    }

    async function supaCount(table, filter = "", select = "id") {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=${select}${filter ? '&' + filter : ''}`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: "count=exact", Range: "0-0" },
      });
      if (!res.ok) throw new Error(`Supabase count error: ${res.status}`);
      const range = res.headers.get("content-range");
      return range ? parseInt(range.split("/")[1]) : 0;
    }

    async function apiFetch(url, options = {}) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session?.access_token) throw new Error("Authentication required");
      return fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          Authorization: `Bearer ${session.access_token}`,
        },
      });
    }

    // Language colors/flags
    const LANG_THEMES = {
      "Lingala": { emoji: "🇨🇩", gradient: "linear-gradient(135deg, #2C5F2D, #4A8B4C)", accent: "#2C5F2D" },
      "Yoruba": { emoji: "🇳🇬", gradient: "linear-gradient(135deg, #1B5E20, #388E3C)", accent: "#1B5E20" },
    };
    const defaultTheme = { emoji: "🌍", gradient: "linear-gradient(135deg, #2C5F2D, #4A8B4C)", accent: "#2C5F2D" };
    const TESTER_NAME_KEY = "monoko_tester_name";
    const TESTER_SESSION_KEY = "monoko_tester_session_id";
    const LAST_LANGUAGE_KEY = "monoko_last_language";

    // A returning learner used to meet the public landing page on every cold
    // load. Nothing was wrong with the routing — the session, the language list
    // and the stored language preference are three round trips, and the app
    // painted its marketing page while they resolved. These two reads are
    // synchronous, so the first paint can be the right screen instead. They are
    // hints: getSession() and the private-view guard still decide what the
    // visitor actually gets.
    function hasStoredSession() {
      // supabase-js persists its session under `sb-<project-ref>-auth-token`.
      try {
        for (let index = 0; index < localStorage.length; index += 1) {
          if (/^sb-.+-auth-token$/.test(localStorage.key(index) || "")) return true;
        }
      } catch (error) { /* storage blocked — fall back to the landing page */ }
      return false;
    }

    function readLastLanguage() {
      try {
        const stored = JSON.parse(localStorage.getItem(LAST_LANGUAGE_KEY) || "null");
        return stored && stored.id && stored.name ? stored : null;
      } catch (error) { return null; }
    }

    function rememberLanguage(language) {
      try {
        if (!language) localStorage.removeItem(LAST_LANGUAGE_KEY);
        else localStorage.setItem(LAST_LANGUAGE_KEY, JSON.stringify({
          id: language.id, name: language.name, wordCount: language.wordCount || 0,
        }));
      } catch (error) { /* storage blocked — the chooser still works */ }
    }

    const BOOT_SESSION = hasStoredSession();
    const BOOT_LANGUAGE = BOOT_SESSION ? readLastLanguage() : null;

    function generateSessionId() {
      return `session_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
    }

    // Geographic data for each language
    const LANG_GEO = {
      "Lingala": {
        regions: ["République Démocratique du Congo", "République du Congo", "Centrafrique", "Angola"],
        speakers: "~45 million",
        family: "Langue bantoue",
        description: "Langue véhiculaire majeure de l'Afrique centrale, parlée principalement le long du fleuve Congo. Lingua franca à Kinshasa et Brazzaville.",
        color: "var(--m-forest)",
        center: [-2, 22],
        cities: [
          { name: "Kinshasa", lat: -4.32, lon: 15.31, main: true },
          { name: "Brazzaville", lat: -4.27, lon: 15.28, main: false },
          { name: "Kisangani", lat: 0.52, lon: 25.19, main: false },
          { name: "Bangui", lat: 4.36, lon: 18.56, main: false },
          { name: "Mbandaka", lat: 0.05, lon: 18.26, main: false },
        ],
      },
      "Yoruba": {
        regions: ["Nigeria (Sud-Ouest)", "Bénin", "Togo"],
        speakers: "~47 million",
        family: "Langue nigéro-congolaise",
        description: "L'une des plus grandes langues d'Afrique de l'Ouest. Langue du peuple Yoruba, riche en tradition orale, poésie et musique.",
        color: "#C4912E",
        center: [7.5, 4],
        cities: [
          { name: "Lagos", lat: 6.45, lon: 3.40, main: true },
          { name: "Ibadan", lat: 7.38, lon: 3.93, main: false },
          { name: "Cotonou", lat: 6.37, lon: 2.39, main: false },
          { name: "Abeokuta", lat: 7.16, lon: 3.35, main: false },
          { name: "Oshogbo", lat: 7.77, lon: 4.56, main: false },
        ],
      },
    };

    const MapIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>);
    const HeadphonesIcon = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>);

    // Leaflet Map Component
    const LeafletMap = ({ selectedMapLang, onSelectLang, immersive = false }) => {
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef([]);

      useEffect(() => {
        if (mapInstanceRef.current) return; // already initialized

        // Load Leaflet CSS
        if (!document.getElementById('leaflet-css')) {
          const link = document.createElement('link');
          link.id = 'leaflet-css';
          link.rel = 'stylesheet';
          link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
          document.head.appendChild(link);
        }

        // Load Leaflet JS
        const loadLeaflet = () => {
          return new Promise((resolve) => {
            if (window.L) { resolve(); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
            script.onload = resolve;
            document.head.appendChild(script);
          });
        };

        loadLeaflet().then(() => {
          const L = window.L;
          // The immersive hero map is a backdrop, not a control. It fills the
          // first viewport, so leaving Leaflet's touch handlers on would let a
          // vertical swipe pan the map instead of scrolling the page — the
          // landing page would trap the reader on a phone. Language selection
          // stays with the tabs below it, which are ordinary buttons.
          const map = L.map(mapRef.current, {
            center: immersive ? [1, 17] : [3, 15],
            zoom: immersive ? 5 : 4,
            minZoom: 3,
            maxZoom: 8,
            zoomControl: !immersive,
            attributionControl: false,
            dragging: !immersive,
            scrollWheelZoom: !immersive,
            touchZoom: !immersive,
            doubleClickZoom: !immersive,
            boxZoom: !immersive,
            keyboard: !immersive,
          });

          // Use a clean, muted tile style
          L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
          }).addTo(map);

          mapInstanceRef.current = map;

          // Add city markers for each language
          Object.entries(LANG_GEO).forEach(([langName, geo]) => {
            geo.cities.forEach((city) => {
              const size = city.main ? 14 : 8;
              const icon = L.divIcon({
                className: '',
                html: `<div style="
                  width:${size}px; height:${size}px;
                  background:${geo.color};
                  border: 2px solid white;
                  border-radius: 50%;
                  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                  cursor: pointer;
                "></div>`,
                iconSize: [size, size],
                iconAnchor: [size/2, size/2],
              });

              const marker = L.marker([city.lat, city.lon], { icon }).addTo(map);

              // Tooltip
              const tooltipContent = city.main
                ? `<div style="font-family:'DM Sans',sans-serif;padding:4px 2px;">
                    <strong style="font-size:13px;color:${geo.color};">${city.name}</strong><br/>
                    <span style="font-size:11px;color:#6B7280;">${langName}</span>
                  </div>`
                : `<span style="font-family:'DM Sans',sans-serif;font-size:11px;">${city.name}</span>`;

              marker.bindTooltip(tooltipContent, {
                permanent: city.main,
                direction: 'top',
                offset: [0, -size/2 - 2],
                className: 'clean-tooltip',
              });

              marker.on('click', () => onSelectLang(langName));
              marker.langName = langName;
              marker.isMain = city.main;
              markersRef.current.push(marker);
            });
          });

          // Add custom tooltip style
          const style = document.createElement('style');
          style.textContent = `
            .clean-tooltip {
              background: white !important;
              border: 1px solid var(--m-line) !important;
              border-radius: 8px !important;
              box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
              padding: 4px 8px !important;
              font-family: 'DM Sans', sans-serif !important;
            }
            .clean-tooltip:before { border-top-color: var(--m-line) !important; }
            .leaflet-control-zoom a {
              background: white !important;
              color: var(--m-ink) !important;
              border-color: var(--m-line) !important;
              font-family: 'DM Sans', sans-serif !important;
            }
          `;
          document.head.appendChild(style);
        });

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      // Fly to selected language
      useEffect(() => {
        if (!mapInstanceRef.current || !selectedMapLang) return;
        const geo = LANG_GEO[selectedMapLang];
        if (geo) {
          mapInstanceRef.current.flyTo(geo.center, 5, { duration: 1 });
        }

        // Highlight markers
        markersRef.current.forEach(m => {
          const el = m.getElement();
          if (!el) return;
          const dot = el.querySelector('div');
          if (!dot) return;
          if (m.langName === selectedMapLang) {
            dot.style.transform = m.isMain ? 'scale(1.4)' : 'scale(1.2)';
            dot.style.boxShadow = `0 0 0 4px ${LANG_GEO[m.langName].color}40, 0 2px 6px rgba(0,0,0,0.3)`;
          } else {
            dot.style.transform = 'scale(1)';
            dot.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
            dot.style.opacity = selectedMapLang ? '0.4' : '1';
          }
        });
      }, [selectedMapLang]);

      return <div ref={mapRef} className={`m-language-map ${immersive ? "immersive" : ""}`} />;
    };

    const SearchIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>);
    const BookIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>);
    const ArrowLeft = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>);
    const ChevronRight = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>);
    const VolumeIcon = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>);
    const GlobeIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>);
    const GradIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.1 2.7 2 6 2s6-.9 6-2v-5"/></svg>);
    const ChatIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>);
    const SendIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>);
    const FlagIcon = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>);
    const CheckCircle = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--m-correct)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>);
    const CloseIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);
    const Spinner = () => (<div style={{display:"flex",justifyContent:"center",padding:40}}><div style={{width:32,height:32,border:"3px solid var(--m-line)",borderTopColor:"var(--m-forest)",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/></div>);

    // Held up while the app works out which screen a returning learner belongs
    // on. It stands in for their home page, so it says nothing the landing page
    // says — showing the landing page here is the flash it exists to remove.
    const BootSplash = () => (
      <div className="m-boot" role="status" aria-label="Chargement de Monɔkɔ">
        <span className="m-boot-mark" aria-hidden="true">M</span>
        <span className="m-boot-spin" aria-hidden="true"/>
      </div>
    );

    const AudioButton = ({ src, title }) => {
      const [playing, setPlaying] = useState(false);

      const playAudio = async () => {
        if (!src) return;
        try {
          const audio = new Audio(src);
          setPlaying(true);
          audio.addEventListener("ended", () => setPlaying(false), { once: true });
          audio.addEventListener("pause", () => setPlaying(false), { once: true });
          await audio.play();
        } catch (e) {
          setPlaying(false);
          console.error(e);
        }
      };

      if (!src) return null;

      return (
        <button
          onClick={playAudio}
          style={{
            background: playing ? "var(--m-forest)" : "var(--m-green-soft)",
            border: "none",
            borderRadius: "50%",
            width: 32,
            height: 32,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            cursor: "pointer",
            color: playing ? "white" : "var(--m-forest-2)",
            flexShrink: 0
          }}
          title={title}
        >
          <VolumeIcon />
        </button>
      );
    };

    // ── Alphabet Panel (Module 1.1 Sons et alphabet) ─────────────────────────
    // Tiles are built from the lesson_items rows, so the word printed on a tile
    // is always the one in the clip the professor recorded. Only the
    // pronunciation hints live here — they have no column in the DB.
    const VOWEL_HINTS = {
      "A": "comme dans « patte »",
      "E": "comme dans « été »",
      "I": "comme dans « vie »",
      "O": "comme dans « eau »",
      "U": "comme dans « ou »",
      "Ɛ": "comme dans « fête »",
      "Ɔ": "comme dans « or »",
    };

    // "Voyelle A — Décision" / "Consonne B — Maladie" / "Son composé GB — Pont"
    // / "Ton haut (accent aigu ´) — Père"
    const parseAlphabetItem = (item) => {
      const raw = (item.french || "").replace(/\s+/g, " ").trim();
      const sep = raw.indexOf("—");
      const left = (sep === -1 ? raw : raw.slice(0, sep)).trim();
      const base = {
        word: (item.dialect || "").trim(),
        meaning: sep === -1 ? "" : raw.slice(sep + 1).trim(),
        audio: item.audio_url,
        key: item.id,
      };
      let m;
      if ((m = left.match(/^Voyelle\s+(.+)$/i))) {
        const letter = m[1].trim();
        return { ...base, kind:"voyelle", letter, hint: VOWEL_HINTS[letter] };
      }
      if ((m = left.match(/^Consonne\s+(.+)$/i)))
        return { ...base, kind:"consonne", letter: m[1].trim() };
      if ((m = left.match(/^Sons?\s+composés?\s+(.+)$/i))) {
        const letter = m[1].trim();
        return { ...base, kind: letter.length > 2 ? "trigraphe" : "digraphe", letter };
      }
      if ((m = left.match(/^(Ton\s+[^(]+?)\s*(?:\(([^)]*)\))?$/i)))
        return { ...base, kind:"ton", desc: m[1].trim(), mark: (m[2] || "").trim() };
      return { ...base, kind:"autre", letter: left };
    };

    const AlphabetPanel = ({ lessonItems }) => {
      const parsed = [...lessonItems]
        .sort((a, b) => (a.item_order || 0) - (b.item_order || 0))
        .map(parseAlphabetItem);
      const group = (kind) => parsed.filter(p => p.kind === kind);
      const voyelles   = group("voyelle");
      const consonnes  = group("consonne");
      const digraphes  = group("digraphe");
      const trigraphes = group("trigraphe");
      const tons       = group("ton");
      const autres     = group("autre");

      const playAudio = (src) => {
        if (!src) return;
        const a = new Audio(src); a.play().catch(()=>{});
      };

      const SectionLabel = ({ children }) => <h3 className="m-alpha-label">{children}</h3>;

      // Four categories, four accents. The coding is the teaching device here —
      // it is what tells a learner that "mb" belongs with "nd" and not with "b" —
      // so it survives the restyle; only the hues move into the app palette.
      const Tile = ({ entry, accent }) => {
        const { letter, word, meaning, hint, audio } = entry;
        const tone = { voyelle:"vowel", consonne:"consonant", compose:"compound" }[accent] || "consonant";
        return (
          <button className={`m-alpha-tile ${tone} ${audio ? "" : "silent"}`}
                  onClick={() => playAudio(audio)} disabled={!audio}
                  title={audio ? `Écouter ${word}` : undefined}>
            {audio && <span className="m-alpha-play" aria-hidden="true"><UiIcon name="play"/></span>}
            <span className="m-alpha-letter">{letter}</span>
            <span className="m-alpha-word">{word}</span>
            <span className="m-alpha-meaning">{meaning}</span>
            {hint && <span className="m-alpha-hint">{hint}</span>}
          </button>
        );
      };

      const ToneTile = ({ entry }) => (
        <button className={`m-alpha-tile tone ${entry.audio ? "" : "silent"}`}
                onClick={() => playAudio(entry.audio)} disabled={!entry.audio}
                title={entry.audio ? `Écouter ${entry.word}` : undefined}>
          {entry.audio && <span className="m-alpha-play" aria-hidden="true"><UiIcon name="play"/></span>}
          <span className="m-alpha-desc">{entry.desc}</span>
          <span className="m-alpha-letter">{entry.word}</span>
          <span className="m-alpha-word">{entry.meaning}</span>
          {entry.mark && <span className="m-alpha-hint">{entry.mark}</span>}
        </button>
      );

      const hasAudio = parsed.some(p => p.audio);
      const Section = ({ title, items, accent, columns }) => items.length === 0 ? null : (
        <section className="m-alpha-section">
          <SectionLabel>{title}</SectionLabel>
          <div className={`m-alpha-grid ${columns || ""}`}>
            {items.map(item => accent === "ton"
              ? <ToneTile key={item.key} entry={item}/>
              : <Tile key={item.key} entry={item} accent={accent}/>)}
          </div>
        </section>
      );

      return (
        <div className="m-alphabet">
          {!hasAudio && (
            <p className="m-alpha-notice">
              <span aria-hidden="true">🎙️</span>
              <span>Les audios de ce module seront disponibles une fois enregistrés par le professeur.</span>
            </p>
          )}

          <Section title={`Voyelles — ${voyelles.length} sons`} items={voyelles} accent="voyelle"/>
          <Section title={`Consonnes simples — ${consonnes.length} sons`} items={consonnes} accent="consonne"/>
          <Section title={`Sons composés — ${digraphes.length} digraphes`} items={digraphes} accent="compose"/>
          <Section title={`Sons composés — ${trigraphes.length} trigraphes`} items={trigraphes} accent="compose" columns="wide"/>
          <Section title={`Les ${tons.length} tons du lingala`} items={tons} accent="ton" columns="tones"/>
          <Section title={`Autres — ${autres.length}`} items={autres} accent="consonne"/>

          <p className="m-alpha-note">
            <strong>Note :</strong> Le lingala est une langue tonale.
            Le sens d'un mot change selon le ton employé. Les couleurs indiquent :
            <b className="vowel"> ■ voyelles</b>
            <b className="consonant"> ■ consonnes</b>
            <b className="compound"> ■ sons composés</b>
            <b className="tone"> ■ tons</b>.
            Cliquez sur une tuile pour entendre le son.
          </p>
        </div>
      );
    };
    // ── End AlphabetPanel ─────────────────────────────────────────────────────

    // ── Tokenizer ─────────────────────────────────────────────────────────────
    // The single definition of what a "word" is. Tap-words builds a tile per
    // token, fill-the-blank removes one and compares what is typed against it,
    // and listen-and-type spells one out — so if these three disagree about
    // where a word ends, they break in three different ways on the same row.
    //
    // It also has to disagree with `lesson_pool.token_count`, which was computed
    // by a bare whitespace split in `populate_lesson_pool.py`. French typography
    // puts a space before `?` and `!`, so "Olingi kofanda ?" counts as 3 there
    // and is 2 words plus a floating punctuation mark here — 947 of 6,196 rows
    // differ. The stored column stays as a coarse index; THIS is what decides
    // exercise shape, because this is what gets rendered.

    // A parenthesised gloss is editorial, not speech: "Moteki (ba teki)" is one
    // spoken word plus a note about its plural. Tiling the note would ask the
    // learner to build something nobody says.
    const GLOSS_RE = /\([^)]*\)/g;
    // Punctuation clinging to a word's edge is never part of it. Kept inside,
    // though: "bangɔmbɛ-mwâsí" is one compound word, not two.
    const EDGE_PUNCT_RE = /^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu;
    // An unspaced slash means the professor read several variants into one cell
    // (the "slash trap" in ROADMAP Phase 1). It separates alternatives, so it
    // can never be a word character.
    const TOKEN_SPLIT_RE = /[\s\/]+/;

    const tokenize = (s) => (s || "")
      .normalize("NFC")
      .replace(GLOSS_RE, " ")
      .split(TOKEN_SPLIT_RE)
      .map(t => t.replace(EDGE_PUNCT_RE, ""))
      .filter(Boolean);

    const tokenCount = (s) => tokenize(s).length;

    // Characters for the listen-and-type bank. Normalising to NFC first is what
    // keeps a toned vowel a single tile: in NFD "ó" is o + U+0301, and a naive
    // spread would offer the learner a bare accent to place. The pool is all NFC
    // today, but professor content arrives continuously and one NFD paste would
    // be invisible until the exercise looked broken.
    const characters = (s) => [...(s || "").normalize("NFC")];

    // Accent-insensitive comparison, for fill-the-blank only.
    //
    // 16 of the pool's 42 letters cannot be typed on an iPhone French keyboard,
    // and 17.7% of candidate blank-words carry one — so without folding, one
    // blank in six is unanswerable. The exercise shows the correctly accented
    // form after the answer, which is what keeps this from teaching that tone is
    // optional.
    //
    // `ɛ` and `ɔ` need explicit rules: they are distinct letters, not accented
    // vowels, so Unicode decomposition does not touch them.
    //
    // Folding merges 309 spelling groups. 303 are one word written untoned (the
    // dictionary) and toned (the course). The remaining 6 differ only in accent
    // position — mídi/midí, ntóngo/ntɔngɔ, lisúkúlu/lisúkulu, ladió/ladíó,
    // nsékwá/nsékwa, minutí/minúti — and Anthony confirmed on 2026-08-17 that
    // each pair is the same word. There are no false accepts left to worry about.
    //
    // NOT for listen-and-type, which tests transcription: accepting untoned
    // input there would delete the only thing that exercise measures.
    const fold = (s) => (s || "")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")     // strip combining accents
      .toLowerCase()                        // Ɔ -> ɔ before the letter rules below
      .replace(/ɔ/g, "o")
      .replace(/ɛ/g, "e")
      .replace(/[’ʼ]/g, "'")      // iOS smart quote -> plain apostrophe
      .normalize("NFC")
      .trim();

    // A row the engine may put on screen at all.
    //
    // The dictionary writes "/" or "?" where a translation is missing, and 9 such
    // rows reached `lesson_pool` — 7 spelled "/" (Xylophone ×4, Automne ×2), one
    // "?" (Air) and one native row whose Lingala is the bare gloss "(Oyo)". A
    // `.trim()` check passes all of them, because "/" is not empty; only asking
    // for an actual word catches it. Without this a match-pairs tile can read "/".
    const usableRow = (r) =>
      !!r && tokenCount(r.lingala) > 0 && tokenCount(r.french) > 0;

    // Is what the learner typed the word we asked for, ignoring accents?
    const sameWord = (a, b) => {
      const x = fold(String(a ?? "").replace(EDGE_PUNCT_RE, ""));
      const y = fold(String(b ?? "").replace(EDGE_PUNCT_RE, ""));
      return x !== "" && x === y;
    };

    // ── Exercise engine ───────────────────────────────────────────────────────
    // A session is a budget of QUESTIONS, not of screens. Screens are unequal in
    // time — a five-pair matching screen is five answers, a choose-the-audio
    // screen is one — so counting screens made the progress bar mean something
    // different from one screen to the next, and made a variable screen size
    // expensive. Counting questions makes it free: a three-pair screen simply
    // costs three, which is what lets thin lessons build a matching screen at all.
    const SESSION_QUESTIONS = 20;  // questions per session, material permitting
    const PAIRS_MIN = 3;           // below 3 the screen is solvable by elimination
    const PAIRS_MAX = 5;           // above 5 the tiles stop fitting a 375px column

    // How much of the budget each screen type spends.
    const questionCount = (ex) => !ex ? 0 : ex.type === "match_pairs" ? ex.pairs.length : 1;
    const countQuestions = (list) => (list || []).reduce((n, ex) => n + questionCount(ex), 0);
    const scoreableAttempts = (list) => (list || []).filter(a =>
      a.scored !== false && a.format !== "speaking");

    // French takes the singular after 0 and 1, plural only from 2 — "1 partie",
    // "2 parties". Getting this wrong is the kind of thing a French speaker reads
    // as broken software, so it lives in one helper rather than in each caller.
    const plural = (n, one, many) => `${n}\u00A0${n > 1 ? many : one}`;

    // What the pre-session briefing calls each exercise type. Defined here, in
    // the pure engine, so a test and the corpus audit can both assert that every
    // type `buildSession` can emit has a label — an unlabelled type would render
    // a blank line in "Au programme" and nobody would notice.
    const PROGRAMME_LABELS = {
      match_pairs:  (n) => plural(n, "paire à associer", "paires à associer"),
      choose_audio: (n) => plural(n, "enregistrement à reconnaître", "enregistrements à reconnaître"),
      word_order:   (n) => plural(n, "phrase à remettre dans l'ordre", "phrases à remettre dans l'ordre"),
      fill_blank:   (n) => plural(n, "phrase à compléter", "phrases à compléter"),
      listen_type:  (n) => plural(n, "mot à écrire à l'oreille", "mots à écrire à l'oreille"),
      speaking:     (n) => plural(n, "prononciation à comparer", "prononciations à comparer"),
    };

    // One line per exercise type actually in the queue, biggest first. Counted
    // with questionCount() off the BUILT session, never from the budget
    // constants — the briefing has to describe the session the learner gets.
    const programmeOf = (queue) => {
      const byType = {};
      for (const ex of queue || []) byType[ex.type] = (byType[ex.type] || 0) + questionCount(ex);
      return Object.entries(byType)
        .sort((a, b) => b[1] - a[1])
        .map(([type, n]) => ({ type, n, label: PROGRAMME_LABELS[type] ? PROGRAMME_LABELS[type](n) : null }));
    };

    // Every pool row is identified the same way everywhere: by where it came
    // from. `lesson_pool.id` would be shorter but the exercises carry provenance,
    // not pool rows, and a re-populate reassigns pool ids.
    const itemId = (r) => `${r.source_table}:${r.source_id}`;

    // A thin lesson cannot fill 20 questions from distinct items — Météo has 6
    // native rows against a budget of 20. Repeating an item in a DIFFERENT format
    // is practice: matching it, then hearing it, then typing it are three
    // different skills on the same vocabulary. Repeating it in the SAME format is
    // a memory test of the screen before. So the ledger is keyed by (item,
    // format), and capped at 3 formats per item so that no session becomes one
    // word six ways.
    const MAX_FORMATS_PER_ITEM = 3;

    const makeLedger = () => {
      const used = new Map();                    // item id -> Set(format)
      return {
        canUse: (id, format) => {
          const formats = used.get(id);
          return !formats || (!formats.has(format) && formats.size < MAX_FORMATS_PER_ITEM);
        },
        use: (id, format) => {
          if (!used.has(id)) used.set(id, new Set());
          used.get(id).add(format);
        },
        // Has this item appeared at all yet in this session, in any format?
        // Reuse is the fallback for thin lessons, never the first choice.
        usedAny: (id) => used.has(id),
      };
    };

    // Precision measured per tier during the routing work: the professor's own
    // rows are correct by construction, the others were placed by a model.
    // Preferring native means a learner meets the most reliable material first.
    const TIER_RANK = { native: 0, approved: 1, reassigned: 2 };

    const shuffle = (arr) => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    };

    // The order every builder draws in. Four rules, in priority order — the
    // first two exist to make a session as WIDE as the lesson allows, the third
    // to spend the most reliable material first, the fourth to keep replays from
    // repeating themselves.
    //
    //   1. Never met in a past session. This is what makes tapping "S'entraîner"
    //      a second time teach something new instead of re-running the same 20
    //      items: `history` is what this learner has already been asked, so the
    //      lesson is covered by breadth-first sweeps rather than by luck.
    //   2. Not yet used in THIS session, in any format. An item may still come
    //      back in a second format — that is what fills a thin lesson — but only
    //      once everything else has had a turn.
    //   3. Due for review (Slice 7, Pratiquer only). Among items already met,
    //      the ones SM-2 says are owed today come before the ones that are not.
    //      This sits BELOW breadth on purpose: an item never seen has no
    //      schedule row and cannot be "due", and covering the lesson was
    //      measured to matter more than revisiting the part already covered.
    //      `due` is absent for Élargir and for a signed-out learner, and the
    //      rule then never fires.
    //   4. Better tier. `approved` was confirmed by a model at 96% precision and
    //      `reassigned` was moved by one at 90%, so spend the better first.
    //      In Pratiquer every row is native, so this rule never fires.
    //   5. Longest ago. Among items equally due, the stalest comes back first.
    //      Before SM-2 this rule did the spacing on its own.
    //
    // Shuffled BEFORE sorting, and Array#sort is stable, so ties stay random —
    // two sessions over the same material never run in the same order.
    const selectionOrder = (rows, ledger, history, due) => {
      const seen = history || new Map();         // lesson_pool.id -> last answered (ms)
      const owed = due || null;                  // Set<lesson_pool.id> due today, or null
      return shuffle(rows || []).sort((a, b) => {
        const sa = seen.has(a.id) ? 1 : 0, sb = seen.has(b.id) ? 1 : 0;
        if (sa !== sb) return sa - sb;
        const ua = ledger.usedAny(itemId(a)) ? 1 : 0, ub = ledger.usedAny(itemId(b)) ? 1 : 0;
        if (ua !== ub) return ua - ub;
        if (owed) {
          const da = owed.has(a.id) ? 0 : 1, db = owed.has(b.id) ? 0 : 1;
          if (da !== db) return da - db;
        }
        const ta = TIER_RANK[a.tier] ?? 9, tb = TIER_RANK[b.tier] ?? 9;
        if (ta !== tb) return ta - tb;
        return (seen.get(a.id) || 0) - (seen.get(b.id) || 0);
      });
    };

    // Clips are fetched ahead of the tap and played from memory.
    //
    // Measured: a clip on R2 takes ~340ms, and 330ms of that is time-to-first-byte
    // on a 20KB file — latency, not bandwidth, so nothing about the request makes
    // it faster. The only fix is to have the bytes already.
    //
    // Fetched with fetch() into a blob rather than leaning on <audio preload>:
    // R2 sends no Cache-Control (ETag only), so browser caching is heuristic at
    // best, and iOS Safari ignores preload on media to save data. A blob is
    // certain.
    //
    // ONE reused <audio> element, whose src is swapped to the blob URL. That kills
    // the latency and solves iOS's other rule at the same time: an element must be
    // played inside a real gesture before it can ever play programmatically, and
    // an element unlocked once stays unlocked. A fresh Audio() per clip would need
    // a fresh gesture every time, which is why choose-the-audio could not autoplay.
    // Audio prefetch. The clips live on R2, which answers in ~330ms of pure
    // latency on a 20KB file and sends no Cache-Control, so a tap that starts
    // its own request is always audibly late. The fix is to have the bytes
    // before the tap, not to make the tap faster.
    //
    // Prefetching is done with <audio preload="auto"> elements rather than
    // fetch()+blob: the bucket returns no Access-Control-Allow-Origin and 403s
    // the preflight, so fetch() cannot read these files from the browser at all.
    // Media elements are exempt from CORS, and an element that has buffered its
    // clip plays from that buffer with no request of its own.
    const CLIP_POOL_MAX = 24;             // ~2 screens of clips, well under memory pressure
    const clipPool = new Map();           // url -> preloading HTMLAudioElement
    let nowPlaying = null;

    const primeClip = (url) => {
      if (!url || clipPool.has(url)) return;
      try {
        const a = new Audio();
        a.preload = "auto";
        a.src = url;
        a.load();
        clipPool.set(url, a);
        // Evict oldest first; dropping the src lets the buffer be collected.
        while (clipPool.size > CLIP_POOL_MAX) {
          const oldest = clipPool.keys().next().value;
          const stale = clipPool.get(oldest);
          if (stale && stale !== nowPlaying) { stale.pause(); stale.removeAttribute("src"); }
          clipPool.delete(oldest);
        }
      } catch (e) { /* prefetch is best effort — playClip still works */ }
    };

    const primeClips = (urls) => (urls || []).filter(Boolean).forEach(primeClip);

    // Returns the element it started, so a caller can wait for the clip to
    // finish before doing something that would cut it off.
    const playClip = (url) => {
      if (!url) return null;
      try {
        primeClip(url);                   // no-op when already pooled
        const a = clipPool.get(url);
        if (!a) return null;
        if (nowPlaying && nowPlaying !== a) nowPlaying.pause();   // never two voices at once
        nowPlaying = a;
        a.currentTime = 0;
        a.play().catch(() => {});         // blocked before the first gesture — harmless
        return a;
      } catch (e) { return null; }
    };

    // The element this URL is sounding on right now, or null. Lets a caller wait
    // for a clip it did not start itself — restarting one mid-word stutters it.
    // A clip that has already finished reports null, so the caller replays it
    // rather than waiting for an `ended` event that has already been and gone.
    const playingClip = (url) => {
      if (!url || !nowPlaying) return null;
      const a = clipPool.get(url);
      return (a && a === nowPlaying && !a.paused && !a.ended) ? a : null;
    };

    // Runs `done` once `audio` has finished sounding. Needed at a screen
    // boundary: the next screen autoplays its own prompt on mount and playClip
    // stops whatever is already sounding, so handing over on a fixed timer
    // truncates the clip the learner just earned.
    //
    // `ended` is the signal, the timer is the safety net — a clip that fails to
    // load fires no event at all, and without a ceiling the session would sit on
    // a solved screen forever.
    const HANDOFF_MIN = 420;     // the beat that makes a solved screen readable
    const HANDOFF_MAX = 4000;    // no clip in the pool runs longer than this
    const afterClip = (audio, done, floorMs = HANDOFF_MIN) => {
      let timer = null, fired = false;
      const run = () => {
        if (fired) return;
        fired = true;
        clearTimeout(timer);
        if (audio) audio.removeEventListener("ended", onEnded);
        done();
      };
      // A short beat after the voice, so the next prompt does not land on top of it.
      const onEnded = () => { clearTimeout(timer); timer = setTimeout(run, 220); };
      // No clip sounding: still hold the screen for the reveal beat the caller
      // asked for, which is not the same length on every screen.
      if (!audio || audio.paused || audio.ended) { timer = setTimeout(run, floorMs); return; }
      audio.addEventListener("ended", onEnded);
      const known = isFinite(audio.duration) && audio.duration > 0;
      const left = known ? Math.max(0, audio.duration - (audio.currentTime || 0)) * 1000 : 0;
      timer = setTimeout(run, known ? Math.min(HANDOFF_MAX, left + 700) : HANDOFF_MIN * 2);
    };

    const releaseClips = () => {
      clipPool.forEach(a => { try { a.pause(); a.removeAttribute("src"); } catch (e) {} });
      clipPool.clear();
      nowPlaying = null;
    };

    // The pool items a screen is actually testing — what a learner can flag as
    // not belonging to the lesson. Distractors are excluded: they are wrong on
    // purpose, and the routing verdict being questioned is the answer's.
    const screenItems = (ex) =>
      !ex ? [] :
      ex.type === "match_pairs" ? ex.pairs :
      ex.type === "choose_audio" ? [ex.answer] :
      ex.item ? [ex.item] : [];

    // Which clips a screen will need, so they can be fetched before it is shown.
    const exerciseClips = (ex) =>
      !ex ? [] :
      ex.type === "match_pairs" ? ex.pairs.map(p => p.audio) :
      ex.type === "choose_audio" ? [ex.answer.audio] :
      ex.item ? [ex.item.audio] : [];

    // Shape homogeneity is the hard rule. A single word beside a full sentence is
    // answerable from length alone — "Ami" against "La famille est sacrée." needs
    // no Lingala at all. Both sides are measured, because the pool stores a token
    // count for the Lingala only and the French can be the longer of the two.
    // Counted with the tokenizer, not with `token_count`: the stored column came
    // from a bare whitespace split, so "Olingi kofanda ?" reads as 3 there and is
    // 2 real words. Shape rules must measure what actually appears on the tile.
    const longestSide = (r) =>
      Math.max(tokenCount(r.french), tokenCount(r.lingala));

    // Banding the FRENCH column alone is enough, and it is not a shortcut.
    // The shape exploit needs CORRELATION between the columns — you pair the long
    // left tile with the long right one. Make one column uniform and length
    // variation in the other carries no pairing information, because every tile
    // over there must match a French of identical shape anyway. Banding both
    // sides is stricter without being safer, and costs three more lessons their
    // only exercise. French is also the prompt side the learner reads first.
    const shapeBand = (r) =>
      ((r.french || "").trim().split(/\s+/).length <= 1 ? "word" : "phrase");

    // Buckets a screen may be built from. An exercise may never mix orthographies
    // either: the dictionary is written without tone marks and the course with
    // them, so `Mbula` beside `Mbúla` would teach that the accent is optional —
    // the opposite of what lesson 1.1 exists to teach.
    const pairsBuckets = (rows, level) => {
      // Both sides are capped. Filtering the Lingala alone let 4-word French
      // sentences into "short" material, which is how "Ami" ended up facing
      // "La famille est sacrée." on the same screen.
      const ok = (rows || []).filter(r =>
        usableRow(r) &&
        r.effective_level <= level &&
        longestSide(r) <= 3);

      const buckets = {};
      for (const r of ok) (buckets[`${r.orthography}|${shapeBand(r)}`] ||= []).push(r);

      // Two tiles showing the same French — or the same Lingala — would be
      // unanswerable, so a term may appear only once within a bucket.
      return Object.values(buckets).map(list => {
        const seenFr = new Set(), seenLn = new Set(), out = [];
        for (const r of [...list].sort((a, b) => TIER_RANK[a.tier] - TIER_RANK[b.tier])) {
          const fr = r.french.trim().toLowerCase(), ln = r.lingala.trim().toLowerCase();
          if (seenFr.has(fr) || seenLn.has(ln)) continue;
          seenFr.add(fr); seenLn.add(ln); out.push(r);
        }
        return out;
      }).sort((a, b) => b.length - a.length);
    };

    // `poolId` is the `lesson_pool.id` an attempt row points at. `id` stays the
    // provenance key, because that is what dedupes tiles within a screen.
    const buildMatchPairs = (rows) => ({
      type: "match_pairs",
      pairs: rows.map(r => ({
        id: itemId(r),
        poolId: r.id,
        fr: r.french.trim(),
        ln: r.lingala.trim(),
        audio: r.audio_url,
      })),
    });

    // Sized to the material, not to a fixed target: short-on-both-sides items are
    // the rarest shape in the pool (median 25 a lesson), so a screen takes what
    // the bucket and the remaining budget allow, anywhere from PAIRS_MIN to
    // PAIRS_MAX. A 3-pair screen costs 3 questions rather than 5 — which is what
    // recovers the 12 lessons that could not build a 5-pair screen at all.
    // Each screen is drawn from ONE bucket, so its pairs share an orthography and
    // a French shape. Buckets are taken largest-first so the session opens with
    // the lesson's richest material.
    const matchPairsScreens = (items, level, budget, ledger, history, due) => {
      const out = [];
      let spent = 0;
      for (const bucket of pairsBuckets(items, level)) {
        if (budget - spent < PAIRS_MIN) break;
        const avail = selectionOrder(bucket.filter(r => ledger.canUse(itemId(r), "match_pairs")), ledger, history, due);
        let i = 0;
        while (budget - spent >= PAIRS_MIN && avail.length - i >= PAIRS_MIN) {
          const size = Math.min(PAIRS_MAX, budget - spent, avail.length - i);
          const picked = avail.slice(i, i + size);
          i += size;
          picked.forEach(r => ledger.use(itemId(r), "match_pairs"));
          out.push(buildMatchPairs(picked));
          spent += size;
        }
      }
      return out;
    };

    // One screen, one question — so the budget here is simply a screen count.
    const chooseAudioScreens = (items, level, budget, ledger, history, due) => {
      const out = [];
      for (const bucket of audioBuckets(items, level)) {
        for (const answer of selectionOrder(bucket, ledger, history, due)) {
          if (out.length >= budget) return out;
          if (!ledger.canUse(itemId(answer), "choose_audio")) continue;
          ledger.use(itemId(answer), "choose_audio");
          out.push(buildChooseAudio(answer, bucket));
        }
      }
      return out;
    };

    // ── Tap words in order ────────────────────────────────────────────────────
    // Below 3 tokens there is no order to get wrong; above 9 the tiles stop
    // fitting a 375px column and the exercise becomes a memory test of the
    // French rather than a test of Lingala word order.
    const WORD_ORDER_MIN = 3;
    const WORD_ORDER_MAX = 9;

    // No buckets here. Match-pairs and choose-the-audio put several items on one
    // screen, so they need every item on that screen to share an orthography and
    // a shape — otherwise the answer is readable off the tile lengths. Word-order
    // shows ONE item, and the tiles are its own words, so there is nothing to mix.
    const wordOrderRows = (items, level) =>
      (items || []).filter(r => {
        if (!usableRow(r) || r.effective_level > level) return false;
        const n = tokenCount(r.lingala);
        return n >= WORD_ORDER_MIN && n <= WORD_ORDER_MAX;
      });

    const buildWordOrder = (r) => {
      const tokens = tokenize(r.lingala);
      return {
        type: "word_order",
        // The answer is the TOKENISED sentence, not the raw string: the learner
        // builds "Olingi kofanda", never "Olingi kofanda ?", so comparing against
        // the raw text would fail a correct answer on a punctuation mark that was
        // never offered as a tile.
        item: {
          id: itemId(r), poolId: r.id,
          fr: r.french.trim(), ln: tokens.join(" "), audio: r.audio_url,
        },
        tokens,
      };
    };

    const wordOrderScreens = (items, level, budget, ledger, history, due) => {
      const out = [];
      for (const r of selectionOrder(wordOrderRows(items, level), ledger, history, due)) {
        if (out.length >= budget) break;
        if (!ledger.canUse(itemId(r), "word_order")) continue;
        ledger.use(itemId(r), "word_order");
        out.push(buildWordOrder(r));
      }
      return out;
    };

    // ── Fill the blank ────────────────────────────────────────────────────────
    // Four characters or more, because the pool's frequent short tokens are all
    // grammar rather than content — na (3,478), ya (1,352), te (785), ko (669),
    // ba (518) — and blanking those tests nothing anybody wants to learn.
    //
    // And unique within its sentence: 27.4% of rows repeat a word, and blanking
    // one copy while the other sits visible two words away is not a question.
    const FILL_BLANK_MIN_TOKENS = 3;
    const BLANK_MIN_CHARS = 4;

    const blankCandidates = (tokens) => {
      const folded = tokens.map(fold);
      return tokens
        .map((word, i) => ({ word, i }))
        .filter(({ word, i }) =>
          [...word].length >= BLANK_MIN_CHARS &&
          folded.indexOf(folded[i]) === folded.lastIndexOf(folded[i]));
    };

    const fillBlankRows = (items, level) =>
      (items || []).filter(r => {
        if (!usableRow(r) || r.effective_level > level) return false;
        const t = tokenize(r.lingala);
        return t.length >= FILL_BLANK_MIN_TOKENS && blankCandidates(t).length > 0;
      });

    const buildFillBlank = (r) => {
      const tokens = tokenize(r.lingala);
      // Drawn at random rather than always taking the longest word, so a row met
      // again in a later Élargir session does not ask the identical question.
      const pick = shuffle(blankCandidates(tokens))[0];
      return {
        type: "fill_blank",
        item: {
          id: itemId(r), poolId: r.id,
          fr: r.french.trim(), ln: tokens.join(" "), audio: r.audio_url,
        },
        tokens,
        blankIndex: pick.i,
        answer: pick.word,
      };
    };

    const fillBlankScreens = (items, level, budget, ledger, history, due) => {
      const out = [];
      for (const r of selectionOrder(fillBlankRows(items, level), ledger, history, due)) {
        if (out.length >= budget) break;
        if (!ledger.canUse(itemId(r), "fill_blank")) continue;
        ledger.use(itemId(r), "fill_blank");
        out.push(buildFillBlank(r));
      }
      return out;
    };

    // ── Listen and type ───────────────────────────────────────────────────────
    // Character TILES, never a keyboard, and this is not a preference. The pool
    // needs 42 distinct letters and 16 of them cannot be produced on an iPhone
    // French keyboard at all: à á â ç è é ë í î ó ô ú ē ǎ ɔ ɛ. A text input makes
    // the exercise unanswerable rather than merely awkward.
    //
    // Tiles also dissolve the orthography problem instead of fudging it. The
    // learner can only build what is offered, so there is no "accept the untoned
    // spelling" rule here — unlike fill-the-blank, this exercise IS the spelling,
    // and folding would delete the only thing it measures.
    const LISTEN_MAX_TOKENS = 2;      // 1–2 tokens: 661 native rows, median 6 tiles
    const LISTEN_MAX_CHARS = 14;      // covers 97.4% of them; 22 is the worst case
    const LISTEN_TILES = 18;          // bank size — 3 rows of 6 at 375px

    const listenTypeRows = (items, level) =>
      (items || []).filter(r => {
        if (!usableRow(r) || !r.audio_url || r.effective_level > level) return false;
        // THE CLIP IS THE ANSWER KEY, so the tiles must spell what the professor
        // actually says. `tokenize` drops parenthesised text and breaks on a
        // comma, and both mean the recording and the slots stop agreeing:
        // "(Eleko ya) Gálá" is read in full and would ask for "Gálá" alone,
        // "(M)péma" is read "mpéma" and would ask for "péma", and
        // "Lisakolí, lisúkúlu" is two words of which only one is accepted.
        // Unanswerable as heard, not merely hard — so the row sits this
        // exercise out and stays available to every other type.
        if (/[(),]/.test(r.lingala)) return false;
        const t = tokenize(r.lingala);
        if (t.length < 1 || t.length > LISTEN_MAX_TOKENS) return false;
        if (characters(t.join("")).length > LISTEN_MAX_CHARS) return false;
        // Every tile has to be a letter the learner can get from the sound. A
        // hyphen is inaudible — "Kili-kili" would demand a tile nobody can hear
        // — so compound words sit this exercise out. It costs 1 native row of
        // 644, which is a fair price for never asking an unanswerable question.
        return characters(fold(t.join(""))).every(c => /[a-z]/.test(c));
      });

    // Distractors are plain letters from the pool's own alphabet, so nothing on
    // screen looks foreign to Lingala.
    const POOL_ALPHABET = "abcdefghijklmnopqrstuvwyz";

    const listenDistractors = (want) => shuffle([...POOL_ALPHABET]).slice(0, Math.max(0, want));

    const buildListenType = (r) => {
      const tokens = tokenize(r.lingala);
      // The tiles are FOLDED — plain letters, no tones, no ɛ/ɔ, no capitals.
      // Spelling a word you have only just heard is hard enough without also
      // asking which of five e's it takes; the learner builds the skeleton, and
      // the reveal then shows how it is really written. Folding is 1:1 per
      // character, so the slot count still matches the real spelling exactly.
      //
      // One slot group per word, so the space never has to be a tile — a "␣"
      // key reads as a puzzle piece rather than as writing.
      const words = tokens.map(w => characters(fold(w)));
      const answerChars = words.flat();
      const distractors = listenDistractors(LISTEN_TILES - answerChars.length);
      return {
        type: "listen_type",
        item: {
          id: itemId(r), poolId: r.id,
          // `ln` keeps the TRUE spelling, accents and all — it is what the
          // reveal teaches, and what `words` deliberately is not.
          fr: r.french.trim(), ln: tokens.join(" "), audio: r.audio_url,
        },
        words,
        tiles: shuffle([...answerChars, ...distractors].map((ch, i) => ({ key: i, ch }))),
      };
    };

    const listenTypeScreens = (items, level, budget, ledger, history, due) => {
      const out = [];
      for (const r of selectionOrder(listenTypeRows(items, level), ledger, history, due)) {
        if (out.length >= budget) break;
        if (!ledger.canUse(itemId(r), "listen_type")) continue;
        ledger.use(itemId(r), "listen_type");
        out.push(buildListenType(r));
      }
      return out;
    };

    // ── Record and compare ───────────────────────────────────────────────────
    // Speaking is deliberately not speech recognition. The learner hears the
    // professor, records locally, then hears both voices back to back and
    // self-rates. No recording leaves the device, and the self-rating never
    // contributes to the objective 80% Pratiquer gate.
    const SPEAKING_MAX_TOKENS = 8;
    const SPEAKING_MAX_PER_SESSION = 3;

    const speakingRows = (items, level) =>
      (items || []).filter(r =>
        usableRow(r) && r.audio_url && r.effective_level <= level &&
        tokenCount(r.lingala) <= SPEAKING_MAX_TOKENS);

    const buildSpeaking = (r) => ({
      type: "speaking",
      item: {
        id: itemId(r), poolId: r.id,
        fr: r.french.trim(), ln: r.lingala.trim(), audio: r.audio_url,
      },
    });

    const speakingScreens = (items, level, budget, ledger, history, due) => {
      const out = [];
      const cap = Math.min(SPEAKING_MAX_PER_SESSION, budget);
      for (const r of selectionOrder(speakingRows(items, level), ledger, history, due)) {
        if (out.length >= cap) break;
        if (!ledger.canUse(itemId(r), "speaking")) continue;
        ledger.use(itemId(r), "speaking");
        out.push(buildSpeaking(r));
      }
      return out;
    };

    // A session alternates types rather than running one then the other. Same
    // material either way, but a block of five identical screens reads as a drill
    // and a mixed queue reads as practice — and this is the shape every later
    // exercise type slots into.
    //
    // A screen too big for what is left of the budget is skipped rather than
    // ending the queue: a 5-pair screen may not fit in the last 2 questions where
    // two choose-the-audio screens still do, and stopping there would hand back a
    // short session with material still on the table.
    // Takes N lists so each new exercise type is one more entry, not a rewrite.
    const interleave = (lists, budget) => {
      const out = [];
      let spent = 0;
      const longest = Math.max(0, ...lists.map(l => l.length));
      for (let i = 0; i < longest && spent < budget; i++) {
        for (const list of lists) {
          const ex = list[i];
          if (!ex) continue;
          const cost = questionCount(ex);
          if (spent + cost > budget) continue;
          out.push(ex);
          spent += cost;
        }
      }
      return out;
    };

    // Takes a POOL, never a lesson id. Pratiquer passes native rows, Élargir
    // passes corpus rows, and the topic hub, play button and placement session
    // are all just different pools — the caller decides what the material is,
    // this decides what to do with it.
    // `history` maps `lesson_pool.id` → when this learner last answered it, so a
    // repeated "S'entraîner" sweeps forward through the lesson instead of
    // re-rolling the same items. Omit it and the session is simply random.
    // `production` (0–1) shifts the mix from recognition toward production, and
    // is what an Élargir topic level spends itself on. At 0 — every Pratiquer
    // session, and Élargir level 1 — the arithmetic is exactly what shipped in
    // Slice 6, so the measured per-lesson session sizes do not move.
    //
    // It is spent entirely on the match-pairs cap, because that one number
    // drives the rest: match-pairs and choose-the-audio are the two recognition
    // types, choose-the-audio takes whatever is left at the end, and every
    // production type in between takes a share of the remainder. Shrinking the
    // pairs cap therefore widens the four production types and narrows the two
    // recognition ones in a single move, with no second knob to keep in sync.
    // `production` (0–1) shifts the mix from recognition toward production, and
    // is what an Élargir topic level spends itself on. At 0 — every Pratiquer
    // session, and Élargir level 1 — the arithmetic is exactly what shipped in
    // Slice 6, so the measured per-lesson session sizes do not move.
    //
    // It is spent entirely on the match-pairs cap, because that one number
    // drives the rest: match-pairs and choose-the-audio are the two recognition
    // types, choose-the-audio takes whatever is left at the end, and every
    // production type in between takes a share of the remainder.
    const buildSession = (items, level, count = SESSION_QUESTIONS, history = null, opts = {}) => {
      const { production = 0, due = null } = opts;
      const ledger = makeLedger();
      // Match-pairs first and capped at roughly a third: it needs short items on
      // BOTH sides, the rarest shape in the pool (median 25 a lesson against 79
      // with audio), so letting it draw freely would spend the scarce material on
      // one type. Word-order and choose-the-audio then split what is left — both
      // cost one question a screen, so the split is even.
      //
      // Order matters: each builder claims items from the ledger as it goes, so
      // the scarcest type must choose before the plentiful ones take its material.
      const bias = Math.min(1, Math.max(0, production || 0));
      const pairsCap = Math.max(PAIRS_MIN, Math.ceil((count / 3) * (1 - 0.6 * bias)));
      const pairs = matchPairsScreens(items, level, pairsCap, ledger, history, due);
      let left = count - countQuestions(pairs);
      // Each single-question type takes an even share of what remains, and the
      // last one takes the rest — so a lesson short on one type still fills up.
      const order = wordOrderScreens(items, level, Math.ceil(left / 5), ledger, history, due);
      left -= countQuestions(order);
      const blank = fillBlankScreens(items, level, Math.ceil(left / 4), ledger, history, due);
      left -= countQuestions(blank);
      const listen = listenTypeScreens(items, level, Math.ceil(left / 3), ledger, history, due);
      left -= countQuestions(listen);
      const speaking = speakingScreens(items, level, Math.ceil(left / 2), ledger, history, due);
      left -= countQuestions(speaking);
      const audio = chooseAudioScreens(items, level, left, ledger, history, due);
      return interleave([pairs, order, blank, listen, speaking, audio], count);
    };

    // ── Progression ───────────────────────────────────────────────────────────
    // Slice 7. Everything here is pure: dates in, numbers out, no React and no
    // Supabase. That is what lets `tests/progression.test.js` slice this block
    // out of the page and run the real scheduler rather than a copy of it.

    // DAYS ARE THE LEARNER'S LOCAL DAYS, NEVER UTC.
    // A learner in Montreal finishing at 20:00 EST is already tomorrow in UTC.
    // Using toISOString() here would hand them a second streak day for one
    // evening, and then break the streak when they practise at the same hour
    // the next day. So the day string is built from the LOCAL getters.
    const localDay = (d = new Date()) => {
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    };

    // Both sides are pinned to UTC midnight before subtracting, which makes the
    // difference exact across a daylight-saving boundary — parsed as local time,
    // the 25-hour day at the end of October reads as 1.04 days.
    const dayDiff = (from, to) =>
      Math.round((Date.parse(`${to}T00:00:00Z`) - Date.parse(`${from}T00:00:00Z`)) / 86400000);

    const addDays = (day, n) => {
      const d = new Date(Date.parse(`${day}T00:00:00Z`) + n * 86400000);
      const p = (x) => String(x).padStart(2, "0");
      return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`;
    };

    // ── SM-2 ──
    // Pratiquer only. Spaced repetition needs a finite item set with per-item
    // state: native content is finite (median 25 rows a lesson), the 6,196-row
    // routed corpus is not. Élargir draws at random and writes no schedule.
    const SM2_START_EASE = 2.5;   // canonical SM-2 starting easiness
    const SM2_MIN_EASE   = 1.3;   // canonical floor; below it an item crowds out the lesson
    const SM2_MAX_EASE   = 3.0;   // OUR cap, not SM-2's — see below

    // Classic SM-2 grades an answer 0–5 on how easily it was recalled. An
    // exercise screen only knows right or wrong, so the quality signal is one
    // bit and the ease adjustment has to be correspondingly modest: +0.1 for a
    // hit, −0.2 for a miss. The upper cap is ours rather than SM-2's — with a
    // binary signal there is no evidence fine enough to justify the runaway
    // intervals an uncapped ease produces after a handful of lucky sessions.
    //
    // A miss sends interval_days to 0, which means due today, which means the
    // item returns in the very next session. That is the intended behaviour for
    // a lapse: sessions are the unit of practice here, not hours.
    const round2 = (n) => Math.round(n * 100) / 100;

    const sm2 = (prev, correct) => {
      const ease = prev?.ease ?? SM2_START_EASE;
      const reps = prev?.reps ?? 0;
      const interval = prev?.interval_days ?? 0;

      if (!correct) {
        return { ease: Math.max(SM2_MIN_EASE, round2(ease - 0.2)), interval_days: 0, reps: 0 };
      }
      const nextReps = reps + 1;
      // 1 day, then 6, then ease-multiplied — the canonical SM-2 ladder. The
      // Math.max(1, …) floor matters: a lapsed item has interval 0, so without
      // it the third correct answer in a row would multiply 0 and schedule the
      // item for today forever.
      const nextInterval =
        nextReps === 1 ? 1 :
        nextReps === 2 ? 6 :
        Math.max(1, Math.round(interval * ease));
      return {
        ease: Math.min(SM2_MAX_EASE, round2(ease + 0.1)),
        interval_days: nextInterval,
        reps: nextReps,
      };
    };

    // One schedule row per item answered, folded over the session's attempts.
    // FIRST-TRY ONLY and never `speaking`, for the same reason the 80% gate
    // excludes them: a retry is re-exposure of a known answer, and a speaking
    // "correct" is the learner's own opinion of their pronunciation. Scheduling
    // on either would teach the scheduler that the learner knows things they do
    // not.
    const scheduleUpdates = (attempts, existing, today) => {
      const prior = existing || new Map();
      const out = new Map();
      for (const a of scoreableAttempts(attempts)) {
        if (a.pool_item_id == null) continue;
        // An item can be asked twice in one session in two different formats.
        // The first answer is the one the scheduler believes — it is the only
        // one taken cold.
        if (out.has(a.pool_item_id)) continue;
        const next = sm2(prior.get(a.pool_item_id), a.correct);
        out.set(a.pool_item_id, { ...next, due_on: addDays(today, next.interval_days) });
      }
      return out;
    };

    // What this learner owes on this lesson today. `due_on <= today` rather than
    // `=== today`: a learner who skips four days must still be shown what came
    // due while they were away, not have it silently pass.
    const dueItems = (schedule, today) => {
      const due = new Set();
      for (const [id, row] of schedule || new Map()) {
        if (!row?.due_on || dayDiff(row.due_on, today) >= 0) due.add(id);
      }
      return due;
    };

    // ── Streak ──
    // One streak per learner, not per language and not per lesson: it answers
    // "did you show up today", which is a fact about the person. Keying it by
    // language would break the streak of someone who does Lingala on Monday and
    // Yoruba on Tuesday — punishing exactly the behaviour the app wants.
    const streakNext = (prev, today) => {
      const last = prev?.last_day || null;
      const current = prev?.current_streak || 0;
      const longest = prev?.longest_streak || 0;

      if (!last) return { current_streak: 1, longest_streak: Math.max(1, longest), last_day: today };

      const gap = dayDiff(last, today);
      // gap <= 0 covers both the second session of the same day and a clock that
      // has moved backwards — a flight west, or a device correcting its time.
      // Neither is a new day, and neither may break a streak the learner kept.
      if (gap <= 0) return { current_streak: current, longest_streak: longest, last_day: last };

      const next = gap === 1 ? current + 1 : 1;
      return { current_streak: next, longest_streak: Math.max(longest, next), last_day: today };
    };

    // A streak the learner has already broken should read as broken on the home
    // screen, without waiting for them to finish another session to find out.
    const streakDisplay = (row, today) => {
      if (!row?.last_day) return 0;
      const gap = dayDiff(row.last_day, today);
      return gap <= 1 ? (row.current_streak || 0) : 0;
    };

    // ── Medals ──
    // Best score, not last score: a medal is a high-water mark, so a bad session
    // can never take one away. 80 is the Pratiquer pass bar, so bronze and
    // "lesson certified" are deliberately the same moment.
    const MEDAL_TIERS = [
      { key: "or",      pct: 100, icon: "🏆", label: "Sans faute" },
      { key: "argent",  pct: 90,  icon: "🥈", label: "Argent" },
      { key: "bronze",  pct: 80,  icon: "🥉", label: "Bronze" },
    ];
    const medalFor = (pct) => MEDAL_TIERS.find((m) => (pct || 0) >= m.pct) || null;

    // ── Bonuses and levels ──
    // A perfect session is worth a flat bonus rather than a multiplier: 100%
    // first-try on 20 questions is the same achievement whether the lesson is
    // long or short, and a multiplier would quietly pay more for the lessons
    // that happen to build longer sessions.
    const PERFECT_BONUS_XP = 50;
    const perfectBonus = (pct) => ((pct || 0) >= 100 ? PERFECT_BONUS_XP : 0);

    // Élargir levels up on topic XP. A full session is 200 XP, so a level is
    // roughly three sessions.
    const ELARGIR_XP_PER_LEVEL = 600;
    const ELARGIR_MAX_LEVEL = 5;
    const elargirLevel = (xp) =>
      Math.min(ELARGIR_MAX_LEVEL, 1 + Math.floor(Math.max(0, xp || 0) / ELARGIR_XP_PER_LEVEL));
    const elargirLevelProgress = (xp) => {
      const into = Math.max(0, xp || 0) % ELARGIR_XP_PER_LEVEL;
      return elargirLevel(xp) >= ELARGIR_MAX_LEVEL
        ? { into: ELARGIR_XP_PER_LEVEL, of: ELARGIR_XP_PER_LEVEL, pct: 100 }
        : { into, of: ELARGIR_XP_PER_LEVEL, pct: Math.round(100 * into / ELARGIR_XP_PER_LEVEL) };
    };

    // 0 at level 1 (the shipped mix, unchanged), 1 at the top level. Passed to
    // buildSession, which spends it on the recognition/production balance.
    const productionBias = (level) =>
      Math.min(1, Math.max(0, ((level || 1) - 1) / (ELARGIR_MAX_LEVEL - 1)));

    // ── Match-pairs screen ────────────────────────────────────────────────────
    const MatchPairsScreen = ({ exercise, onDone, onMiss, onAnswer }) => {
      const [solved, setSolved] = useState([]);     // pair ids cleared
      const [pickFr, setPickFr] = useState(null);
      const [pickLn, setPickLn] = useState(null);
      const [wrong, setWrong] = useState(null);      // {fr, truth}
      const [shakeIds, setShakeIds] = useState([]);
      const lnOrder = React.useMemo(() => shuffle(exercise.pairs), [exercise]);

      // Which pairs have already been answered wrong on this screen. A pair is
      // first-try correct only if it is not in here when it is finally matched —
      // that is the number the 80% gate reads, so it is tracked in a ref rather
      // than state: `choose` must see the value it just wrote, in the same tick.
      const missedHere = React.useRef(new Set());

      const choose = (side, pair) => {
        if (solved.includes(pair.id)) return;
        if (side === "ln") playClip(pair.audio);       // hear it on every tap
        const nextFr = side === "fr" ? (pickFr?.id === pair.id ? null : pair) : pickFr;
        const nextLn = side === "ln" ? (pickLn?.id === pair.id ? null : pair) : pickLn;
        setPickFr(nextFr); setPickLn(nextLn);
        if (!nextFr || !nextLn) return;

        if (nextFr.id === nextLn.id) {
          const list = [...solved, nextFr.id];
          setSolved(list); setPickFr(null); setPickLn(null); setWrong(null);

          // One pair = one question. A retry screen is re-exposure of what was
          // already answered, so it reports nothing — counting it would let the
          // 80% gate be farmed by failing, then clearing the retry.
          if (!exercise.retry) onAnswer(nextFr, !missedHere.current.has(nextFr.id));

          // The clip belongs to the MATCH, not to the Lingala tap. A pair can be
          // closed from either tile, so tying playback to the tap meant a match
          // finished on the French side played nothing at all. `playingClip`
          // keeps a clip already sounding from restarting mid-word.
          const clip = playingClip(nextFr.audio) || playClip(nextFr.audio);

          // The last match hands over to the next screen, which autoplays its own
          // prompt on mount — and playClip stops whatever is sounding. Handing
          // over on a 420ms timer cut off the final word every time and replaced
          // it with "Qu'est-ce que vous entendez ?". Wait for the clip instead.
          if (list.length === exercise.pairs.length) afterClip(clip, onDone);
        } else {
          // The French tile is the question here — "which Lingala goes with this?"
          // — so the mis-pairing is charged to it. The Lingala tile the learner
          // reached for was a wrong answer, not a question they have failed.
          setWrong({ fr: nextFr.fr, truth: nextFr.ln });
          setShakeIds([nextFr.id, nextLn.id]);
          missedHere.current.add(nextFr.id);
          onMiss(nextFr);
          setTimeout(() => { setShakeIds([]); setPickFr(null); setPickLn(null); }, 700);
        }
      };

      const Tile = ({ pair, side }) => {
        const done = solved.includes(pair.id);
        const picked = (side === "fr" ? pickFr : pickLn)?.id === pair.id;
        const shaking = shakeIds.includes(pair.id) && picked === false ? false : shakeIds.includes(pair.id);
        return (
          <button
            onClick={() => choose(side, pair)}
            aria-pressed={picked}
            disabled={done}
            style={{
              minHeight: 60, padding: "12px 10px", borderRadius: 8,
              border: `1.5px solid ${shaking ? "var(--m-wrong)" : picked ? "var(--m-purple-dark)" : "var(--m-line)"}`,
              background: shaking ? "var(--m-wrong-soft)" : picked ? "var(--m-purple-soft)" : "white",
              color: done ? "var(--m-muted)" : side === "ln" ? "var(--m-forest)" : "var(--m-ink)",
              fontFamily: side === "ln" ? "'Playfair Display', serif" : "'DM Sans', sans-serif",
              fontWeight: side === "ln" ? 700 : 500,
              fontSize: side === "ln" ? 17 : 15,
              opacity: done ? 0.34 : 1,
              cursor: done ? "default" : "pointer",
              transform: picked ? "scale(0.97)" : "none",
              transition: "border-color .15s, background .15s, opacity .3s, transform .12s",
              display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center",
            }}>
            {side === "fr" ? pair.fr : pair.ln}
          </button>
        );
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 19, fontWeight: 600, margin: "0 0 20px", lineHeight: 1.35 }}>
            Associez chaque mot à sa traduction
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, alignContent: "start" }}>
            {exercise.pairs.map((p, i) => (
              <React.Fragment key={p.id}>
                <Tile pair={p} side="fr" />
                <Tile pair={lnOrder[i]} side="ln" />
              </React.Fragment>
            ))}
          </div>
          <div style={{ flex: 1, minHeight: 12 }} />
          {wrong && (
            <div style={{ background: "var(--m-wrong-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: "0 0 4px", fontWeight: 700, fontSize: 15, color: "var(--m-wrong)" }}>✕ Pas tout à fait</p>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45 }}>
                « {wrong.fr} » se dit{" "}
                <b style={{ fontFamily: "'Playfair Display', serif", color: "var(--m-forest)" }}>{wrong.truth}</b>.
              </p>
            </div>
          )}
        </div>
      );
    };


    // ── Choose-the-audio ──────────────────────────────────────────────────────
    // The professor's recording is the prompt and the French options are the
    // answers, rather than the reverse. `CORPUS_PIPELINE.md` specced it the other
    // way — one written prompt, three clips to compare — but that tests whether
    // you can tell two recordings apart, which is not a skill anyone needs. This
    // way tests understanding spoken Lingala, which is the whole point, and costs
    // one tap instead of three.
    const AUDIO_OPTIONS = 4;

    const audioBuckets = (rows, level) => {
      const ok = (rows || []).filter(r =>
        usableRow(r) && r.audio_url &&
        r.effective_level <= level);
      const buckets = {};
      for (const r of ok) (buckets[`${r.orthography}|${shapeBand(r)}`] ||= []).push(r);
      return Object.values(buckets).map(list => {
        const seen = new Set(), out = [];
        for (const r of [...list].sort((a, b) => TIER_RANK[a.tier] - TIER_RANK[b.tier])) {
          const k = r.french.trim().toLowerCase();
          if (seen.has(k)) continue;
          seen.add(k); out.push(r);
        }
        return out;
      }).filter(b => b.length >= AUDIO_OPTIONS).sort((a, b) => b.length - a.length);
    };

    // Distractors come from the same bucket — same lesson, same shape, same
    // orthography — so a wrong option is never dismissable on sight. Pulling them
    // from anywhere in the pool would make the answer obvious without listening.
