    const buildChooseAudio = (answer, bucket) => {
      const others = shuffle(bucket.filter(r =>
        r.source_id !== answer.source_id &&
        r.french.trim().toLowerCase() !== answer.french.trim().toLowerCase()))
        .slice(0, AUDIO_OPTIONS - 1);
      return {
        type: "choose_audio",
        answer: {
          id: itemId(answer), poolId: answer.id,
          fr: answer.french.trim(), ln: answer.lingala.trim(), audio: answer.audio_url,
        },
        options: shuffle([answer, ...others].map(r => ({
          id: itemId(r), fr: r.french.trim(),
        }))),
      };
    };

    // A drawn waveform, not a measured one. Reading real amplitudes means routing
    // the element through Web Audio, and R2 sends no Access-Control-Allow-Origin
    // — a cross-origin element in an audio graph outputs silence, so measuring
    // the wave would cost us the sound. Heights are seeded from the item id so a
    // clip always draws the same shape instead of jittering on every render, and
    // the fill tracks real playback position, which is the part that is true.
    const WAVE_BARS = 32;
    const waveShape = (seed) => {
      let h = 2166136261;
      for (let i = 0; i < (seed || "").length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619) >>> 0;
      return Array.from({ length: WAVE_BARS }, () => {
        h = (Math.imul(h, 1664525) + 1013904223) >>> 0;
        return 0.22 + (h % 1000) / 1000 * 0.78;
      });
    };

    // The play button and waveform, shared by every screen whose prompt is a
    // recording. Nothing plays until the learner asks for it — autoplay-on-mount
    // used to fire the instant the previous screen handed over, which is how a
    // match-pairs answer got talked over by the next question.
    const ClipPlayer = ({ audio, seed }) => {
      const [playing, setPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const audioRef = React.useRef(null);
      const rafRef = React.useRef(null);

      const bars = React.useMemo(() => waveShape(seed), [seed]);

      const play = () => {
        const a = playClip(audio);
        audioRef.current = a;
        if (!a) return;
        setPlaying(true);
        cancelAnimationFrame(rafRef.current);
        const tick = () => {
          const el = audioRef.current;
          if (!el) return;
          const d = isFinite(el.duration) && el.duration > 0 ? el.duration : 0;
          if (el.paused || el.ended) { setPlaying(false); setProgress(0); return; }
          setProgress(d ? Math.min(1, el.currentTime / d) : 0);
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      };

      useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

      return (
        <div style={{
          display: "flex", alignItems: "center", gap: 14,
          padding: "16px 18px", borderRadius: 10, background: "white",
          border: "1px solid var(--m-line)",
        }}>
          <button onClick={play} aria-label={playing ? "En lecture" : "Écouter"}
            style={{
              flex: "0 0 auto", width: 64, height: 64, borderRadius: 32, border: "none",
              background: "var(--m-forest)",
              color: "white", fontSize: 24, cursor: "pointer",
              boxShadow: "0 6px 18px rgba(107,33,168,0.28)",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>{playing ? "❙❙" : "▶"}</button>

          {/* Bars left of the playhead are lit, the rest are waiting. */}
          <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 3, height: 56 }}>
            {bars.map((h, i) => {
              const passed = playing && i / WAVE_BARS <= progress;
              return (
                <div key={i} style={{
                  flex: 1, height: `${h * 100}%`, minWidth: 2, borderRadius: 2,
                  background: passed ? "var(--m-purple-dark)" : "var(--m-line)",
                  transform: passed ? "scaleY(1)" : "scaleY(0.82)",
                  transition: "background .12s linear, transform .12s linear",
                }} />
              );
            })}
          </div>
        </div>
      );
    };

    const ChooseAudioScreen = ({ exercise, onDone, onMiss, onAnswer }) => {
      const [wrongIds, setWrongIds] = useState([]);
      const [solved, setSolved] = useState(false);

      const choose = (opt) => {
        if (solved || wrongIds.includes(opt.id)) return;
        if (opt.id === exercise.answer.id) {
          setSolved(true);
          // One screen, one question — first try means no wrong option yet.
          if (!exercise.retry) onAnswer(exercise.answer, wrongIds.length === 0);
          // A learner often answers while the clip is still sounding. Handing
          // over on a timer would clip the professor mid-word, so wait for it —
          // and hold the 620ms reveal beat when it has already finished.
          afterClip(playingClip(exercise.answer.audio), onDone, 620);
        } else {
          setWrongIds(w => [...w, opt.id]);
          onMiss({ id: exercise.answer.id, fr: exercise.answer.fr, ln: exercise.answer.ln });
        }
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 19, fontWeight: 600, margin: "0 0 20px", lineHeight: 1.35 }}>
            Qu'est-ce que vous entendez&nbsp;?
          </p>

          <div style={{ marginBottom: 12 }}>
            <ClipPlayer audio={exercise.answer.audio} seed={exercise.answer.id} />
          </div>

          {/* The line being played, so the sound can be matched to its spelling.
              Note this makes the question answerable by reading rather than by
              listening — deliberate, as reading support for beginners. */}
          <p style={{
            textAlign: "center", margin: "0 0 6px", fontWeight: 700,
            // Sentences run to ten tokens in this pool; at 20px a long one eats
            // the options below it on a 375px screen.
            fontSize: exercise.answer.ln.length > 40 ? 17 : 20,
            fontFamily: "'Playfair Display', serif", color: "var(--m-forest)", lineHeight: 1.3,
          }}>{exercise.answer.ln}</p>
          <p style={{ textAlign: "center", fontSize: 12, color: "var(--m-muted)",
                      fontFamily: "'DM Mono', monospace", margin: "0 0 20px" }}>
            Touchez ▶ pour écouter
          </p>

          <div style={{ display: "grid", gap: 10 }}>
            {exercise.options.map(o => {
              const isWrong = wrongIds.includes(o.id);
              const isRight = solved && o.id === exercise.answer.id;
              return (
                <button key={o.id} onClick={() => choose(o)} disabled={isWrong || solved}
                  style={{
                    minHeight: 56, padding: "12px 16px", borderRadius: 8,
                    border: `1.5px solid ${isRight ? "var(--m-correct)" : isWrong ? "var(--m-wrong)" : "var(--m-line)"}`,
                    background: isRight ? "var(--m-green-soft)" : isWrong ? "var(--m-wrong-soft)" : "white",
                    color: isRight ? "var(--m-correct)" : isWrong ? "var(--m-wrong)" : "var(--m-ink)",
                    fontFamily: "'DM Sans', sans-serif", fontSize: 15, fontWeight: 500,
                    opacity: isWrong ? 0.55 : 1,
                    cursor: (isWrong || solved) ? "default" : "pointer",
                    transition: "border-color .15s, background .15s, opacity .2s",
                  }}>{o.fr}</button>
              );
            })}
          </div>

          <div style={{ flex: 1, minHeight: 12 }} />

          {/* The Lingala is already on screen above, so the confirmation carries
              the French alone rather than reprinting the pair. */}
          {solved && (
            <div style={{ background: "var(--m-green-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45, color: "var(--m-correct)", fontWeight: 600 }}>
                ✓ {exercise.answer.fr}
              </p>
            </div>
          )}
          {wrongIds.length > 0 && !solved && (
            <div style={{ background: "var(--m-wrong-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, color: "var(--m-wrong)", fontWeight: 600 }}>
                Réécoutez et réessayez.
              </p>
            </div>
          )}
        </div>
      );
    };

    // ── Tap words in order ────────────────────────────────────────────────────
    const WordOrderScreen = ({ exercise, onDone, onMiss, onAnswer }) => {
      const [placed, setPlaced] = useState([]);   // bank entries, in tapped order
      const [wrong, setWrong] = useState(false);
      const [solved, setSolved] = useState(false);
      const missedHere = React.useRef(false);

      // Each tile carries its own key rather than being identified by its text.
      // A sentence can use the same word twice ("na" is everywhere in Lingala),
      // and two tiles reading "na" must stay two separate tiles.
      const bank = React.useMemo(
        () => shuffle(exercise.tokens.map((text, i) => ({ key: i, text }))),
        [exercise]);

      const remaining = bank.filter(t => !placed.some(p => p.key === t.key));

      const check = (next) => {
        if (next.map(t => t.text).join(" ") === exercise.tokens.join(" ")) {
          setSolved(true);
          if (!exercise.retry) onAnswer(exercise.item, !missedHere.current);
          // Hear it once it is right — the same reward beat as a solved pair —
          // and do not hand over until the clip has finished.
          afterClip(playingClip(exercise.item.audio) || playClip(exercise.item.audio), onDone);
        } else {
          setWrong(true);
          missedHere.current = true;
          onMiss(exercise.item);
          // Clear back to the bank rather than leaving a wrong sentence on
          // screen: the learner rebuilds it, which is the practice.
          setTimeout(() => { setPlaced([]); setWrong(false); }, 900);
        }
      };

      const tapBank = (tile) => {
        if (solved || wrong) return;
        const next = [...placed, tile];
        setPlaced(next);
        if (next.length === exercise.tokens.length) check(next);
      };

      const tapPlaced = (tile) => {
        if (solved || wrong) return;
        setPlaced(placed.filter(p => p.key !== tile.key));
      };

      const Tile = ({ tile, onTap, muted }) => (
        <button onClick={() => onTap(tile)} disabled={solved || wrong}
          style={{
            minHeight: 44, padding: "10px 14px", borderRadius: 8,
            border: `1.5px solid ${muted ? "var(--m-line)" : "var(--m-line)"}`,
            background: muted ? "var(--m-canvas)" : "white",
            color: muted ? "transparent" : "var(--m-ink)",
            fontFamily: "'Playfair Display', serif", fontSize: 16, fontWeight: 600,
            cursor: solved || wrong ? "default" : "pointer",
            transition: "border-color .15s, background .15s",
          }}>{tile.text}</button>
      );

      return (
        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 13, color: "var(--m-muted)", margin: "0 0 6px",
                      fontFamily: "'DM Mono', monospace", letterSpacing: ".06em",
                      textTransform: "uppercase" }}>
            Remettez les mots dans l'ordre
          </p>
          <p style={{ fontSize: 19, fontWeight: 600, margin: "0 0 18px", lineHeight: 1.35 }}>
            {exercise.item.fr}
          </p>

          {/* Answer zone. Keeps a minimum height so the layout does not jump as
              tiles move between the two areas. */}
          <div style={{
            display: "flex", flexWrap: "wrap", gap: 8, alignContent: "flex-start",
            minHeight: 108, padding: 12, borderRadius: 8,
            border: `1.5px solid ${wrong ? "var(--m-wrong)" : solved ? "var(--m-correct)" : "var(--m-line)"}`,
            background: wrong ? "var(--m-wrong-soft)" : solved ? "var(--m-green-soft)" : "white",
            transition: "border-color .15s, background .15s",
          }}>
            {placed.map(t => <Tile key={t.key} tile={t} onTap={tapPlaced} />)}
          </div>

          <div style={{ height: 16 }} />

          {/* Bank. Placed tiles leave a greyed gap rather than reflowing the
              remaining ones, so a tile does not move under the finger. */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {bank.map(t => placed.some(p => p.key === t.key)
              ? <Tile key={t.key} tile={t} onTap={() => {}} muted />
              : <Tile key={t.key} tile={t} onTap={tapBank} />)}
          </div>

          <div style={{ flex: 1, minHeight: 12 }} />

          {solved && (
            <div style={{ background: "var(--m-green-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, color: "var(--m-correct)", fontWeight: 600 }}>
                ✓ {exercise.item.ln}
              </p>
            </div>
          )}
          {wrong && (
            <div style={{ background: "var(--m-wrong-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45 }}>
                <b style={{ fontFamily: "'Playfair Display', serif", color: "var(--m-forest)" }}>{exercise.item.ln}</b>
              </p>
            </div>
          )}
        </div>
      );
    };

    // ── Fill the blank ────────────────────────────────────────────────────────
    const FillBlankScreen = ({ exercise, onDone, onMiss, onAnswer }) => {
      const [typed, setTyped] = useState("");
      const [wrong, setWrong] = useState(false);
      const [solved, setSolved] = useState(false);
      const missedHere = React.useRef(false);

      // True when the answer was right but spelled without its accents. This is
      // the teaching moment the leniency is paid for with: accepting "mbula" and
      // then showing "Mbúla" is what stops it teaching that tone is optional.
      const [showedAccent, setShowedAccent] = useState(false);

      const submit = () => {
        if (solved || wrong || !typed.trim()) return;
        if (sameWord(typed, exercise.answer)) {
          setShowedAccent(typed.trim() !== exercise.answer);
          setSolved(true);
          if (!exercise.retry) onAnswer(exercise.item, !missedHere.current);
          // Audio plays only AFTER the answer. The clip is the professor saying
          // the whole sentence — playing it first would read the missing word
          // aloud and hand over the answer.
          afterClip(playClip(exercise.item.audio), onDone);
        } else {
          setWrong(true);
          missedHere.current = true;
          onMiss(exercise.item);
          setTimeout(() => { setWrong(false); setTyped(""); }, 1400);
        }
      };

      const border = wrong ? "var(--m-wrong)" : solved ? "var(--m-correct)" : "var(--m-muted)";

      return (
        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 13, color: "var(--m-muted)", margin: "0 0 6px",
                      fontFamily: "'DM Mono', monospace", letterSpacing: ".06em",
                      textTransform: "uppercase" }}>
            Complétez la phrase
          </p>
          <p style={{ fontSize: 19, fontWeight: 600, margin: "0 0 18px", lineHeight: 1.35 }}>
            {exercise.item.fr}
          </p>

          {/* The sentence with the gap inline, so the missing word is read in
              context rather than as a detached quiz prompt. */}
          <div style={{
            display: "flex", flexWrap: "wrap", alignItems: "center", gap: "8px 6px",
            padding: 14, borderRadius: 8, border: "1px solid var(--m-line)", background: "white",
            fontFamily: "'Playfair Display', serif", fontSize: 18, color: "var(--m-ink)",
          }}>
            {exercise.tokens.map((t, i) => i === exercise.blankIndex ? (
              solved ? (
                <b key={i} style={{ color: "var(--m-correct)" }}>{exercise.answer}</b>
              ) : (
                <input key={i} value={typed} onChange={e => setTyped(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); submit(); } }}
                  autoFocus
                  // iOS autocorrect rewrites Lingala into French words, and
                  // autocapitalise would fight every lowercase answer. 16px is
                  // the floor that stops iOS zooming the page on focus.
                  autoCapitalize="none" autoCorrect="off" autoComplete="off"
                  spellCheck={false} enterKeyHint="done"
                  aria-label="Mot manquant"
                  style={{
                    width: `${Math.max(5, [...exercise.answer].length + 1)}ch`,
                    minHeight: 44, fontSize: 16, padding: "4px 8px",
                    fontFamily: "'DM Sans', sans-serif",
                    border: "none", borderBottom: `2px solid ${border}`,
                    background: wrong ? "var(--m-wrong-soft)" : "transparent",
                    color: "var(--m-ink)", outline: "none", textAlign: "center",
                    transition: "border-color .15s, background .15s",
                  }} />
              )
            ) : (
              <span key={i}>{t}</span>
            ))}
          </div>

          {!solved && (
            <button onClick={submit} disabled={!typed.trim() || wrong}
              style={{
                marginTop: 14, width: "100%", minHeight: 52, borderRadius: 8, border: "none",
                background: !typed.trim() || wrong ? "var(--m-line)" : "var(--m-forest)",
                color: !typed.trim() || wrong ? "var(--m-muted)" : "white",
                fontSize: 16, fontWeight: 700, fontFamily: "'DM Sans', sans-serif",
                cursor: !typed.trim() || wrong ? "default" : "pointer",
              }}>Vérifier</button>
          )}

          <div style={{ flex: 1, minHeight: 12 }} />

          {solved && (
            <div style={{ background: "var(--m-green-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, color: "var(--m-correct)", fontWeight: 600 }}>
                ✓ {exercise.item.ln}
              </p>
              {showedAccent && (
                <p style={{ margin: "6px 0 0", fontSize: 13, color: "var(--m-muted)" }}>
                  Avec les accents&nbsp;:{" "}
                  <b style={{ fontFamily: "'Playfair Display', serif", color: "var(--m-forest)" }}>
                    {exercise.answer}
                  </b>
                </p>
              )}
            </div>
          )}
          {wrong && (
            <div style={{ background: "var(--m-wrong-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45 }}>
                <b style={{ fontFamily: "'Playfair Display', serif", color: "var(--m-forest)" }}>{exercise.answer}</b>
                {" — réessayez."}
              </p>
            </div>
          )}
        </div>
      );
    };

    // ── Listen and type ───────────────────────────────────────────────────────
    const ListenTypeScreen = ({ exercise, onDone, onMiss, onAnswer }) => {
      const [placed, setPlaced] = useState([]);   // tiles, in tapped order
      const [wrong, setWrong] = useState(false);
      const [solved, setSolved] = useState(false);
      const missedHere = React.useRef(false);

      const plain = exercise.words.map(w => w.join("")).join(" ");   // what the tiles spell
      const real = exercise.item.ln;                                  // how it is really written
      const slots = exercise.words.reduce((n, w) => n + w.length, 0);
      // True when the real spelling carries something the tiles did not offer —
      // a tone, an ɛ or ɔ. That difference is the thing worth pointing at.
      const accented = plain !== real.toLowerCase();

      const check = (next) => {
        // Compared against the FOLDED spelling, because that is what the tiles
        // offer. The accents are taught in the reveal instead of being demanded
        // from someone who has heard the word once.
        if (next.map(t => t.ch).join("") === exercise.words.flat().join("")) {
          setSolved(true);
          if (!exercise.retry) onAnswer(exercise.item, !missedHere.current);
          afterClip(playingClip(exercise.item.audio) || playClip(exercise.item.audio), onDone);
        } else {
          setWrong(true);
          missedHere.current = true;
          onMiss(exercise.item);
          setTimeout(() => { setPlaced([]); setWrong(false); }, 1400);
        }
      };

      const tapTile = (tile) => {
        if (solved || wrong || placed.length >= slots) return;
        const next = [...placed, tile];
        setPlaced(next);
        if (next.length === slots) check(next);
      };

      const tapPlaced = (i) => {
        if (solved || wrong) return;
        setPlaced(placed.filter((_, j) => j !== i));
      };

      // Which slot each placed character lands in, word by word. The gap between
      // words is drawn rather than typed, so the learner never hunts for a space.
      let cursor = 0;
      const rows = exercise.words.map((w, wi) => {
        const start = cursor; cursor += w.length;
        return { wi, start, length: w.length };
      });

      return (
        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 13, color: "var(--m-muted)", margin: "0 0 6px",
                      fontFamily: "'DM Mono', monospace", letterSpacing: ".06em",
                      textTransform: "uppercase" }}>
            Écrivez ce que vous entendez
          </p>

          <div style={{ marginBottom: 16 }}>
            <ClipPlayer audio={exercise.item.audio} seed={exercise.item.id} />
          </div>

          {/* One group of slots per word. */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 16, justifyContent: "center",
                        minHeight: 56, marginBottom: 18 }}>
            {rows.map(({ wi, start, length }) => (
              // Wraps within the word too: at 14 characters a single row of
              // slots is 476px against 339px of usable width, and the one thing
              // no screen may do is scroll sideways.
              <div key={wi} style={{ display: "flex", gap: 4, flexWrap: "wrap", justifyContent: "center" }}>
                {Array.from({ length }, (_, k) => {
                  const tile = placed[start + k];
                  return (
                    <button key={k} onClick={() => tile && tapPlaced(start + k)}
                      disabled={!tile || solved || wrong}
                      style={{
                        width: slots > 10 ? 26 : 30, height: 44, borderRadius: 8, border: "none",
                        borderBottom: `2px solid ${wrong ? "var(--m-wrong)" : solved ? "var(--m-correct)" : "var(--m-muted)"}`,
                        background: "transparent", cursor: tile && !solved ? "pointer" : "default",
                        fontFamily: "'Playfair Display', serif", fontSize: 20, fontWeight: 700,
                        color: wrong ? "var(--m-wrong)" : solved ? "var(--m-correct)" : "var(--m-ink)",
                        padding: 0, transition: "border-color .15s, color .15s",
                      }}>{tile ? tile.ch : ""}</button>
                  );
                })}
              </div>
            ))}
          </div>

          {/* The bank. A used tile greys out in place rather than vanishing, so
              the letters never shuffle under a finger mid-word. */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" }}>
            {exercise.tiles.map(t => {
              const used = placed.some(p => p.key === t.key);
              return (
                <button key={t.key} onClick={() => tapTile(t)} disabled={used || solved || wrong}
                  style={{
                    minWidth: 44, minHeight: 44, padding: "8px 10px", borderRadius: 10,
                    border: `1.5px solid ${used ? "var(--m-line)" : "var(--m-line)"}`,
                    background: used ? "var(--m-canvas)" : "white",
                    color: used ? "transparent" : "var(--m-ink)",
                    fontFamily: "'Playfair Display', serif", fontSize: 18, fontWeight: 600,
                    cursor: used || solved || wrong ? "default" : "pointer",
                    transition: "background .15s, border-color .15s",
                  }}>{t.ch}</button>
              );
            })}
          </div>

          <div style={{ flex: 1, minHeight: 12 }} />

          {/* The reveal is where the real orthography is taught: the learner
              built plain letters, and this is how the word is actually written. */}
          {solved && (
            <div style={{ background: "var(--m-green-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 15, fontWeight: 700,
                          fontFamily: "'Playfair Display', serif", color: "var(--m-correct)" }}>
                ✓ {real}
              </p>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: "var(--m-muted)" }}>{exercise.item.fr}</p>
              {accented && (
                <p style={{ margin: "8px 0 0", fontSize: 13, color: "var(--m-muted)" }}>
                  Vous avez écrit <i>{plain}</i> — avec les tons, cela s'écrit{" "}
                  <b style={{ fontFamily: "'Playfair Display', serif", color: "var(--m-forest)" }}>{real}</b>
                </p>
              )}
            </div>
          )}
          {wrong && (
            <div style={{ background: "var(--m-wrong-soft)", borderRadius: 8, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45 }}>
                <b style={{ fontFamily: "'Playfair Display', serif", color: "var(--m-forest)" }}>{real}</b>
                {" — "}{exercise.item.fr}
              </p>
            </div>
          )}
        </div>
      );
    };

    const SpeakingScreen = ({ exercise, onDone, onAnswer }) => {
      const [phase, setPhase] = useState("ready");
      const [seconds, setSeconds] = useState(0);
      const [error, setError] = useState("");
      const [hasCompared, setHasCompared] = useState(false);
      const recorderRef = useRef(null);
      const streamRef = useRef(null);
      const chunksRef = useRef([]);
      const recordingUrlRef = useRef(null);
      const compareAudioRef = useRef(null);
      const timerRef = useRef(null);
      const startedAtRef = useRef(0);
      const MAX_RECORDING_MS = 12000;

      const stopTimer = () => {
        clearInterval(timerRef.current);
        timerRef.current = null;
      };

      const stopTracks = () => {
        (streamRef.current?.getTracks() || []).forEach(track => track.stop());
        streamRef.current = null;
      };

      const resetComparisonAudio = () => {
        const audio = compareAudioRef.current;
        if (!audio) return;
        audio.pause();
        audio.onended = null;
        audio.onerror = null;
        audio.src = exercise.item.audio;
        audio.load();
      };

      const revokeRecording = () => {
        if (recordingUrlRef.current) URL.revokeObjectURL(recordingUrlRef.current);
        recordingUrlRef.current = null;
      };

      const stopRecording = () => {
        stopTimer();
        const recorder = recorderRef.current;
        if (recorder && recorder.state !== "inactive") {
          try { recorder.stop(); } catch (e) { stopTracks(); }
        } else {
          stopTracks();
        }
      };

      useEffect(() => {
        const audio = new Audio();
        audio.preload = "auto";
        audio.src = exercise.item.audio;
        audio.load();
        compareAudioRef.current = audio;
        return () => {
          stopTimer();
          const recorder = recorderRef.current;
          if (recorder && recorder.state !== "inactive") {
            recorder.ondataavailable = null;
            recorder.onstop = null;
            try { recorder.stop(); } catch (e) {}
          }
          stopTracks();
          audio.pause();
          audio.removeAttribute("src");
          audio.load();
          revokeRecording();
        };
      }, []);

      const startRecording = async () => {
        setError("");
        setHasCompared(false);
        resetComparisonAudio();
        revokeRecording();
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          setError("L'enregistrement vocal n'est pas disponible dans ce navigateur.");
          setPhase("error");
          return;
        }
        setPhase("requesting");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
          streamRef.current = stream;
          const candidates = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"];
          const mimeType = candidates.find(type => MediaRecorder.isTypeSupported(type)) || "";
          const options = mimeType
            ? { mimeType, audioBitsPerSecond: 64000 }
            : { audioBitsPerSecond: 64000 };
          const recorder = new MediaRecorder(stream, options);
          chunksRef.current = [];
          recorderRef.current = recorder;
          recorder.ondataavailable = event => {
            if (event.data?.size) chunksRef.current.push(event.data);
          };
          recorder.onstop = () => {
            stopTimer();
            stopTracks();
            const type = recorder.mimeType || mimeType || "audio/mp4";
            const blob = new Blob(chunksRef.current, { type });
            chunksRef.current = [];
            if (blob.size < 200) {
              setError("Aucun son n'a été enregistré. Réessayez près du microphone.");
              setPhase("error");
              return;
            }
            recordingUrlRef.current = URL.createObjectURL(blob);
            setPhase("recorded");
          };
          recorder.start(250);
          startedAtRef.current = Date.now();
          setSeconds(0);
          setPhase("recording");
          timerRef.current = setInterval(() => {
            const elapsed = Date.now() - startedAtRef.current;
            setSeconds(Math.min(12, Math.ceil(elapsed / 1000)));
            if (elapsed >= MAX_RECORDING_MS) stopRecording();
          }, 200);
        } catch (e) {
          stopTracks();
          setError(e.name === "NotAllowedError"
            ? "Accès au microphone refusé. Autorisez-le dans les réglages du navigateur."
            : `Impossible d'utiliser le microphone : ${e.message}`);
          setPhase("error");
        }
      };

      const playProfessor = () => {
        resetComparisonAudio();
        const audio = compareAudioRef.current;
        if (!audio) return;
        audio.play().catch(() => setError("Impossible de lire l'enregistrement du professeur."));
      };

      const playComparison = () => {
        const audio = compareAudioRef.current;
        const learnerUrl = recordingUrlRef.current;
        if (!audio || !learnerUrl) return;
        setError("");
        setPhase("comparing");
        let learnerTurn = false;
        const finish = () => {
          audio.onended = null;
          audio.onerror = null;
          audio.src = exercise.item.audio;
          audio.load();
          setHasCompared(true);
          setPhase("recorded");
        };
        const playLearner = () => {
          if (learnerTurn) { finish(); return; }
          learnerTurn = true;
          audio.src = learnerUrl;
          audio.load();
          audio.play().catch(() => {
            finish();
            setError("Touchez à nouveau « Comparer les deux voix » pour écouter votre voix.");
          });
        };
        audio.pause();
        audio.src = exercise.item.audio;
        audio.currentTime = 0;
        audio.load();
        audio.onended = playLearner;
        audio.onerror = () => learnerTurn ? finish() : playLearner();
        audio.play().catch(() => {
          setPhase("recorded");
          setError("Impossible de démarrer la comparaison audio.");
        });
      };

      const rate = (good) => {
        resetComparisonAudio();
        // `correct` stores the learner's own judgement for speaking history.
        // `scored:false` keeps it out of the objective 80% mastery calculation.
        onAnswer(exercise.item, good, { scored: false });
        onDone();
      };

      const recorded = phase === "recorded" || phase === "comparing";

      return (
        <div style={{ minHeight: "calc(100dvh - 172px)", display: "flex", flexDirection: "column",
                      textAlign: "center", padding: "10px 0 0" }}>
          <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                      textTransform: "uppercase", color: "var(--m-muted)", marginBottom: 10 }}>
            Comparez votre prononciation
          </p>
          <p style={{ fontFamily: "'Playfair Display', serif", fontSize: 28, lineHeight: 1.2,
                      fontWeight: 700, color: "var(--m-ink)", margin: "0 10px 6px" }}>
            {exercise.item.ln}
          </p>
          <p style={{ fontSize: 14, color: "var(--m-muted)", marginBottom: 22 }}>{exercise.item.fr}</p>

          <button onClick={playProfessor} disabled={phase === "requesting" || phase === "recording" || phase === "comparing"}
            style={{ alignSelf: "center", minHeight: 48, padding: "10px 18px", borderRadius: 8,
                     border: "1.5px solid var(--m-line)", background: "white", color: "var(--m-forest)",
                     fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
            ▶ Écouter le professeur
          </button>

          <div style={{ flex: 1, minHeight: 22 }} />

          {phase === "recording" ? (
            <div>
              <button onClick={stopRecording} aria-label="Arrêter l'enregistrement" style={{
                width: 88, height: 88, borderRadius: "50%", border: "none", background: "var(--m-wrong)",
                color: "white", fontSize: 29, cursor: "pointer", boxShadow: "0 8px 24px rgba(220,38,38,.25)",
              }}>■</button>
              <p style={{ marginTop: 12, fontSize: 14, fontWeight: 700, color: "var(--m-wrong)" }}>
                Enregistrement · {seconds} s
              </p>
            </div>
          ) : (
            <button onClick={startRecording} aria-label={recorded ? "Réenregistrer" : "Commencer l'enregistrement"}
              disabled={phase === "requesting" || phase === "comparing"} style={{
                alignSelf: "center", width: 88, height: 88, borderRadius: "50%",
                border: "8px solid var(--m-purple-soft)", background: "var(--m-purple-dark)", color: "white",
                fontSize: 32, cursor: (phase === "requesting" || phase === "comparing") ? "default" : "pointer",
                boxShadow: "0 8px 24px rgba(107,33,168,.22)",
              }}>●</button>
          )}
          <p style={{ margin: "12px 0 16px", minHeight: 21, fontSize: 14, color: "var(--m-muted)" }}>
            {phase === "ready" ? "Enregistrez votre voix" :
             phase === "requesting" ? "Ouverture du microphone…" :
             phase === "recording" ? "Touchez le carré lorsque vous avez terminé" :
             recorded ? "Votre voix est prête" : "Réessayez ou passez à la suite"}
          </p>

          {error && (
            <div role="alert" style={{ background: "var(--m-wrong-soft)", color: "var(--m-wrong)", borderRadius: 8,
                                       padding: "11px 13px", fontSize: 13, lineHeight: 1.4, marginBottom: 12 }}>
              {error}
              {recorded && (
                <button onClick={() => rate(false)} style={{ display: "block", margin: "8px auto 0",
                  minHeight: 44, padding: "8px 12px", border: "none", background: "transparent",
                  color: "var(--m-muted)", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                  Passer cette question
                </button>
              )}
            </div>
          )}

          {recorded && (
            <div style={{ display: "grid", gap: 10 }}>
              <button onClick={playComparison} disabled={phase === "comparing"} style={{
                minHeight: 52, borderRadius: 8, border: "none", background: "var(--m-ink)", color: "white",
                fontSize: 16, fontWeight: 700, cursor: "pointer",
              }}>{phase === "comparing" ? "Écoute en cours…" : "▶ Comparer les deux voix"}</button>
              <button onClick={startRecording} disabled={phase === "comparing"} style={{
                minHeight: 48, borderRadius: 8, border: "1.5px solid var(--m-line)", background: "white",
                color: "var(--m-purple-dark)", fontSize: 15, fontWeight: 700,
                cursor: phase === "comparing" ? "default" : "pointer",
              }}>↻ Réessayer</button>
              {hasCompared && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <button onClick={() => rate(false)} disabled={phase === "comparing"} style={{
                    minHeight: 52, borderRadius: 8, border: "1.5px solid var(--m-line)", background: "white",
                    color: "var(--m-muted)", fontSize: 15, fontWeight: 700, cursor: "pointer",
                  }}>À retravailler</button>
                  <button onClick={() => rate(true)} disabled={phase === "comparing"} style={{
                    minHeight: 52, borderRadius: 8, border: "none", background: "var(--m-forest)",
                    color: "white", fontSize: 15, fontWeight: 700, cursor: "pointer",
                  }}>Ça va</button>
                </div>
              )}
            </div>
          )}

          {phase === "error" && (
            <button onClick={() => rate(false)} style={{ minHeight: 48, border: "none", background: "none",
                                                        color: "var(--m-muted)", fontSize: 14, fontWeight: 700,
                                                        cursor: "pointer" }}>Passer</button>
          )}
        </div>
      );
    };

    // Renderer per exercise type. The shell, progress, scoring and summary stay
    // untouched when a new screen joins this map.
    const EXERCISE_SCREENS = {
      match_pairs: MatchPairsScreen,
      choose_audio: ChooseAudioScreen,
      word_order: WordOrderScreen,
      fill_blank: FillBlankScreen,
      listen_type: ListenTypeScreen,
      speaking: SpeakingScreen,
    };

    // 80% of a session's questions, right the first time, passes Pratiquer and
    // unlocks Élargir. Failing costs nothing but the session — no lives, no
    // lockout, retry immediately.
    const PASS_PCT = 80;

    // What each stage draws on, in the learner's words. Shown before the first
    // question, because "Pratiquer" and "Élargir" do not explain themselves —
    // one is the lesson the professor wrote, the other is everything else the
    // course knows about the same topic.
    // The learner never sees the words "pratiquer" or "elargir" — those stay as
    // the DB values, where they sit in a CHECK constraint and in every attempt
    // row already written. These are the labels, defined once so the lesson
    // screen, the briefing and the session header cannot drift apart.
    const STAGE_BRIEF = {
      pratiquer: {
        label: "Maîtriser la leçon",
        short: "Maîtriser",
        blurb: "À vous de jouer. 20 questions tirées de cette leçon, et rien d'autre. Obtenez 80\u202F% de bonnes réponses du premier coup, et vous débloquerez le prochain niveau",
        accent: "var(--m-purple-dark)",
        soft: "var(--m-purple-soft)",
      },
      elargir: {
        label: "Aller plus loin",
        short: "Aller plus loin",
        blurb: "Mbote ! On va voir si tu maitrise le lingala ! 20 questions sur le même thème, tirées du corpus et non enseignées dans cette leçon. Evalue ton niveau par rapports aux autres participants !",
        accent: "var(--m-forest)",
        soft: "var(--m-green-soft)",
      },
      level_challenge: {
        label: "Grand défi du niveau",
        short: "Grand défi",
        blurb: "20 questions puisées dans tout ce niveau. Obtenez 80 % de bonnes réponses du premier coup pour enrichir votre médaille et recevoir le bonus unique de 300 XP.",
        accent: "var(--m-gold)",
        soft: "var(--m-gold-soft)",
      },
    };

    const SessionView = ({ lesson, stage, exercises, poolSize, stats, streak = 0, bonus = 0,
                           milestoneBonus = 0, secondaryLabel = "Pourquoi ? Voir la leçon", onExit, onSeeLesson, onSessionEnd, onReport }) => {
      const [started, setStarted] = useState(false);
      const [queue, setQueue] = useState(exercises);
      const [idx, setIdx] = useState(0);
      const [xp, setXp] = useState(0);
      const [missed, setMissed] = useState([]);      // pairs answered wrong, deduped
      const [done, setDone] = useState(false);
      const [reporting, setReporting] = useState(false);
      const [reported, setReported] = useState([]);  // item ids already flagged

      // The best score as it stood BEFORE this session, captured once at mount.
      // It cannot be read from `stats` at render time: handleSessionEnd's
      // `finally` re-runs loadStageState, so by the time the summary is on
      // screen `stats.best` has already become this session's score — and
      // "nouveau record" would appear for a frame and then delete itself.
      const bestAtStart = React.useRef(stats?.best || 0);

      // One row per question, first try only. Held in a ref because `advance`
      // has to read the score in the same tick it decides the session is over.
      const attempts = React.useRef([]);
      const flushed = React.useRef(false);
      const endRef = React.useRef(onSessionEnd);
      endRef.current = onSessionEnd;

      const recordAnswer = (item, correct, { scored = true } = {}) => {
        if (item && item.poolId != null)
          attempts.current.push({ pool_item_id: item.poolId, correct, scored,
                                  format: current?.type || "unknown" });
      };

      const firstTryPct = () => {
        // Record-and-compare speaking is a self-rating, not an objective grade.
        // It earns XP and is persisted for coverage, but cannot raise or lower
        // the 80% gate until a Lingala pronunciation model is trustworthy.
        const list = scoreableAttempts(attempts.current);
        return list.length ? Math.round(100 * list.filter(a => a.correct).length / list.length) : 0;
      };

      // The session is the unit of writing: one insert at the end beats 20 round
      // trips landing inside the interaction. An abandoned session still flushes
      // — its attempts feed the mastery counter, which counts items ever answered
      // correctly, not sessions finished — but only a completed session may move
      // the stage state, because only a completed session can pass the gate.
      const flush = (completed, pct = 0, xpEarned = 0) => {
        if (flushed.current) return;
        flushed.current = true;
        if (!completed && !attempts.current.length) return;
        endRef.current?.({ completed, stage, attempts: attempts.current, pct, xp: xpEarned });
      };

      useEffect(() => () => flush(false), []);

      // Both counted in questions, so the bar moves by five across a five-pair
      // screen and by one across a choose-the-audio screen. `queue` grows when a
      // retry screen is appended, so neither is fixed at mount.
      const totalQuestions = countQuestions(queue);
      const answered = countQuestions(queue.slice(0, idx));
      const current = queue[idx];
      const Screen = current && EXERCISE_SCREENS[current.type];

      // Fetch this screen's clips and the next one's. By the time a learner has
      // read the prompt and reached for a tile, the bytes are already local, so
      // the ~340ms round trip never lands inside the interaction.
      useEffect(() => {
        primeClips(exerciseClips(queue[idx]));
        primeClips(exerciseClips(queue[idx + 1]));
      }, [idx, queue]);

      // Blob URLs leak until revoked; a long practice run would otherwise hold
      // every clip it ever played.
      useEffect(() => releaseClips, []);

      const noteMiss = (pair) => setMissed(m => m.some(x => x.id === pair.id) ? m : [...m, pair]);

      const advance = () => {
        const xpNow = xp + 10 * questionCount(current);   // 10 a question, not a screen
        setXp(xpNow);
        // Anything missed comes back before the session can end, as a screen
        // built from the missed pairs themselves. This one screen may fall below
        // PAIRS_MIN: it is re-exposure, not assessment — the answer has already
        // been shown, and retries never feed the first-try pass rate.
        if (idx + 1 >= queue.length) {
          const retry = missed.filter(m => !m.retried);
          if (retry.length >= 2) {
            const batch = retry.slice(0, PAIRS_MAX).map(p => ({ ...p, retried: true }));
            setMissed(m => m.map(x => batch.some(b => b.id === x.id) ? { ...x, retried: true } : x));
            setQueue(q => [...q, { type: "match_pairs", pairs: batch, retry: true }]);
            setIdx(i => i + 1);
            return;
          }
          setDone(true);
          flush(true, firstTryPct(), xpNow);
          return;
        }
        setIdx(i => i + 1);
      };

      const pct = done ? 100 : Math.round(100 * answered / Math.max(1, totalQuestions));

      const brief = STAGE_BRIEF[stage] || STAGE_BRIEF.pratiquer;

      // What this session will actually ask, per exercise type, straight off the
      // built queue — so the briefing is a promise the session keeps.
      const programme = React.useMemo(() => programmeOf(exercises), [exercises]);

      if (!started) {
        const runs = stats?.runs || 0, best = stats?.best || 0;
        return (
          <div style={{
            minHeight: "100dvh", background: "var(--m-canvas)",
            display: "flex", flexDirection: "column",
            padding: "calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 16px)",
          }} className="m-session-shell">
            <button onClick={onExit} aria-label="Quitter" style={{
              width: 44, height: 44, marginLeft: -10, border: "none", background: "none",
              color: "var(--m-muted)", fontSize: 26, lineHeight: 1, cursor: "pointer", textAlign: "left",
            }}>×</button>

            {/* Scrolls rather than overflowing: title + blurb + tiles + best score
                + a programme line per type runs past 667px on an iPhone SE, and
                the Commencer button must never be pushed off.

                CENTRED WITH `margin: auto`, NEVER `justify-content: center`.
                They look identical until the content is taller than the box,
                and then they differ completely: `justify-content: center`
                overflows a scroll container in BOTH directions and browsers
                will not scroll above the origin, so the stage chip and the
                lesson title become unreachable — the two things this screen
                exists to show. Auto margins collapse to 0 when space runs out,
                so the content simply starts at the top and scrolls normally.
                Slice 7 made this reachable in practice: a learner with a
                streak, items due and a topic level is exactly the engaged user
                who overflows the screen. */}
            <div style={{ flex: 1, minHeight: 0, overflowY: "auto",
                          display: "flex", flexDirection: "column" }}>
             <div style={{ margin: "auto 0", width: "100%",
                           display: "flex", flexDirection: "column" }}>

              {/* The stage names the exercise; the LESSON is what the learner
                  came for, so it is the biggest thing on the screen. */}
              <span style={{
                alignSelf: "flex-start", background: brief.soft, color: brief.accent,
                fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                textTransform: "uppercase", padding: "6px 12px", borderRadius: 10, marginBottom: 14,
              }}>{brief.label}</span>

              <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, fontWeight: 800,
                           margin: "0 0 14px", lineHeight: 1.2 }}>{lesson.title}</h2>

              <p style={{ margin: "0 0 22px", fontSize: 15, lineHeight: 1.55, color: "var(--m-muted)" }}>
                {brief.blurb}
              </p>

              {/* Counters are singular after 0 and 1. The play count is hidden
                  until there is one — "0 partie" is noise, not information. */}
              <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
                {[[plural(totalQuestions, "question", "questions"), true],
                  [plural(poolSize || 0, "expression", "expressions"), (poolSize || 0) > 0],
                  [plural(runs, "partie", "parties"), runs > 0]]
                  .filter(([, show]) => show)
                  .map(([text]) => {
                    const [n, ...rest] = text.split("\u00A0");
                    return (
                      <div key={text} style={{ flex: 1, border: "1px solid var(--m-line)", borderRadius: 8,
                                               padding: "13px 8px", background: "white", textAlign: "center" }}>
                        <b style={{ display: "block", fontFamily: "'DM Mono', monospace", fontSize: 20,
                                    fontVariantNumeric: "tabular-nums", color: brief.accent }}>{n}</b>
                        <span style={{ display: "block", marginTop: 3, fontSize: 11, color: "var(--m-muted)",
                                       letterSpacing: ".05em", textTransform: "uppercase",
                                       fontFamily: "'DM Mono', monospace" }}>{rest.join(" ")}</span>
                      </div>
                    );
                  })}
              </div>

              {/* The best score keeps a full-width card — it carries the medal
                  and the "leçon validée" mark, and it is the line the learner
                  is trying to beat. */}
              {best > 0 && (
                <div style={{
                  display: "flex", alignItems: "center", gap: 10, marginBottom: 10,
                  padding: "12px 16px", borderRadius: 8, background: brief.soft,
                }}>
                  <span style={{ fontSize: 18 }}>{medalFor(best)?.icon || "📈"}</span>
                  <span style={{ fontSize: 14, color: "var(--m-ink)" }}>
                    Meilleur score&nbsp;: <b style={{ color: brief.accent }}>{best}%</b>
                    {medalFor(best) ? ` · ${medalFor(best).label}` : ""}
                    {stage === "pratiquer" && stats?.passed ? " · leçon validée ✓" : ""}
                  </span>
                </div>
              )}

              {/* Streak, review count and topic level are one-fact signals, so
                  they are chips on a wrapping line rather than three more
                  full-width cards. Stacked, they pushed "Au programme" and the
                  Commencer button off an iPhone SE for exactly the engaged
                  learner who has all three. Each hides itself when it has
                  nothing to say rather than showing a zero. */}
              {(() => {
                const chips = [
                  streak > 0 && { key: "streak", icon: "🔥", text: `${plural(streak, "jour", "jours")} d'affilée`,
                                  fg: "var(--m-gold)", bg: "var(--m-gold-soft)" },
                  (stats?.due || 0) > 0 &&
                    { key: "due", icon: "🔁", text: `${plural(stats.due, "à revoir", "à revoir")}`,
                      fg: brief.accent, bg: brief.soft },
                  stage === "elargir" && (stats?.level || 1) > 1 &&
                    { key: "level", icon: "📈", text: `Niveau ${stats.level}`,
                      fg: brief.accent, bg: brief.soft },
                ].filter(Boolean);
                if (!chips.length) return null;
                return (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
                    {chips.map(c => (
                      <span key={c.key} style={{
                        display: "inline-flex", alignItems: "center", gap: 6,
                        padding: "8px 12px", borderRadius: 10, background: c.bg,
                        fontSize: 13, color: "var(--m-ink)", whiteSpace: "nowrap",
                      }}>
                        <span style={{ fontSize: 14 }}>{c.icon}</span>
                        <b style={{ color: c.fg, fontWeight: 700 }}>{c.text}</b>
                      </span>
                    ))}
                  </div>
                );
              })()}

              {programme.length > 0 && (
                <div>
                  <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                              textTransform: "uppercase", color: "var(--m-muted)", margin: "0 0 10px" }}>
                    Au programme
                  </p>
                  <div style={{ border: "1px solid var(--m-line)", borderRadius: 8, background: "white",
                                overflow: "hidden" }}>
                    {programme.filter(row => row.label).map((row, i) => (
                      <div key={row.type} style={{
                        display: "flex", alignItems: "center", gap: 10,
                        padding: "12px 14px", fontSize: 14, color: "var(--m-ink)",
                        borderTop: i === 0 ? "none" : "1px solid var(--m-line)",
                      }}>
                        <span style={{ width: 6, height: 6, borderRadius: 3, background: brief.accent,
                                       flex: "0 0 auto" }} />
                        {row.label}
                      </div>
                    ))}
                  </div>
                </div>
              )}
             </div>
            </div>

            <button onClick={() => setStarted(true)} style={{
              width: "100%", minHeight: 56, border: "none", borderRadius: 8,
              background: brief.accent,
              color: "white", fontSize: 17, fontWeight: 700, cursor: "pointer",
              fontFamily: "'DM Sans', sans-serif", marginTop: 18,
              boxShadow: `0 6px 18px ${stage === "elargir" ? "rgba(44,95,45,.28)" : "rgba(107,33,168,.28)"}`,
            }}>Commencer</button>
          </div>
        );
      }

      return (
        <div style={{
          minHeight: "100dvh", background: "var(--m-canvas)",
          display: "flex", flexDirection: "column",
          padding: "calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 16px)",
        }} className="m-session-shell">
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
            <button onClick={onExit} aria-label="Quitter la session" style={{
              width: 44, height: 44, marginLeft: -10, border: "none", background: "none",
              color: "var(--m-muted)", fontSize: 26, lineHeight: 1, cursor: "pointer",
            }}>×</button>
            <div style={{ flex: 1, height: 10, borderRadius: 5, background: "var(--m-line)", overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${pct}%`, background: "var(--m-purple-dark)", borderRadius: 5,
                            transition: "width .45s cubic-bezier(.4,0,.2,1)" }} />
            </div>
            <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 13, color: "var(--m-purple-dark)",
                           fontVariantNumeric: "tabular-nums", minWidth: 46, textAlign: "right" }}>
              {xp} XP
            </span>
            {/* Élargir is the routed corpus — 96% and 90% precision, so roughly
                one item a session sits in the wrong lesson. The learner is the
                only QA pass that scales to 4,849 routed rows. */}
            {stage === "elargir" && !done && (
              <button onClick={() => setReporting(r => !r)} aria-label="Signaler un problème"
                style={{
                  width: 44, height: 44, marginRight: -10, border: "none", background: "none",
                  color: reporting ? "var(--m-wrong)" : "var(--m-muted)", fontSize: 18, cursor: "pointer",
                }}>⚑</button>
            )}
          </div>

          {reporting && !done && (
            <div style={{ border: "1px solid var(--m-line)", borderRadius: 8, background: "white",
                          marginBottom: 14, overflow: "hidden" }}>
              <p style={{ margin: 0, padding: "11px 14px", borderBottom: "1px solid var(--m-line)",
                          fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                          textTransform: "uppercase", color: "var(--m-muted)" }}>
                Ne va pas avec cette leçon&nbsp;?
              </p>
              {screenItems(current).map(it => {
                const sent = reported.includes(it.id);
                return (
                  <button key={it.id} disabled={sent}
                    onClick={() => { onReport(it); setReported(r => [...r, it.id]); }}
                    style={{
                      display: "flex", width: "100%", gap: 10, alignItems: "center", textAlign: "left",
                      minHeight: 48, padding: "10px 14px", border: "none", borderBottom: "1px solid var(--m-line)",
                      background: sent ? "var(--m-green-soft)" : "white", cursor: sent ? "default" : "pointer",
                      fontFamily: "'DM Sans', sans-serif", fontSize: 14,
                    }}>
                    <span style={{ flex: 1 }}>{it.fr}</span>
                    <span style={{ fontFamily: "'Playfair Display', serif", fontWeight: 700, color: "var(--m-forest)" }}>{it.ln}</span>
                    <span style={{ fontSize: 12, color: sent ? "var(--m-correct)" : "var(--m-muted)" }}>{sent ? "✓ envoyé" : "Signaler"}</span>
                  </button>
                );
              })}
            </div>
          )}

          {!done && (
            <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".12em",
                        textTransform: "uppercase", color: "var(--m-muted)", margin: "0 0 6px" }}>
              {brief.short} · {lesson.title}
            </p>
          )}

          {done ? (
            <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", textAlign: "center" }}>
              <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, fontWeight: 800, margin: 0 }}>
                Session terminée
              </h2>
              <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 46, fontWeight: 800, color: "var(--m-purple-dark)",
                          fontVariantNumeric: "tabular-nums", margin: "8px 0 0" }}>{xp + bonus + milestoneBonus} XP</p>
              {/* The bonus is shown as its own line, not folded into the total:
                  a number the learner cannot account for reads as a bug. */}
              {bonus > 0 && (
                <p style={{ margin: "2px 0 0", fontSize: 13, fontWeight: 700, color: "var(--m-gold)" }}>
                  ✨ Sans faute — bonus de {bonus} XP
                </p>
              )}
              {milestoneBonus > 0 && (
                <p style={{ margin: "2px 0 0", fontSize: 13, fontWeight: 700, color: "var(--m-gold)" }}>
                  Médaille enrichie · bonus unique de {milestoneBonus} XP
                </p>
              )}
              <p style={{ color: "var(--m-muted)", fontSize: 14, margin: 0 }}>{lesson.title}</p>

              {/* A medal is a high-water mark, so it is announced only when this
                  session actually beat the previous best. */}
              {medalFor(firstTryPct()) && firstTryPct() > bestAtStart.current && (
                <p style={{ margin: "10px 0 0", fontSize: 15, fontWeight: 700, color: "var(--m-ink)" }}>
                  {medalFor(firstTryPct()).icon} {medalFor(firstTryPct()).label} — nouveau record
                </p>
              )}
              {streak > 0 && (
                <p style={{ margin: "6px 0 0", fontSize: 14, color: "var(--m-gold)", fontWeight: 700 }}>
                  🔥 {plural(streak, "jour", "jours")} d'affilée
                </p>
              )}

              {/* Pratiquer is the only stage with a bar to clear. Élargir is
                  endless and replayable, so it reports a score and nothing else. */}
              {stage === "pratiquer" && (
                <div style={{
                  marginTop: 18, padding: "13px 16px", borderRadius: 8,
                  background: firstTryPct() >= PASS_PCT ? "var(--m-green-soft)" : "var(--m-gold-soft)",
                  border: `1.5px solid ${firstTryPct() >= PASS_PCT ? "var(--m-correct)" : "var(--m-gold)"}`,
                }}>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 700,
                              color: firstTryPct() >= PASS_PCT ? "var(--m-correct)" : "var(--m-muted)" }}>
                    {firstTryPct() >= PASS_PCT ? "✓ Leçon maîtrisée — « Aller plus loin » débloqué" : `${firstTryPct()}% — il en faut ${PASS_PCT}%`}
                  </p>
                  {firstTryPct() < PASS_PCT && (
                    <p style={{ margin: "4px 0 0", fontSize: 13, color: "var(--m-muted)" }}>
                      Recommencez quand vous voulez, rien n'est perdu.
                    </p>
                  )}
                </div>
              )}
              {stage === "level_challenge" && (
                <div style={{
                  marginTop: 18, padding: "13px 16px", borderRadius: 8,
                  background: firstTryPct() >= PASS_PCT ? "var(--m-green-soft)" : "var(--m-gold-soft)",
                  border: `1.5px solid ${firstTryPct() >= PASS_PCT ? "var(--m-correct)" : "var(--m-gold)"}`,
                }}>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: firstTryPct() >= PASS_PCT ? "var(--m-forest-2)" : "var(--m-muted)" }}>
                    {firstTryPct() >= PASS_PCT ? "Niveau enrichi · distinction obtenue" : `${firstTryPct()}% · il en faut ${PASS_PCT}%`}
                  </p>
                  {firstTryPct() < PASS_PCT && <p style={{ margin: "4px 0 0", fontSize: 13, color: "var(--m-muted)" }}>Votre record est conservé. Vous pouvez recommencer librement.</p>}
                </div>
              )}

              <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
                {[[totalQuestions, "questions"], [`${firstTryPct()}%`, "du premier coup"]].map(([v, l]) => (
                  <div key={l} style={{ flex: 1, border: "1px solid var(--m-line)", borderRadius: 8, padding: "13px 8px", background: "white" }}>
                    <b style={{ display: "block", fontFamily: "'DM Mono', monospace", fontSize: 20,
                                fontVariantNumeric: "tabular-nums" }}>{v}</b>
                    <span style={{ fontSize: 11, color: "var(--m-muted)", letterSpacing: ".05em",
                                   textTransform: "uppercase", fontFamily: "'DM Mono', monospace" }}>{l}</span>
                  </div>
                ))}
              </div>
              {missed.length > 0 && (
                <div style={{ marginTop: 18, textAlign: "left", border: "1px solid var(--m-line)",
                              borderRadius: 8, background: "white", overflow: "hidden" }}>
                  <h3 style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                               textTransform: "uppercase", color: "var(--m-muted)", margin: 0,
                               padding: "11px 14px", borderBottom: "1px solid var(--m-line)" }}>À revoir</h3>
                  {missed.slice(0, 6).map(m => (
                    <div key={m.id} style={{ display: "flex", justifyContent: "space-between", gap: 12,
                                             padding: "10px 14px", fontSize: 14, borderBottom: "1px solid var(--m-line)" }}>
                      <span>{m.fr}</span>
                      <span style={{ fontFamily: "'Playfair Display', serif", fontWeight: 700, color: "var(--m-forest)" }}>{m.ln}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : Screen ? (
            <Screen key={idx} exercise={current} onDone={advance} onMiss={noteMiss} onAnswer={recordAnswer} />
          ) : null}

          {done ? (
            <button onClick={onExit} style={{
              width: "100%", minHeight: 52, border: "none", borderRadius: 8, background: "var(--m-purple-dark)",
              color: "white", fontSize: 16, fontWeight: 700, cursor: "pointer", marginTop: 18,
            }}>Continuer</button>
          ) : (
            <button onClick={onSeeLesson} style={{
              width: "100%", minHeight: 48, borderRadius: 8, background: "transparent",
              border: "1.5px solid var(--m-line)", color: "var(--m-muted)", fontSize: 14, fontWeight: 600, cursor: "pointer",
            }}>{secondaryLabel}</button>
          )}
        </div>
      );
    };


    // ── Conjugation table ─────────────────────────────────────────────────────
    // A paradigm is a grid, and a grid is the whole point: what a learner needs
    // to see is that the stem never moves and only the prefix does. Rendered as
    // tense tabs rather than a 5x6 matrix, because thirty cells will not fit a
    // 375px column without becoming unreadable.
    const ConjugationTable = ({ verb, verbFr, forms }) => {
      const tenses = React.useMemo(() => {
        const by = new Map();
        for (const f of forms) {
          if (!by.has(f.tense)) by.set(f.tense, { key: f.tense, label: f.tense_label, order: f.tense_order, rows: [] });
          by.get(f.tense).rows.push(f);
        }
        return [...by.values()]
          .sort((a, b) => a.order - b.order)
          .map(t => ({ ...t, rows: t.rows.sort((a, b) => a.person_order - b.person_order) }));
      }, [forms]);

      const [active, setActive] = useState(0);
      const tense = tenses[active];
      if (!tense) return null;

      return (
        <div className="m-conj-table">
          <div className="m-conj-head">
            <p>Conjugaison</p>
            <h3>{verb} <span>— {verbFr}</span></h3>
          </div>

          {/* Tense tabs. Scroll sideways INSIDE this strip only — the page itself
              must never scroll horizontally. */}
          <div className="m-conj-tenses">
            {tenses.map((t, i) => (
              <button key={t.key} className={i === active ? "active" : ""} onClick={() => setActive(i)}>{t.label}</button>
            ))}
          </div>

          <div>
            {tense.rows.map((f, i) => (
              <div key={f.person} className="m-conj-row">
                <span className="fr">{f.french}</span>
                <span className="ln">{f.lingala}</span>
                {/* The présent column was never recorded, so a third of the grid
                    has no clip. An empty slot keeps the rows aligned. */}
                {f.audio_url
                  ? <AudioButton src={f.audio_url} title={`Écouter ${f.lingala}`} />
                  : <span className="m-conj-noaudio" />}
              </div>
            ))}
          </div>
        </div>
      );
    };

    const LessonAudioText = ({ text, audioUrl, title, color = "var(--m-forest-2)", fontSize = 14, fontWeight = 500, italic = false }) => (
      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
        <div style={{ flex:1, fontSize, color, fontWeight, fontStyle: italic ? "italic" : "normal", lineHeight:1.5 }}>
          {text}
        </div>
        <AudioButton src={audioUrl} title={title} />
      </div>
    );

    const SenseCard = ({ sense, index }) => (
      <div style={{ background:"white", borderRadius:8, padding:"20px 24px", marginBottom:12, border:"1px solid var(--m-line)", boxShadow:"0 1px 3px rgba(139,109,71,0.06)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <span style={{ background:"var(--m-forest)", color:"white", fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:10, letterSpacing:"0.05em", fontFamily:"'DM Mono', monospace" }}>SENS {index+1}</span>
          <span style={{ fontSize:22, fontWeight:700, color:"var(--m-forest)", fontFamily:"'Playfair Display', serif" }}>{sense.dialect_word}</span>
          <div style={{ marginLeft:"auto" }}>
            <AudioButton src={sense.audio_url} title={`Ecouter ${sense.dialect_word}`} />
          </div>
        </div>
        {sense.examples && sense.examples.length > 0 && (
          <div style={{ background:"var(--m-canvas)", borderRadius:8, padding:"14px 18px", borderLeft:"3px solid var(--m-gold)" }}>
            <div style={{ display:"flex", alignItems:"flex-start", gap:12 }}>
              <p style={{ margin:0, fontSize:15, color:"var(--m-ink)", fontStyle:"italic", lineHeight:1.5, fontFamily:"'DM Sans', sans-serif", flex:1 }}>« {sense.examples[0].sentence_dialect} »</p>
              <AudioButton src={sense.examples[0].audio_url} title="Ecouter l'exemple" />
            </div>
            <p style={{ margin:"8px 0 0", fontSize:13, color:"var(--m-muted)", lineHeight:1.4, fontFamily:"'DM Sans', sans-serif" }}>{sense.examples[0].sentence_french}</p>
          </div>
        )}
      </div>
    );

    const WordDetail = ({ wordId, langName, onBack }) => {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        (async () => {
          setLoading(true);
          try {
            const word = await supaFetch("words", `id=eq.${wordId}&select=*`);
            const senses = await supaFetch("senses", `word_id=eq.${wordId}&select=*,examples(*)&order=sense_number`);
            setData({ word: word[0], senses });
          } catch (e) { console.error(e); }
          setLoading(false);
        })();
      }, [wordId]);
      if (loading) return <Spinner />;
      if (!data) return <p style={{textAlign:"center",color:"var(--m-muted)",padding:40}}>Erreur de chargement</p>;
      return (
        <div style={{ animation:"slideIn 0.25s ease-out" }}>
          <button onClick={onBack} style={{ display:"flex", alignItems:"center", gap:6, background:"none", border:"none", color:"var(--m-muted)", fontSize:14, fontWeight:600, cursor:"pointer", padding:"8px 0", marginBottom:8, fontFamily:"'DM Sans', sans-serif" }}><ArrowLeft /> Retour</button>
          <div style={{ background:"var(--m-forest)", borderRadius:10, padding:"28px 28px 24px", marginBottom:20, position:"relative", overflow:"hidden" }}>
            <div style={{ position:"absolute", top:-30, right:-30, width:120, height:120, borderRadius:"50%", background:"rgba(255,255,255,0.04)" }}/>
            <div style={{ position:"absolute", bottom:-20, left:40, width:80, height:80, borderRadius:"50%", background:"rgba(255,255,255,0.03)" }}/>
            <span style={{ fontSize:12, color:"rgba(255,255,255,0.5)", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", fontFamily:"'DM Mono', monospace" }}>Français → {langName}</span>
            <h2 style={{ margin:"8px 0 4px", fontSize:36, fontWeight:800, color:"white", fontFamily:"'Playfair Display', serif", lineHeight:1.1 }}>{data.word.french_word}</h2>
            <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)", fontFamily:"'DM Sans', sans-serif" }}>{data.senses.length} {data.senses.length > 1 ? "traductions" : "traduction"}</span>
          </div>
          {data.senses.map((sense, i) => <SenseCard key={sense.id} sense={sense} index={i} />)}
        </div>
      );
    };

    const ResultRow = ({ word, onClick }) => (
      <button onClick={onClick} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", width:"100%", background:"white", border:"1px solid var(--m-line)", borderRadius:8, padding:"16px 20px", marginBottom:8, cursor:"pointer", textAlign:"left", transition:"all 0.15s", boxShadow:"0 1px 2px rgba(139,109,71,0.04)" }}
        onMouseOver={e => { e.currentTarget.style.borderColor="var(--m-gold)"; e.currentTarget.style.boxShadow="0 2px 8px rgba(212,168,67,0.12)"; }}
        onMouseOut={e => { e.currentTarget.style.borderColor="var(--m-line)"; e.currentTarget.style.boxShadow="0 1px 2px rgba(139,109,71,0.04)"; }}>
        <div>
          <div style={{ fontSize:17, fontWeight:700, color:"var(--m-ink)", fontFamily:"'Playfair Display', serif" }}>{word.french_word}</div>
          {word.dialect_words && <div style={{ fontSize:14, color:"var(--m-forest)", marginTop:3, fontFamily:"'DM Sans', sans-serif", fontWeight:500 }}>{word.dialect_words}</div>}
        </div>
        <div style={{ color:"var(--m-muted)", flexShrink:0 }}><ChevronRight /></div>
      </button>
    );

    // ── Lingala TTS — calls Space directly from browser (no Vercel proxy) ───────
    // Proxy times out on free Vercel plan (10s); ESPnet2 CPU inference takes 20-40s.
    // Space is public — no API key to protect.
    const LINGALA_TTS_SPACE = "https://kemz42-monoko-lingala-tts.hf.space";

    const chatAudioCache = {}; // module-level — survives re-renders, shared across chat messages

    async function lingalaTTS(text) {
      // Step 1: start Gradio prediction
      // Gradio 6.x uses /gradio_api/ prefix (was /call/ in 4.x)
      const startRes = await fetch(`${LINGALA_TTS_SPACE}/gradio_api/call/synthesise`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: [text] }),
      });
      if (!startRes.ok) {
        const errText = await startRes.text().catch(() => "");
        throw new Error(`Space ${startRes.status}: ${errText.slice(0,100)}`);
      }
      const startJson = await startRes.json();
      const event_id = startJson.event_id;
      if (!event_id) throw new Error(`No event_id. Got: ${JSON.stringify(startJson).slice(0,100)}`);

      // Step 2: stream SSE — do NOT use .text() (connection stays open in Gradio 6.x)
      // Gradio 6.x sends "event: complete"; older versions send "process_completed".
      const sseRes = await fetch(`${LINGALA_TTS_SPACE}/gradio_api/call/synthesise/${event_id}`);
      if (!sseRes.ok) throw new Error(`SSE ${sseRes.status}`);

      const reader = sseRes.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let audioUrl = null;

      try {
        outer: while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // Gradio 6.x sends "event: complete", older sends "process_completed"
          const DONE_MARKER = buffer.includes("event: complete") ? "event: complete"
                            : buffer.includes("process_completed") ? "process_completed"
                            : null;
          if (!DONE_MARKER) continue;

          const lines = buffer.split("\n");
          for (let i = 0; i < lines.length; i++) {
            if (!lines[i].includes(DONE_MARKER)) continue;
            for (let j = i + 1; j < lines.length; j++) {
              if (!lines[j].startsWith("data: ")) continue;
              try {
                const raw = lines[j].slice(6).trim();
                // Gradio 6.x "event: complete" data is a JSON array directly: [{"path":...,"url":...}]
                const parsed = JSON.parse(raw);
                const d = Array.isArray(parsed) ? parsed : (parsed.output?.data ?? parsed.data);
                if (!Array.isArray(d) || !d[0]) break;
                const a = d[0];
                const src = (typeof a === "string") ? a : (a?.url || a?.path || a?.name);
                if (src) audioUrl = src.startsWith("http") ? src : `${LINGALA_TTS_SPACE}/gradio_api/file=${src}`;
              } catch {}
              break outer;
            }
            break outer;
          }
        }
      } finally {
        reader.cancel();
      }

      if (!audioUrl) throw new Error(`No audio in SSE. Buffer: ${buffer.slice(0,200)}`);
      return audioUrl;
    }

    // ── Live Translation View ─────────────────────────────────────────────────
    function LiveTranslationView({ langName, langId, onBack }) {
      const [direction, setDirection] = useState("fr_to_lingala");
      const [isListening, setIsListening] = useState(false);
      const [segments, setSegments] = useState([]);
      const [liveText, setLiveText] = useState("");
      const [translating, setTranslating] = useState(false);
      const [error, setError] = useState("");
      const [playingId, setPlayingId] = useState(null);

      const isListeningRef = useRef(false);
      const directionRef = useRef("fr_to_lingala");
      const recognitionRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const chunkTimerRef = useRef(null);
      const translateTimerRef = useRef(null);
      const liveStreamRef = useRef(null); // persistent mic stream — reused across start/stop cycles
      const mimeTypeRef = useRef("audio/webm");
      const audioCacheRef = useRef({});
      const transEndRef = useRef(null);
      const analyserRef = useRef(null);   // { ctx, analyser, stream } — stream only set when we own it
      const rafRef = useRef(null);
      const barRefs = useRef([]);
      const vadTimerRef = useRef(null);
      const silenceStartRef = useRef(null);
      const utteranceStartRef = useRef(null);
      const liveHistoryRef = useRef([]);  // rolling last-4-turns for conversation memory

      // Warm-up TTS Space + RAG endpoints on mount so the first segment is fast
      useEffect(() => {
        apiFetch("/api/mms-tts").catch(() => {});
        if (langId) {
          apiFetch("/api/rag-context",    { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:"warm", language_id:langId }) }).catch(() => {});
          apiFetch("/api/lesson-context", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:"warm", language_id:langId }) }).catch(() => {});
        }
      }, []);

      // Keep refs in sync with state (needed inside async callbacks)
      useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
      useEffect(() => { directionRef.current = direction; }, [direction]);

      // Auto-scroll to bottom when new content arrives
      useEffect(() => { transEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [segments, liveText, translating]);

      // Cleanup on unmount — stop everything including the persistent stream
      useEffect(() => () => {
        stopAll();
        if (liveStreamRef.current) {
          liveStreamRef.current.getTracks().forEach(t => t.stop());
          liveStreamRef.current = null;
        }
      }, []);
