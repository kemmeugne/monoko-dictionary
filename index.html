        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const response = await fetch(`/api/leaderboard?language_id=${langId}&scope=${scope}`, {
            headers: { Authorization: `Bearer ${session?.access_token || ""}` },
          });
          if (!response.ok) throw new Error(`leaderboard ${response.status}`);
          setLeaderboard(await response.json());
        } catch (error) { console.error("loadLeaderboard:", error); setLeaderboard({ rows: [], current: null, total: 0 }); }
      };

      const saveLearnerProfile = async values => {
        if (!currentUser) return false;
        setProfileSaving(true);
        setProfileError("");
        try {
          const row = {
            user_id: currentUser.id,
            // Never re-derive a name the learner has already chosen: this save
            // runs from several forms, and only one of them edits the name.
            display_name: values.display_name
              ?? learnerProfile?.display_name
              ?? currentUser.user_metadata?.display_name
              ?? currentUser.email?.split("@")[0] ?? "Apprenant",
            preferred_language_id: langId,
            ...values,
          };
          // A pseudonym is chosen once. Once it is set, drop it from every
          // payload rather than resending it — saving an unrelated field must
          // not depend on the immutability trigger tolerating a no-op write.
          if (learnerProfile?.public_pseudonym?.trim()) delete row.public_pseudonym;
          const { data, error } = await supabaseClient.from("profiles").upsert(row, { onConflict: "user_id" }).select().single();
          if (error) throw error;
          setLearnerProfile(data);
          if (data.leaderboard_opt_in) await loadLeaderboard(leaderboardScope, true);
          else setLeaderboard({ rows: [], current: null, total: 0 });
          return true;
        } catch (error) {
          console.error("saveLearnerProfile:", error);
          const message = error?.message || "";
          setProfileError(
            /duplicate key|public_pseudonym_unique/i.test(message)
              ? "Ce pseudonyme est déjà utilisé. Choisissez-en un autre."
              : /pseudonyme ne peut pas/i.test(message)
              ? "Le pseudonyme ne peut plus être modifié."
              : "Enregistrement impossible. Vérifiez votre connexion et réessayez."
          );
          return false;
        }
        finally { setProfileSaving(false); }
      };

      const changePassword = async (currentPassword, password, confirmation) => {
        setPasswordNote("");
        if (!currentPassword) { setPasswordNote("Saisissez votre mot de passe actuel."); return false; }
        if ((password || "").length < 6) { setPasswordNote("Le nouveau mot de passe doit faire 6 caractères minimum."); return false; }
        if (password !== confirmation) { setPasswordNote("Les deux nouveaux mots de passe ne correspondent pas."); return false; }
        if (password === currentPassword) { setPasswordNote("Le nouveau mot de passe doit être différent de l'actuel."); return false; }
        setPasswordSaving(true);
        try {
          // Supabase's updateUser does not ask for the current password: an
          // unattended open session would be enough to take the account over.
          // Re-authenticating first is what makes the old password required.
          const { error: reauthError } = await supabaseClient.auth.signInWithPassword({
            email: currentUser?.email, password: currentPassword,
          });
          if (reauthError) {
            setPasswordNote("Mot de passe actuel incorrect.");
            return false;
          }
          const { error } = await supabaseClient.auth.updateUser({ password });
          if (error) throw error;
          setPasswordNote("✓ Mot de passe mis à jour.");
          return true;
        } catch (error) {
          console.error("changePassword:", error);
          setPasswordNote(/should be different/i.test(error?.message || "")
            ? "Choisissez un mot de passe différent de l'actuel."
            : "Modification impossible. Réessayez.");
          return false;
        } finally { setPasswordSaving(false); }
      };

      // The dictionary is free and public by design — it is the SEO and goodwill
      // engine, not a revenue line — so it is the one learner-facing screen a
      // visitor may open without signing in. Everything else stays gated, and
      // in the Capacitor build the landing page is not shown at all.
      const openPublicDictionary = async (lang) => {
        if (!lang) return;
        setSelectedLang(lang);
        setHomeSection("dictionary");
        clearLanguageState();
        setView("search");
        try {
          const words = await supaCount("words", `language_id=eq.${lang.id}`);
          const senses = await supaCount("senses", `words.language_id=eq.${lang.id}`, "id,words!inner(id)");
          setStats({ words, senses: senses || words });
        } catch (error) { console.error("openPublicDictionary:", error); }
      };

      const openSettings = () => {
        if (!currentUser) { requireAuth("settings"); return; }
        setView("settings");
      };

      const openCourseTrail = async () => {
        if (!currentUser) { requireAuth("courses"); return; }
        await loadCourseExperience({ navigate: true });
      };

      const openHome = () => {
        setHomeSection("home");
        setView("home");
        window.setTimeout(() => window.scrollTo({ top:0, behavior:"smooth" }), 40);
      };

      const openProfile = async () => {
        if (!currentUser) { requireAuth("profile"); return; }
        if (!courses.length || !courses.every(course => course.lessons)) await loadCourseExperience();
        setView("profile");
      };

      const openDictionaryHome = () => {
        if (!currentUser) { openPublicDictionary(selectedLang); return; }
        setHomeSection("dictionary");
        setView("home");
        window.setTimeout(() => document.querySelector("#home-dictionary")?.scrollIntoView({ behavior:"smooth", block:"start" }), 40);
      };

      const openTrailLesson = async (lesson, course, initialStage = null) => {
        setSelectedCourse(course);
        setSelectedLesson(lesson);
        setCurrentCardIdx(0);
        setCardFlipped(false);
        const saved = { lessonId: lesson.id, lessonTitle: lesson.title, courseTitle: course.title, courseId: course.id, langId };
        localStorage.setItem("monoko_last_lesson", JSON.stringify(saved));
        setLastLesson(saved);
        setLoading(true);
        try { setLessonItems(await supaFetch("lesson_items", `lesson_id=eq.${lesson.id}&select=*&order=item_order`)); }
        catch (error) { console.error("openTrailLesson:", error); setLessonItems([]); }
        setLoading(false);
        setView("lesson");
        if (initialStage) await startSession(initialStage,lesson,course);
      };


      // ── Exercise stages ───────────────────────────────────────────────────────
      // Pratiquer draws on what the professor wrote into this lesson; Élargir on
      // what the routing pass placed there. Two disjoint pools, one builder.
      const STAGE_TIERS = {
        pratiquer: "tier=eq.native",
        elargir:   "tier=in.(approved,reassigned)",
      };

      const loadStageState = async (lessonId) => {
        const empty = { done: 0, total: 0, dueCount: 0, dueElargir: 0 };
        if (!currentUser || !lessonId) { setStageState(null); setMastery(empty); setHasElargir(true); return; }
        try {
          // Four independent reads, so they go out together. The schedule is one
          // of them rather than a follow-up await: serialising it would put a
          // second round trip in front of the lesson screen.
          const [{ data: state }, native, correct, schedule, routed] = await Promise.all([
            supabaseClient.from("lesson_stage_state").select("*")
              .eq("user_id", currentUser.id).eq("lesson_id", lessonId).maybeSingle(),
            supaFetch("lesson_pool", `lesson_id=eq.${lessonId}&tier=eq.native&select=id&limit=1000`),
            supabaseClient.from("exercise_attempts").select("pool_item_id")
              .eq("user_id", currentUser.id).eq("lesson_id", lessonId)
              .eq("stage", "pratiquer").eq("correct", true).neq("format", "speaking"),
            loadSchedule(lessonId),
            // Ids, not a count: this answers both "does this lesson have an
            // Élargir stage at all?" and "how many of its items are due?".
            supaFetch("lesson_pool",
              `lesson_id=eq.${lessonId}&tier=in.(approved,reassigned)&select=id&limit=1000`),
          ]);
          setStageState(state || null);
          setHasElargir((routed || []).length > 0);
          // Distinct items, not attempts — answering the same word right in ten
          // sessions is one item mastered, not ten.
          const ids = new Set((correct.data || []).map(r => r.pool_item_id));
          const nativeIds = new Set((native || []).map(r => r.id));
          // Due counts are per STAGE, because the two stages draw on disjoint
          // pools and a learner owing 6 Élargir items should not see that number
          // on the Pratiquer briefing. Both are counted against ids that still
          // exist in the pool, so a schedule row left behind by a re-populate
          // cannot inflate either.
          const due = dueItems(schedule, localDay());
          const routedIds = new Set((routed || []).map(r => r.id));
          setMastery({
            done: [...ids].filter(id => nativeIds.has(id)).length,
            total: nativeIds.size,
            dueCount: [...due].filter(id => nativeIds.has(id)).length,
            dueElargir: [...due].filter(id => routedIds.has(id)).length,
          });
        } catch (e) {
          console.error("loadStageState:", e);
          // Fail towards showing the stage: a dropped request must not make a
          // lesson look as though it has no second half.
          setStageState(null); setMastery(empty); setHasElargir(true);
        }
      };

      // The streak belongs to the learner, not to any lesson, so it is loaded
      // once on login rather than on every lesson open. A missing row is not an
      // error — it is a learner who has not finished a session yet.
      const loadStreak = async (user) => {
        if (!user) { setStreak(null); return; }
        try {
          const { data } = await supabaseClient.from("user_streak").select("*")
            .eq("user_id", user.id).maybeSingle();
          setStreak(data || null);
        } catch (e) { console.error("loadStreak:", e); setStreak(null); }
      };

      // SM-2 scheduler state for one lesson, keyed by `lesson_pool.id`.
      // Pratiquer only: Élargir writes no schedule rows, so asking for them
      // would be a round trip that can only ever come back empty.
      const loadSchedule = async (lessonId) => {
        if (!currentUser || !lessonId) return new Map();
        try {
          const { data } = await supabaseClient.from("review_schedule")
            .select("pool_item_id, ease, interval_days, reps, due_on")
            .eq("user_id", currentUser.id).eq("lesson_id", lessonId)
            .limit(2000);
          return new Map((data || []).map(r => [r.pool_item_id, r]));
        } catch (e) { console.error("loadSchedule:", e); return new Map(); }
      };

      // What this learner has already been asked in this lesson and stage, so a
      // repeat session can move on rather than re-roll. Keyed by `lesson_pool.id`
      // and valued by the most recent answer, which lets the builder put never-
      // seen items first and stalest-first after that.
      //
      // Read at session start rather than kept in state: attempts are written at
      // session END, so this is the only moment it can change.
      const loadSeenItems = async (lessonId, stage) => {
        if (!currentUser || !lessonId) return null;
        try {
          const { data } = await supabaseClient
            .from("exercise_attempts")
            .select("pool_item_id, answered_at")
            .eq("user_id", currentUser.id).eq("lesson_id", lessonId).eq("stage", stage)
            .order("answered_at", { ascending: false })
            .limit(2000);
          const seen = new Map();
          for (const r of data || []) {
            const t = Date.parse(r.answered_at) || 0;
            if (!seen.has(r.pool_item_id)) seen.set(r.pool_item_id, t);   // rows arrive newest-first
          }
          return seen;
        } catch (e) { console.error("loadSeenItems:", e); return null; }
      };

      // Chooses the material; `buildSession` decides what to do with it. The tier
      // filter is the whole stage split — without it practice served corpus rows
      // the lesson never taught (178 items for Salutations against 29 written).
      const startSession = async (stage, lessonOverride = null, courseOverride = null) => {
        const lesson = lessonOverride || selectedLesson;
        const course = courseOverride || selectedCourse;
        if (!lesson) return;
        setPoolLoading(true);
        try {
          const courseLevel = course?.course_order || 1;
          const [items, seen, schedule] = await Promise.all([
            supaFetch("lesson_pool",
              `lesson_id=eq.${lesson.id}&${STAGE_TIERS[stage]}&select=*&limit=1000`),
            loadSeenItems(lesson.id, stage),
            loadSchedule(lesson.id),
          ]);

          // Élargir levels up on topic XP, and the level is spent twice over:
          // it WIDENS the pool (a higher `level` admits longer, harder rows
          // through every builder's `effective_level <= level` filter) and it
          // SHIFTS THE MIX from recognition toward production. Pratiquer does
          // neither — it is a fixed, finite set the learner is being certified
          // on, so moving its difficulty would move the 80% bar with it.
          const lessonStage = lesson.id === selectedLesson?.id ? stageState : stageByLesson[lesson.id];
          const topicLevel = stage === "elargir" ? elargirLevel(lessonStage?.elargir_xp) : 1;
          const level = stage === "elargir" ? courseLevel + topicLevel - 1 : courseLevel;

          const built = buildSession(items, level, SESSION_QUESTIONS, seen, {
            production: stage === "elargir" ? productionBias(topicLevel) : 0,
            // Both stages now. `schedule` holds every scheduled item in the
            // lesson, but `items` is already filtered by tier, so a Pratiquer
            // item cannot leak into an Élargir session however due it is —
            // which is why review_schedule needs no `stage` column of its own.
            due: dueItems(schedule, localDay()),
          });
          if (!built.length) {
            setSessionNote(stage === "pratiquer"
              ? "Pas encore assez de contenu court dans cette leçon pour un exercice."
              : "Pas encore assez de contenu au-delà de la leçon pour un exercice.");
            return;
          }
          setSessionNote("");
          primeClips(exerciseClips(built[0]));   // first screen is instant too
          setSessionPoolSize(items.length);
          setSessionStage(stage);
          setSessionExercises(built);
        } catch (e) {
          console.error("startSession:", e);
          setSessionNote("Impossible de charger l'exercice. Réessayez.");
        } finally { setPoolLoading(false); }
      };

      const startLevelChallenge = async course => {
        const lessonIds = (course?.lessons || []).map(lesson => lesson.id);
        if (!course || !lessonIds.length || !levelRewards.has(course.id)) return;
        setPoolLoading(true);
        setSessionNote("");
        try {
          const items = await supaFetch("lesson_pool", `lesson_id=in.(${lessonIds.join(",")})&tier=in.(native,approved,reassigned)&select=*&limit=5000`);
          const built = buildSession(items, (course.course_order || 1) + 1, SESSION_QUESTIONS, null, { production: .3 });
          if (!built.length) {
            setSessionNote("Pas encore assez de contenu dans ce niveau pour lancer le Grand défi.");
            return;
          }
          primeClips(exerciseClips(built[0]));
          setLevelChallengeCourse(course);
          setSelectedCourse(course);
          setSessionPoolSize(items.length);
          setSessionStage("level_challenge");
          setSessionExercises(built);
          setLastBonus(0);
          setLastMilestoneBonus(0);
          setChallengeBriefCourse(null);
          setView("level_challenge");
        } catch (error) {
          console.error("startLevelChallenge:", error);
          setSessionNote("Impossible de charger le Grand défi. Réessayez.");
        } finally { setPoolLoading(false); }
      };

      const openLevelChallengeBrief = course => {
        if (!course || !levelRewards.has(course.id)) return;
        setChallengeBriefCourse(course);
      };

      const handleLevelChallengeEnd = async ({ completed, attempts, pct, xp }) => {
        if (!currentUser || !levelChallengeCourse || !completed) return;
        const course = levelChallengeCourse;
        try {
          const { data, error } = await supabaseClient.rpc("record_level_challenge_session", {
            p_session_id: crypto.randomUUID(),
            p_course_id: course.id,
            p_language_id: langId,
            p_attempts: attempts,
            p_local_day: localDay(),
          });
          if (error) throw error;
          setLastBonus(data?.bonus || 0);
          setLastMilestoneBonus(data?.milestone_bonus || 0);
          setTotalXp(total => total + (data?.xp || 0) + (data?.milestone_bonus || 0));
          if (data?.milestone_bonus) celebrate(36);
        } catch (error) { console.error("handleLevelChallengeEnd:", error); }
        finally {
          await Promise.all([loadStreak(currentUser), loadLearningSummary(currentUser, langId)]);
        }
      };

      // Called once per session, completed or abandoned. Attempts are written
      // either way — they are the mastery counter's evidence — but only a
      // completed session may move the gate.
      const handleSessionEnd = async ({ completed, stage, attempts, pct, xp }) => {
        if (!currentUser || !selectedLesson) return;
        const lessonId = selectedLesson.id;
        const today = localDay();
        // A perfect session pays a flat bonus on top of the 10-a-question XP.
        // Computed here rather than inside SessionView so the number written to
        // the database and the number shown on the summary cannot diverge.
        const bonus = completed ? perfectBonus(pct) : 0;
        setLastBonus(bonus);
        setLastMilestoneBonus(0);

        try {
          const prior = attempts.length ? await loadSchedule(lessonId) : new Map();
          const updates = attempts.length ? scheduleUpdates(attempts, prior, today) : new Map();
          const schedule = [...updates].map(([poolItemId, row]) => ({
            pool_item_id: poolItemId,
            ease: row.ease,
            interval_days: row.interval_days,
            reps: row.reps,
            due_on: row.due_on,
          }));
          const previousElargirBest = stageState?.elargir_best || 0;
          const { data, error } = await supabaseClient.rpc("record_learning_session", {
            p_session_id: crypto.randomUUID(),
            p_lesson_id: lessonId,
            p_language_id: langId,
            p_stage: stage,
            p_completed: completed,
            p_attempts: attempts,
            p_schedule: schedule,
            p_local_day: today,
          });
          if (error) throw error;
          setLastBonus(data?.bonus || 0);
          if (data?.lesson_completed) setUserProgress(previous => new Set([...previous, lessonId]));
          if (completed) setTotalXp(total => total + (data?.xp || 0));
          if (completed && stage === "elargir" && (data?.score_pct || 0) >= PASS_PCT && previousElargirBest < PASS_PCT) celebrate(24);
        } catch (e) {
          console.error("handleSessionEnd:", e);
        } finally {
          await Promise.all([
            loadStageState(lessonId),
            loadStreak(currentUser),
            loadLearningSummary(currentUser, langId),
          ]);
        }
      };

      // A learner flagging "this does not belong here" is the only QA pass that
      // scales to 4,849 routed rows. It lands in the existing corrections queue,
      // typed so the professor can tell a routing complaint from a translation
      // fix — the pair itself is already verified; its placement is what is in
      // question.
      const reportPoolItem = async (item) => {
        if (!item) return;
        try {
          const response = await apiFetch("/api/corrections", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              language_id: langId,
              user_query: `Signalement d'exercice — ${selectedLesson?.title || ""}`,
              ai_response: `${item.fr} → ${item.ln}`,
              correction_type: "routing",
              correct_french: item.fr,
              correct_lingala: item.ln,
              tester_name: testerName.trim() || null,
              session_id: testerSessionId || null,
            }),
          });
          if (!response.ok) throw new Error(`correction ${response.status}`);
        } catch (e) { console.error("reportPoolItem:", e); }
      };

      const resumeLesson = async () => {
        if (!lastLesson || !currentUser) return;
        setLoading(true);
        try {
          const [courseArr, lessonsData] = await Promise.all([
            supaFetch("courses", `id=eq.${lastLesson.courseId}&select=*`),
            supaFetch("lessons", `course_id=eq.${lastLesson.courseId}&select=*,lesson_items(id)&order=lesson_order`),
          ]);
          const course = courseArr[0];
          if (!course) { setLoading(false); return; }
          setSelectedCourse({ ...course, lessons: lessonsData.map(l => ({ ...l, itemCount: l.lesson_items?.length || 0 })) });
          const target = lessonsData.find(l => l.id === lastLesson.lessonId);
          if (target) {
            setSelectedLesson(target);
            const items = await supaFetch("lesson_items", `lesson_id=eq.${target.id}&select=*&order=item_order`);
            setLessonItems(items);
            setCurrentCardIdx(0);
            setCardFlipped(false);
            setView("lesson");
          } else {
            setView("courses");
          }
        } catch(e) { console.error(e); }
        setLoading(false);
      };

      const requireAuth = (returnTo) => {
        setAuthReturnTo(returnTo);
        setAuthMode("login");
        setAuthEmail(""); setAuthPassword(""); setAuthPasswordConfirm(""); setAuthDisplayName(""); setAuthPseudonym(""); setAuthError(""); countryDetectedRef.current = false;
        setView("auth");
      };

      const openChat = () => {
        if (!currentUser) { requireAuth("chat"); return; }
        setView("chat");
      };

      const saveTesterNameAndOpenChat = () => {
        const normalized = pendingTesterName.trim();
        if (!normalized) return;
        setTesterName(normalized);
        setView("chat");
      };

      const handleAuthSubmit = async () => {
        setAuthError(""); setAuthSubmitting(true);
        try {
          if (authMode === "signup") {
            // The pseudonym is chosen here and never again, so refuse a signup
            // that would create an account without one rather than leaving the
            // learner to discover the one-time choice later in settings.
            const wantedPseudonym = authPseudonym.trim();
            if (wantedPseudonym.length < 2) {
              setAuthError("Choisissez un pseudonyme (2 caractères minimum).");
              setAuthSubmitting(false);
              return;
            }
            if (authPassword !== authPasswordConfirm) {
              setAuthError("Les deux mots de passe ne correspondent pas.");
              setAuthSubmitting(false);
              return;
            }
            // Asked of the database, not of `profiles` directly: RLS is
            // `auth.uid() = user_id`, so someone still signing up reads back an
            // empty set for every name and every check would pass. The unique
            // index remains the real guarantee; this is what makes the failure
            // land on the form instead of after the account exists.
            const { data: free, error: checkError } = await supabaseClient
              .rpc("pseudonym_available", { p_name: wantedPseudonym });
            // If the check itself is unavailable, let the signup through rather
            // than blocking every new account on it: the unique index still
            // refuses a duplicate, and the profile insert falls back to
            // creating the row without the name. A missing migration should
            // cost the early warning, not the ability to sign up at all.
            if (checkError) console.error("pseudonym_available:", checkError);
            if (free === false) {
              setAuthError("Ce pseudonyme est déjà utilisé. Choisissez-en un autre.");
              setAuthSubmitting(false);
              return;
            }
            const { data, error } = await supabaseClient.auth.signUp({
              email: authEmail.trim(),
              password: authPassword,
              options: {
                data: {
                  display_name: authDisplayName.trim() || authEmail.trim().split("@")[0],
                  public_pseudonym: wantedPseudonym,
                  country_code: authCountry || "CA",
                },
                emailRedirectTo: "https://monoko-dictionary.vercel.app",
              },
            });
            if (error) throw error;
            if (data.user && !data.session) {
              setAuthError("✓ Vérifiez votre email pour confirmer votre compte.");
              setAuthSubmitting(false); return;
            }
          } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email: authEmail.trim(), password: authPassword });
            if (error) throw error;
          }
          // Success — navigate to intended destination
          if (authReturnTo === "chat") { setView("chat"); }
          else if (authReturnTo === "live") { setView("live"); }
          else if (authReturnTo === "courses") { await loadCourseExperience({ navigate: true }); }
          else if (authReturnTo === "profile") { await loadCourseExperience(); setView("profile"); }
          else if (authReturnTo === "settings") { setView("settings"); }
          else { setView("home"); }
          setAuthReturnTo(null);
        } catch(e) {
          const msg = e.message || "";
          if (msg.includes("Invalid login")) setAuthError("Email ou mot de passe incorrect.");
          else if (msg.includes("already registered")) setAuthError("Cet email est déjà utilisé. Connectez-vous.");
          else if (msg.includes("Password")) setAuthError("Mot de passe trop court (6 caractères minimum).");
          else setAuthError(msg);
        }
        setAuthSubmitting(false);
      };

      // Signing out has to clear the learner, not just the session: progress,
      // XP, rewards and the resolved profile all belong to the person who was
      // signed in, and leaving them on screen shows the next person someone
      // else's streak. Resetting the resume guard matters too, or the next
      // learner to sign in on this device is not sent to their own language.
      // Resolved once, at signup, from Vercel's edge geolocation — no
      // third-party geo-IP service and no learner IP leaving the platform.
      // A failure here must never block a signup, so it falls back to the
      // default rather than surfacing an error.
      const detectCountry = async () => {
        try {
          const response = await fetch("/api/geo");
          if (!response.ok) return "CA";
          const data = await response.json();
          return data?.country || "CA";
        } catch (error) { console.error("detectCountry:", error); return "CA"; }
      };

      // Detected when the signup form opens, so the learner can see it and
      // correct it before the account exists. Edge geolocation reports where
      // the request came from, not where someone lives — a VPN, a carrier
      // routing through another country, or signing up while travelling all
      // report the wrong one, and the core market is diaspora. This is the only
      // moment a correction costs nothing; afterwards it is fixed.
      useEffect(() => {
        if (authMode !== "signup" || countryDetectedRef.current) return;
        countryDetectedRef.current = true;
        (async () => {
          const detected = await detectCountry();
          if (detected) setAuthCountry(detected);
        })();
      }, [authMode]);

      const handleForgotPassword = async () => {
        const address = authEmail.trim();
        if (!address) { setAuthError("Indiquez votre adresse e-mail."); return; }
        setAuthError(""); setAuthSubmitting(true);
        try {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(address, {
            redirectTo: `${window.location.origin}/`,
          });
          if (error) throw error;
          // Deliberately the same message whether or not the address exists:
          // a different one would turn this form into a way to test which
          // e-mail addresses have accounts.
          setAuthError("✓ Si un compte existe pour cette adresse, un lien vient d'être envoyé.");
        } catch (error) {
          console.error("resetPasswordForEmail:", error);
          setAuthError("Envoi impossible. Réessayez dans un instant.");
        }
        setAuthSubmitting(false);
      };

      const handleSignOut = async () => {
        await supabaseClient.auth.signOut();
        setTesterName("");
        setLanguageSheet(false);
        setUserProgress(new Set());
        setStageByLesson({});
        setLessonRewards(new Set());
        setLevelRewards(new Set());
        setLevelChallenges({});
        setTotalXp(0);
        setLearnerProfile(null);
        setLeaderboard({ rows: [], current: null, total: 0 });
        setStreak(null);
        resumedLanguageRef.current = false;
        rememberLanguage(null);
        setResumeChecked(true);
        clearLanguageState();
        setSelectedLang(null);
        setAuthMode("login");
        setAuthEmail(""); setAuthPassword(""); setAuthDisplayName(""); setAuthPseudonym("");
        setAuthError(""); setAuthReturnTo(null);
        setView("auth");
      };

      // One rule, one destination: a private view without a learner sends you
      // to the login page rather than rendering an empty version of itself.
      useEffect(() => {
        if (authLoading || currentUser || !PRIVATE_VIEWS.includes(view)) return;
        requireAuth(view === "home" ? "home" : view);
      }, [authLoading, currentUser, view]);

      useEffect(() => {
        if (view === "search" && inputRef.current) setTimeout(() => inputRef.current?.focus(), 100);
        if (view === "chat") apiFetch("/api/mms-tts").catch(() => {});
        if (["home", "courses", "profile"].includes(view)) window.scrollTo({ top: 0, left: 0, behavior: "auto" });
      }, [view]);

      // Reload progress whenever the logged-in user or active language changes
      useEffect(() => {
        if (currentUser && selectedLang) loadUserProgress(currentUser.id, selectedLang.id);
        else setUserProgress(new Set());
      }, [currentUser?.id, selectedLang?.id]);

      useEffect(() => {
        if (!selectedLang) { setCourses([]); setCultureCapsules([]); return; }
        loadCourseExperience();
        loadCultureCapsules();
      }, [selectedLang?.id]);

      useEffect(() => {
        loadLearningSummary(currentUser, selectedLang?.id);
      }, [currentUser?.id, selectedLang?.id]);

      useEffect(() => {
        let cancelled = false;
        if (!currentUser) { setIsCourseDeveloper(false); return; }
        supabaseClient.rpc("is_course_developer").then(({ data, error }) => {
          if (!cancelled) setIsCourseDeveloper(!error && data === true);
          if (error && error.code !== "PGRST202") console.error("is_course_developer:", error);
        });
        return () => { cancelled = true; };
      }, [currentUser?.id]);

      useEffect(() => {
        if (view === "profile") loadLeaderboard(leaderboardScope);
      }, [view, leaderboardScope, learnerProfile?.leaderboard_opt_in, currentUser?.id]);

      // The gate and the mastery counter are per lesson, so they load with it.
      useEffect(() => {
        loadStageState(selectedLesson?.id);
      }, [currentUser?.id, selectedLesson?.id]);

      // The streak is per user and spans every language, so it loads with the
      // account and NOT with the lesson or the language.
      useEffect(() => { loadStreak(currentUser); }, [currentUser?.id]);

      // Conjugation paradigms pinned to this lesson. Public read, so this works
      // logged out as well — the table is reference material, not progress.
      useEffect(() => {
        const id = selectedLesson?.id;
        if (!id) { setConjTables([]); return; }
        let cancelled = false;
        (async () => {
          try {
            // select=* on purpose: naming `tenses` would 400 on a database
            // where that migration has not run yet, and a 400 here would take
            // the whole table off the lesson page. Undefined simply means "all".
            const links = await supaFetch("lesson_conjugation_tables",
              `lesson_id=eq.${id}&select=*&order=sort_order`);
            if (!links.length) { if (!cancelled) setConjTables([]); return; }
            const verbs = links.map(l => `"${l.verb}"`).join(",");
            const forms = await supaFetch("conjugation_forms",
              `verb=in.(${verbs})&language_id=eq.${langId}&select=*&order=tense_order,person_order`);
            // A lesson shows the tenses it teaches. `tenses` null means all of
            // them — the sensible default for a general conjugation lesson.
            const byVerb = links.map(l => ({
              verb: l.verb,
              verbFr: (forms.find(f => f.verb === l.verb) || {}).verb_fr || "",
              forms: forms.filter(f => f.verb === l.verb &&
                                       (!l.tenses || !l.tenses.length || l.tenses.includes(f.tense))),
            })).filter(t => t.forms.length);
            if (!cancelled) setConjTables(byVerb);
          } catch (e) { console.error("conjugation tables:", e); if (!cancelled) setConjTables([]); }
        })();
        return () => { cancelled = true; };
      }, [selectedLesson?.id, langId]);

      // Derived per-course completion counts (requires courses to have been loaded with lessons(id))
      const courseProgress = (course) => {
        if (!course.lessons) return { done: 0, total: 0 };
        const done = course.lessons.filter(l => userProgress.has(l.id)).length;
        return { done, total: course.lessons.length };
      };
      const theme = LANG_THEMES[langName] || defaultTheme;

      const doSearch = useCallback(async (queryOverride, modeOverride) => {
        const q = (typeof queryOverride === "string" ? queryOverride : query).trim();
        const mode = typeof modeOverride === "string" ? modeOverride : searchMode;
        if (!q || !langId) return;
        if (typeof queryOverride === "string") setQuery(q);
        if (typeof modeOverride === "string") setSearchMode(mode);
        setLoading(true); setHasSearched(true);
        try {
          if (mode === "french") {
            const data = await supaFetch("words", `select=id,french_word,letter,senses(dialect_word)&language_id=eq.${langId}&french_word=ilike.*${encodeURIComponent(q)}*&order=french_word&limit=50`);
            setResults(data.map(w => ({ id: w.id, french_word: w.french_word, dialect_words: w.senses?.map(s => s.dialect_word).join(" · ") || "" })));
          } else {
            const senseData = await supaFetch("senses", `select=id,dialect_word,word_id,words!inner(id,french_word,language_id)&words.language_id=eq.${langId}&dialect_word=ilike.*${encodeURIComponent(q)}*&limit=50`);
            const seen = new Set();
            const mapped = [];
            for (const s of senseData) {
              if (s.words && !seen.has(s.words.id)) {
                seen.add(s.words.id);
                mapped.push({ id: s.words.id, french_word: s.words.french_word, dialect_words: s.dialect_word });
              }
            }
            setResults(mapped);
          }
        } catch (e) { console.error(e); setResults([]); }
        setLoading(false);
      }, [query, searchMode, langId]);

      const loadBrowse = useCallback(async (letter) => {
        if (!langId) return;
        setBrowseLetter(letter); setLoading(true);
        try {
          const accentMap = { 'A':['A','À','Â'], 'E':['E','É','Ê','È'], 'I':['I','Î','Ï'], 'O':['O','Ô'], 'U':['U','Ù','Û','Ü'], 'C':['C','Ç'] };
          const prefixes = accentMap[letter] || [letter];
          const orFilter = prefixes.map(p => `french_word.ilike.${encodeURIComponent(p + '%')}`).join(",");
          const data = await supaFetch("words", `select=id,french_word,senses(dialect_word)&language_id=eq.${langId}&or=(${orFilter})&order=french_word&limit=500`);
          setBrowseWords(data.map(w => ({ id: w.id, french_word: w.french_word, dialect_words: w.senses?.map(s => s.dialect_word).join(" · ") || "" })));
        } catch (e) { console.error(e); setBrowseWords([]); }
        setLoading(false);
      }, [langId]);

      const openWord = (id, fromView) => { setPrevView(fromView || view); setSelectedWordId(id); setView("detail"); };

      // ── Chat TTS helpers ──
      const extractLingalaFragments = (text) => {
        const frags = new Set();
        // Primary: text after → (these are always Lingala translations in our prompt format)
        for (const m of text.matchAll(/→\s*([^✓~\n()[\]{}"]{2,60})/g)) {
          const f = m[1].trim().replace(/[✓~,;:.]+$/, "").trim();
          if (f.length >= 2) frags.add(f);
        }
        // Fallback: quoted strings when no arrow fragments found
        if (frags.size === 0) {
          for (const m of text.matchAll(/"([^"]{3,60})"/g)) frags.add(m[1].trim());
        }
        return [...frags];
      };

      const playChatLingala = async (idx, text) => {
        const fragments = extractLingalaFragments(text);
        if (!fragments.length) return;
        setChatPlayingIdx(idx);
        for (const frag of fragments) {
          try {
            let url = chatAudioCache[frag];
            if (!url) { url = await lingalaTTS(frag); chatAudioCache[frag] = url; }
            await new Promise(resolve => {
              const audio = new Audio(url);
              audio.onended = resolve;
              audio.onerror = resolve;
              audio.play().catch(resolve);
            });
          } catch(e) { console.error("Chat TTS:", e); }
        }
        setChatPlayingIdx(null);
      };

      // ── Chat functions ──
      const searchContext = async (userMsg) => {
        if (!langId) return { context: "", pairs: [] };

        // Fire rag-context (parallel_sentences pgvector) and lesson-context in parallel
        const [ragResult, lessonResult] = await Promise.allSettled([
          apiFetch("/api/rag-context", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMsg, language_id: langId }),
          }).then(r => r.ok ? r.json() : null).catch(() => null),

          apiFetch("/api/lesson-context", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMsg, language_id: langId }),
          }).then(r => r.ok ? r.json() : null).catch(() => null),
        ]);

        const ragContext    = ragResult.value?.context    || "";
        const lessonContext = lessonResult.value?.context || "";

        // Parse top 3 verified pairs from the formatted context string for the loading preview
        const pairs = [];
        const pairRe = /^• (.+?) → (.+?) \[(vérifié|auto)\]$/;
        for (const line of ragContext.split("\n")) {
          const m = pairRe.exec(line.trim());
          if (m) pairs.push({ fr: m[1], ln: m[2], quality: m[3] });
          if (pairs.length >= 3) break;
        }

        return { ragContext, lessonContext, pairs };
      };

      const sendChat = async () => {
        const msg = chatInput.trim();
        if (!msg || chatLoading) return;

        const newMessages = [...chatMessages, { role: "user", content: msg }];
        // Add empty assistant placeholder immediately — loading dots show until first token arrives
        setChatMessages([...newMessages, { role: "assistant", content: "" }]);
        setChatInput("");
        setChatLoading(true);
        setChatCorpusPairs([]);

        try {
          const t0 = performance.now();
          const { ragContext, lessonContext, pairs } = await searchContext(msg);
          const tRagMs = Math.round(performance.now() - t0);
          if (pairs.length) setChatCorpusPairs(pairs);

          const res = await apiFetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mode: "chat",
              ragContext,
              lessonContext,
              messages: newMessages.slice(-12).map(m => ({ role: m.role, content: m.content })),
              testerName: testerName.trim() || null,
              sessionId: testerSessionId || null,
              languageId: langId,
              userQuery: msg,
              turnNumber: Math.ceil(newMessages.length / 2),
              tRagMs,
            }),
          });

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: `⚠️ Erreur: ${data.error || "Réponse vide du modèle."}` }]);
            setChatLoading(false);
            return;
          }

          // Consume the SSE stream — each chunk carries { delta: "..." }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let accumulated = "";
          let lineBuffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split("\n");
            lineBuffer = lines.pop(); // keep any incomplete trailing line

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const payload = line.slice(6).trim();
              if (payload === "[DONE]") continue;
              try {
                const parsed = JSON.parse(payload);
                if (parsed.delta) {
                  if (!accumulated) setChatCorpusPairs([]); // hide corpus preview on first token
                  accumulated += parsed.delta;
                  const snap = accumulated;
                  setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: snap }]);
                }
              } catch {}
            }
          }

          if (!accumulated) {
            setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: "⚠️ Réponse vide du modèle." }]);
          }
        } catch (e) {
          setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: `⚠️ Erreur de connexion: ${e.message}` }]);
        }

        setChatLoading(false);
      };

                              <button onClick={() => { setCorrectionMsg(idx); setCorrectionSent(false); setCorrectionText(""); setCorrectionExample(""); }}
                                style={{ display:"flex", alignItems:"center", gap:4, background:"none", border:"1px solid var(--m-line)", borderRadius:8, padding:"4px 10px", fontSize:11, color:"var(--m-muted)", cursor:"pointer", fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s" }}
                                onMouseOver={e => { e.currentTarget.style.borderColor="#E57373"; e.currentTarget.style.color="#E57373"; }}
                                onMouseOut={e => { e.currentTarget.style.borderColor="var(--m-line)"; e.currentTarget.style.color="var(--m-muted)"; }}>
                                <FlagIcon /> Corriger
                              </button>
                              {extractLingalaFragments(msg.content).length > 0 && (
                                <button
                                  onClick={() => playChatLingala(idx, msg.content)}
                                  disabled={chatPlayingIdx !== null && chatPlayingIdx !== idx}
                                  title="Écouter les traductions en Lingala"
                                  style={{ display:"flex", alignItems:"center", gap:4, background:"none", border:"1px solid var(--m-line)", borderRadius:8, padding:"4px 10px", fontSize:11, color: chatPlayingIdx === idx ? "var(--m-correct)" : "var(--m-muted)", cursor:"pointer", fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s" }}
                                  onMouseOver={e => { if (chatPlayingIdx !== idx) e.currentTarget.style.borderColor="var(--m-correct)"; }}
                                  onMouseOut={e => { if (chatPlayingIdx !== idx) e.currentTarget.style.borderColor="var(--m-line)"; }}>
                                  {chatPlayingIdx === idx ? "⏳" : "🔊"}
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      ))}

                      {chatLoading && chatMessages[chatMessages.length - 1]?.content === "" && chatCorpusPairs.length > 0 && (
                        <div style={{ alignSelf:"flex-start", maxWidth:"90%", animation:"fadeIn 0.3s ease-out" }}>
                          <div style={{ background:"var(--m-canvas)", border:"1px solid var(--m-line)", borderRadius:8, padding:"10px 14px", marginBottom:6 }}>
                            <p style={{ fontSize:10, fontWeight:700, color:"var(--m-muted)", textTransform:"uppercase", letterSpacing:"0.07em", margin:"0 0 8px", fontFamily:"'DM Mono', monospace" }}>
                              Trouvé dans le corpus
                            </p>
                            {chatCorpusPairs.map((p, i) => (
                              <div key={i} style={{ fontSize:12, color:"var(--m-muted)", lineHeight:1.8, fontFamily:"'DM Sans', sans-serif" }}>
                                <span style={{ color:"var(--m-ink)" }}>{p.fr}</span>
                                <span style={{ color:"var(--m-muted)", margin:"0 5px" }}>→</span>
                                <span style={{ color:"var(--m-ink)" }}>{p.ln}</span>
                                {p.quality === "vérifié" && <span style={{ color:"var(--m-correct)", marginLeft:4, fontSize:10 }}>✓</span>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {chatLoading && chatMessages[chatMessages.length - 1]?.content === "" && (
                        <div style={{ alignSelf:"flex-start", maxWidth:"85%" }}>
                          <div style={{ background:"white", border:"1px solid var(--m-line)", padding:"12px 20px", borderRadius:"16px 16px 16px 4px" }}>
                            <div style={{ display:"flex", gap:4 }}>
                              {[0,1,2].map(i => (
                                <div key={i} style={{ width:8, height:8, borderRadius:"50%", background:"#0EA5E9", animation:`float 1.2s ease-in-out ${i*0.2}s infinite` }} />
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={chatEndRef} />
                    </div>

                    {/* Chat input */}
                    <div style={{ display:"flex", gap:8, paddingBottom:8 }}>
                      <div style={{ flex:1, display:"flex", alignItems:"center", background:"white", borderRadius:8, border:"2px solid var(--m-line)", padding:"0 14px" }}>
                        <input value={chatInput}
                          onChange={e => setChatInput(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } }}
                          placeholder={`Écrivez en français ou ${langName.toLowerCase()}...`}
                          style={{ flex:1, border:"none", outline:"none", fontSize:16, padding:"13px 0", background:"transparent", color:"var(--m-ink)", fontFamily:"'DM Sans', sans-serif" }}
                          onFocus={e => e.target.parentElement.style.borderColor="#0EA5E9"}
                          onBlur={e => e.target.parentElement.style.borderColor="var(--m-line)"}
                          disabled={chatLoading}
                        />
                      </div>
                      <button onClick={sendChat} disabled={chatLoading || !chatInput.trim()} style={{
                        background: chatInput.trim() ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "var(--m-line)",
                        color: "white", border:"none", borderRadius:8, width:48, height:48,
                        display:"flex", alignItems:"center", justifyContent:"center", cursor: chatInput.trim() ? "pointer" : "default",
                        transition:"all 0.2s", flexShrink:0,
                      }}><SendIcon /></button>
                    </div>
                </React.Fragment>

                {/* Correction modal */}
                {correctionMsg !== null && (
                  <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:999, animation:"fadeIn 0.2s" }}>
                    <div style={{ background:"var(--m-canvas)", borderRadius:"20px 20px 0 0", width:"100%", maxWidth:480, padding:"24px 20px 32px", animation:"slideIn 0.25s ease-out" }}>
                      {correctionSent ? (
                        <div style={{ textAlign:"center", padding:"20px 0" }}>
                          <CheckCircle />
                          <p style={{ fontSize:16, fontWeight:700, color:"var(--m-forest)", marginTop:12, fontFamily:"'Playfair Display', serif" }}>Merci pour votre correction !</p>
                          <p style={{ fontSize:13, color:"var(--m-muted)" }}>Elle sera examinée par l'administrateur.</p>
                        </div>
                      ) : (
                        <React.Fragment>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                            <h3 style={{ fontSize:18, fontWeight:700, color:"var(--m-ink)", margin:0, fontFamily:"'Playfair Display', serif" }}>Corriger Monoko</h3>
                            <button onClick={() => setCorrectionMsg(null)} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--m-muted)", padding:4 }}><CloseIcon /></button>
                          </div>

                          <p style={{ fontSize:12, fontWeight:600, color:"var(--m-muted)", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Type d'erreur</p>
                          <div style={{ display:"flex", gap:6, marginBottom:16, flexWrap:"wrap" }}>
                            {[
                              { key:"incorrect", label:"Incorrecte" },
                              { key:"partial", label:"Partiellement correcte" },
                              { key:"missing", label:"Contexte manquant" },
                            ].map(t => (
                              <button key={t.key} onClick={() => setCorrectionType(t.key)} style={{
                                padding:"8px 14px", borderRadius:10, fontSize:12, fontWeight:600, cursor:"pointer",
                                fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s",
                                background: correctionType === t.key ? "#0EA5E920" : "white",
                                border: correctionType === t.key ? "2px solid #0EA5E9" : "1px solid var(--m-line)",
                                color: correctionType === t.key ? "#0EA5E9" : "var(--m-ink)",
                              }}>{t.label}</button>
                            ))}
                          </div>

                          <p style={{ fontSize:12, fontWeight:600, color:"var(--m-muted)", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Traduction correcte en {langName} *</p>
                          <textarea value={correctionText} onChange={e => setCorrectionText(e.target.value)}
                            placeholder={`Écrivez la traduction correcte en ${langName}...`}
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid var(--m-line)", borderRadius:8, fontSize:16, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:12 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="var(--m-line)"}
                          />

                          <p style={{ fontSize:12, fontWeight:600, color:"var(--m-muted)", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Traduction française correspondante *</p>
                          <textarea value={correctionFrench} onChange={e => setCorrectionFrench(e.target.value)}
                            placeholder="Écrivez la phrase en français correspondante..."
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid var(--m-line)", borderRadius:8, fontSize:16, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:12 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="var(--m-line)"}
                          />

                          <p style={{ fontSize:12, fontWeight:600, color:"var(--m-muted)", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Phrase d'exemple (optionnel)</p>
                          <textarea value={correctionExample} onChange={e => setCorrectionExample(e.target.value)}
                            placeholder="Une phrase utilisant ce mot en contexte..."
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid var(--m-line)", borderRadius:8, fontSize:14, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:16 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="var(--m-line)"}
                          />

                          <button onClick={() => submitCorrection(correctionMsg)}
                            disabled={!correctionText.trim() || !correctionFrench.trim()}
                            style={{
                              width:"100%", padding:"14px", border:"none", borderRadius:8, fontSize:15, fontWeight:700,
                              cursor: (correctionText.trim() && correctionFrench.trim()) ? "pointer" : "default",
                              fontFamily:"'DM Sans', sans-serif",
                              background: (correctionText.trim() && correctionFrench.trim()) ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "var(--m-line)",
                              color: "white",
                            }}>
                            Envoyer la correction
                          </button>
                        </React.Fragment>
                      )}
                    </div>
                  </div>
                )}
              </div></StandardPage>
            )}
            <LevelChallengeBriefModal course={challengeBriefCourse} challenge={challengeBriefCourse ? levelChallenges[challengeBriefCourse.id] : null} loading={poolLoading} onClose={() => setChallengeBriefCourse(null)} onStart={startLevelChallenge}/>
            {languageSheet && (
              <div className="m-modal-scrim" role="presentation" onMouseDown={event => { if (event.target === event.currentTarget) setLanguageSheet(false); }}>
                <section className="m-modal m-language-sheet" role="dialog" aria-modal="true" aria-labelledby="language-sheet-title">
                  <button className="m-modal-close" onClick={() => setLanguageSheet(false)} aria-label="Fermer"><UiIcon name="close"/></button>
                  <div className="m-modal-body">
                    <div className="m-kicker"><span>Langue</span></div>
                    <h2 id="language-sheet-title">Changer de langue</h2>
                    <div className="m-language-grid">
                      {languages.map(lang => {
                        const current = lang.id === selectedLang?.id;
                        return <button key={lang.id} className={`m-language-entry ${current ? "current" : ""}`} onClick={() => chooseLanguage(lang)}>
                          <span className="m-language-flag">{LANG_THEMES[lang.name]?.emoji || "🌍"}</span>
                          <span className="m-language-entry-copy">
                            <small>{current ? "Langue actuelle" : "Disponible"}</small>
                            <strong>Français · {lang.name}</strong>
                            <span>{lang.wordCount?.toLocaleString() || 0} mots</span>
                          </span>
                          <span className="m-language-entry-arrow"><UiIcon name={current ? "check" : "arrow"}/></span>
                        </button>;
                      })}
                    </div>
                  </div>
                </section>
              </div>
            )}
            <CultureModal capsule={selectedCapsule} onClose={() => setSelectedCapsule(null)} onCelebrate={celebrate}/>
            <CelebrationLayer burst={celebration}/>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
