            display: "flex", flexWrap: "wrap", alignItems: "center", gap: "8px 6px",
            padding: 14, borderRadius: 14, border: "1px solid #E8E0D4", background: "white",
            fontFamily: "'Playfair Display', serif", fontSize: 18, color: "#2D2118",
          }}>
            {exercise.tokens.map((t, i) => i === exercise.blankIndex ? (
              solved ? (
                <b key={i} style={{ color: "#16A34A" }}>{exercise.answer}</b>
              ) : (
                <input key={i} value={typed} onChange={e => setTyped(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); submit(); } }}
                  autoFocus
                  // iOS autocorrect rewrites Lingala into French words, and
                  // autocapitalise would fight every lowercase answer. 16px is
                  // the floor that stops iOS zooming the page on focus.
                  autoCapitalize="none" autoCorrect="off" autoComplete="off"
                  spellCheck={false} enterKeyHint="done"
                  aria-label="Mot manquant"
                  style={{
                    width: `${Math.max(5, [...exercise.answer].length + 1)}ch`,
                    minHeight: 44, fontSize: 16, padding: "4px 8px",
                    fontFamily: "'DM Sans', sans-serif",
                    border: "none", borderBottom: `2px solid ${border}`,
                    background: wrong ? "#FDF0F0" : "transparent",
                    color: "#2D2118", outline: "none", textAlign: "center",
                    transition: "border-color .15s, background .15s",
                  }} />
              )
            ) : (
              <span key={i}>{t}</span>
            ))}
          </div>

          {!solved && (
            <button onClick={submit} disabled={!typed.trim() || wrong}
              style={{
                marginTop: 14, width: "100%", minHeight: 52, borderRadius: 14, border: "none",
                background: !typed.trim() || wrong ? "#E8E0D4" : "linear-gradient(135deg, #6B21A8, #9333EA)",
                color: !typed.trim() || wrong ? "#9B8A6E" : "white",
                fontSize: 16, fontWeight: 700, fontFamily: "'DM Sans', sans-serif",
                cursor: !typed.trim() || wrong ? "default" : "pointer",
              }}>Vérifier</button>
          )}

          <div style={{ flex: 1, minHeight: 12 }} />

          {solved && (
            <div style={{ background: "#EAF7EE", borderRadius: 16, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, color: "#16A34A", fontWeight: 600 }}>
                ✓ {exercise.item.ln}
              </p>
              {showedAccent && (
                <p style={{ margin: "6px 0 0", fontSize: 13, color: "#8B6D47" }}>
                  Avec les accents&nbsp;:{" "}
                  <b style={{ fontFamily: "'Playfair Display', serif", color: "#2C5F2D" }}>
                    {exercise.answer}
                  </b>
                </p>
              )}
            </div>
          )}
          {wrong && (
            <div style={{ background: "#FDF0F0", borderRadius: 16, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45 }}>
                <b style={{ fontFamily: "'Playfair Display', serif", color: "#2C5F2D" }}>{exercise.answer}</b>
                {" — réessayez."}
              </p>
            </div>
          )}
        </div>
      );
    };

    // ── Listen and type ───────────────────────────────────────────────────────
    const ListenTypeScreen = ({ exercise, onDone, onMiss, onAnswer }) => {
      const [placed, setPlaced] = useState([]);   // tiles, in tapped order
      const [wrong, setWrong] = useState(false);
      const [solved, setSolved] = useState(false);
      const missedHere = React.useRef(false);

      const plain = exercise.words.map(w => w.join("")).join(" ");   // what the tiles spell
      const real = exercise.item.ln;                                  // how it is really written
      const slots = exercise.words.reduce((n, w) => n + w.length, 0);
      // True when the real spelling carries something the tiles did not offer —
      // a tone, an ɛ or ɔ. That difference is the thing worth pointing at.
      const accented = plain !== real.toLowerCase();

      const check = (next) => {
        // Compared against the FOLDED spelling, because that is what the tiles
        // offer. The accents are taught in the reveal instead of being demanded
        // from someone who has heard the word once.
        if (next.map(t => t.ch).join("") === exercise.words.flat().join("")) {
          setSolved(true);
          if (!exercise.retry) onAnswer(exercise.item, !missedHere.current);
          afterClip(playingClip(exercise.item.audio) || playClip(exercise.item.audio), onDone);
        } else {
          setWrong(true);
          missedHere.current = true;
          onMiss(exercise.item);
          setTimeout(() => { setPlaced([]); setWrong(false); }, 1400);
        }
      };

      const tapTile = (tile) => {
        if (solved || wrong || placed.length >= slots) return;
        const next = [...placed, tile];
        setPlaced(next);
        if (next.length === slots) check(next);
      };

      const tapPlaced = (i) => {
        if (solved || wrong) return;
        setPlaced(placed.filter((_, j) => j !== i));
      };

      // Which slot each placed character lands in, word by word. The gap between
      // words is drawn rather than typed, so the learner never hunts for a space.
      let cursor = 0;
      const rows = exercise.words.map((w, wi) => {
        const start = cursor; cursor += w.length;
        return { wi, start, length: w.length };
      });

      return (
        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
          <p style={{ fontSize: 13, color: "#9B8A6E", margin: "0 0 6px",
                      fontFamily: "'DM Mono', monospace", letterSpacing: ".06em",
                      textTransform: "uppercase" }}>
            Écrivez ce que vous entendez
          </p>

          <div style={{ marginBottom: 16 }}>
            <ClipPlayer audio={exercise.item.audio} seed={exercise.item.id} />
          </div>

          {/* One group of slots per word. */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 16, justifyContent: "center",
                        minHeight: 56, marginBottom: 18 }}>
            {rows.map(({ wi, start, length }) => (
              // Wraps within the word too: at 14 characters a single row of
              // slots is 476px against 339px of usable width, and the one thing
              // no screen may do is scroll sideways.
              <div key={wi} style={{ display: "flex", gap: 4, flexWrap: "wrap", justifyContent: "center" }}>
                {Array.from({ length }, (_, k) => {
                  const tile = placed[start + k];
                  return (
                    <button key={k} onClick={() => tile && tapPlaced(start + k)}
                      disabled={!tile || solved || wrong}
                      style={{
                        width: slots > 10 ? 26 : 30, height: 44, borderRadius: 8, border: "none",
                        borderBottom: `2px solid ${wrong ? "#DC2626" : solved ? "#16A34A" : "#C9BCA6"}`,
                        background: "transparent", cursor: tile && !solved ? "pointer" : "default",
                        fontFamily: "'Playfair Display', serif", fontSize: 20, fontWeight: 700,
                        color: wrong ? "#DC2626" : solved ? "#16A34A" : "#2D2118",
                        padding: 0, transition: "border-color .15s, color .15s",
                      }}>{tile ? tile.ch : ""}</button>
                  );
                })}
              </div>
            ))}
          </div>

          {/* The bank. A used tile greys out in place rather than vanishing, so
              the letters never shuffle under a finger mid-word. */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" }}>
            {exercise.tiles.map(t => {
              const used = placed.some(p => p.key === t.key);
              return (
                <button key={t.key} onClick={() => tapTile(t)} disabled={used || solved || wrong}
                  style={{
                    minWidth: 44, minHeight: 44, padding: "8px 10px", borderRadius: 10,
                    border: `1.5px solid ${used ? "#EFE8DC" : "#E8E0D4"}`,
                    background: used ? "#F7F2E9" : "white",
                    color: used ? "transparent" : "#2D2118",
                    fontFamily: "'Playfair Display', serif", fontSize: 18, fontWeight: 600,
                    cursor: used || solved || wrong ? "default" : "pointer",
                    transition: "background .15s, border-color .15s",
                  }}>{t.ch}</button>
              );
            })}
          </div>

          <div style={{ flex: 1, minHeight: 12 }} />

          {/* The reveal is where the real orthography is taught: the learner
              built plain letters, and this is how the word is actually written. */}
          {solved && (
            <div style={{ background: "#EAF7EE", borderRadius: 16, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 15, fontWeight: 700,
                          fontFamily: "'Playfair Display', serif", color: "#16A34A" }}>
                ✓ {real}
              </p>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: "#9B8A6E" }}>{exercise.item.fr}</p>
              {accented && (
                <p style={{ margin: "8px 0 0", fontSize: 13, color: "#8B6D47" }}>
                  Vous avez écrit <i>{plain}</i> — avec les tons, cela s'écrit{" "}
                  <b style={{ fontFamily: "'Playfair Display', serif", color: "#2C5F2D" }}>{real}</b>
                </p>
              )}
            </div>
          )}
          {wrong && (
            <div style={{ background: "#FDF0F0", borderRadius: 16, padding: "14px 16px", marginBottom: 12 }}>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.45 }}>
                <b style={{ fontFamily: "'Playfair Display', serif", color: "#2C5F2D" }}>{real}</b>
                {" — "}{exercise.item.fr}
              </p>
            </div>
          )}
        </div>
      );
    };

    // Renderer per exercise type. Adding fill-the-blank later means adding one
    // entry here — the shell, progress, scoring and summary stay untouched.
    const EXERCISE_SCREENS = {
      match_pairs: MatchPairsScreen,
      choose_audio: ChooseAudioScreen,
      word_order: WordOrderScreen,
      fill_blank: FillBlankScreen,
      listen_type: ListenTypeScreen,
    };

    // 80% of a session's questions, right the first time, passes Pratiquer and
    // unlocks Élargir. Failing costs nothing but the session — no lives, no
    // lockout, retry immediately.
    const PASS_PCT = 80;

    // What each stage draws on, in the learner's words. Shown before the first
    // question, because "Pratiquer" and "Élargir" do not explain themselves —
    // one is the lesson the professor wrote, the other is everything else the
    // course knows about the same topic.
    const STAGE_BRIEF = {
      pratiquer: {
        label: "Pratiquer",
        tag: "La leçon elle-même",
        blurb: "Uniquement ce que le professeur a écrit dans cette leçon. C'est ce qui valide la leçon : 80% de bonnes réponses du premier coup.",
        accent: "#6B21A8",
        soft: "#F4EEFB",
      },
      elargir: {
        label: "Élargir",
        tag: "Au-delà de la leçon",
        blurb: "Des phrases du corpus sur le même thème, que la leçon n'enseigne pas. Sans fin, rejouable — on va plus loin à chaque partie.",
        accent: "#2C5F2D",
        soft: "#EAF7EE",
      },
    };

    const SessionView = ({ lesson, stage, exercises, poolSize, stats,
                           onExit, onSeeLesson, onSessionEnd, onReport }) => {
      const [started, setStarted] = useState(false);
      const [queue, setQueue] = useState(exercises);
      const [idx, setIdx] = useState(0);
      const [xp, setXp] = useState(0);
      const [missed, setMissed] = useState([]);      // pairs answered wrong, deduped
      const [done, setDone] = useState(false);
      const [reporting, setReporting] = useState(false);
      const [reported, setReported] = useState([]);  // item ids already flagged

      // One row per question, first try only. Held in a ref because `advance`
      // has to read the score in the same tick it decides the session is over.
      const attempts = React.useRef([]);
      const flushed = React.useRef(false);
      const endRef = React.useRef(onSessionEnd);
      endRef.current = onSessionEnd;

      const recordAnswer = (item, correct) => {
        if (item && item.poolId != null)
          attempts.current.push({ pool_item_id: item.poolId, correct, format: current?.type || "unknown" });
      };

      const firstTryPct = () => {
        const list = attempts.current;
        return list.length ? Math.round(100 * list.filter(a => a.correct).length / list.length) : 0;
      };

      // The session is the unit of writing: one insert at the end beats 20 round
      // trips landing inside the interaction. An abandoned session still flushes
      // — its attempts feed the mastery counter, which counts items ever answered
      // correctly, not sessions finished — but only a completed session may move
      // the stage state, because only a completed session can pass the gate.
      const flush = (completed, pct = 0, xpEarned = 0) => {
        if (flushed.current) return;
        flushed.current = true;
        if (!completed && !attempts.current.length) return;
        endRef.current?.({ completed, stage, attempts: attempts.current, pct, xp: xpEarned });
      };

      useEffect(() => () => flush(false), []);

      // Both counted in questions, so the bar moves by five across a five-pair
      // screen and by one across a choose-the-audio screen. `queue` grows when a
      // retry screen is appended, so neither is fixed at mount.
      const totalQuestions = countQuestions(queue);
      const answered = countQuestions(queue.slice(0, idx));
      const current = queue[idx];
      const Screen = current && EXERCISE_SCREENS[current.type];

      // Fetch this screen's clips and the next one's. By the time a learner has
      // read the prompt and reached for a tile, the bytes are already local, so
      // the ~340ms round trip never lands inside the interaction.
      useEffect(() => {
        primeClips(exerciseClips(queue[idx]));
        primeClips(exerciseClips(queue[idx + 1]));
      }, [idx, queue]);

      // Blob URLs leak until revoked; a long practice run would otherwise hold
      // every clip it ever played.
      useEffect(() => releaseClips, []);

      const noteMiss = (pair) => setMissed(m => m.some(x => x.id === pair.id) ? m : [...m, pair]);

      const advance = () => {
        const xpNow = xp + 10 * questionCount(current);   // 10 a question, not a screen
        setXp(xpNow);
        // Anything missed comes back before the session can end, as a screen
        // built from the missed pairs themselves. This one screen may fall below
        // PAIRS_MIN: it is re-exposure, not assessment — the answer has already
        // been shown, and retries never feed the first-try pass rate.
        if (idx + 1 >= queue.length) {
          const retry = missed.filter(m => !m.retried);
          if (retry.length >= 2) {
            const batch = retry.slice(0, PAIRS_MAX).map(p => ({ ...p, retried: true }));
            setMissed(m => m.map(x => batch.some(b => b.id === x.id) ? { ...x, retried: true } : x));
            setQueue(q => [...q, { type: "match_pairs", pairs: batch, retry: true }]);
            setIdx(i => i + 1);
            return;
          }
          setDone(true);
          flush(true, firstTryPct(), xpNow);
          return;
        }
        setIdx(i => i + 1);
      };

      const pct = done ? 100 : Math.round(100 * answered / Math.max(1, totalQuestions));

      const brief = STAGE_BRIEF[stage] || STAGE_BRIEF.pratiquer;

      // A taste of what this session will actually ask, taken from the built
      // queue rather than from the lesson — so it is a promise the session keeps.
      const preview = React.useMemo(() => {
        const seen = new Set(), out = [];
        for (const ex of exercises) for (const it of screenItems(ex)) {
          const k = (it.fr || "").trim().toLowerCase();
          if (k && !seen.has(k)) { seen.add(k); out.push(it.fr.trim()); }
        }
        return out;
      }, [exercises]);

      if (!started) {
        const runs = stats?.runs || 0, best = stats?.best || 0;
        return (
          <div style={{
            minHeight: "100dvh", background: "#FDFBF7",
            display: "flex", flexDirection: "column",
            padding: "calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px)",
          }}>
            <button onClick={onExit} aria-label="Quitter" style={{
              width: 44, height: 44, marginLeft: -10, border: "none", background: "none",
              color: "#9B8A6E", fontSize: 26, lineHeight: 1, cursor: "pointer", textAlign: "left",
            }}>×</button>

            {/* Scrolls rather than overflowing: badge + title + blurb + three
                tiles + a best-score card + eight chips runs past 667px on an
                iPhone SE, and the Commencer button must never be pushed off. */}
            <div style={{ flex: 1, minHeight: 0, overflowY: "auto",
                          display: "flex", flexDirection: "column", justifyContent: "center" }}>
              <span style={{
                alignSelf: "flex-start", background: brief.soft, color: brief.accent,
                fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                textTransform: "uppercase", padding: "6px 12px", borderRadius: 20, marginBottom: 14,
              }}>{brief.tag}</span>

              <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, fontWeight: 800,
                           margin: "0 0 6px", lineHeight: 1.2 }}>{brief.label}</h2>
              <p style={{ margin: "0 0 16px", fontSize: 15, color: "#5C4A2E", fontWeight: 600 }}>
                {lesson.title}
              </p>
              <p style={{ margin: "0 0 22px", fontSize: 15, lineHeight: 1.5, color: "#6B5B45" }}>
                {brief.blurb}
              </p>

              {/* Three numbers, and each one is honest: the session's real
                  length, how deep the material goes, how often you have played. */}
              <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
                {[[totalQuestions, "questions"],
                  [poolSize || "—", "expressions"],
                  [runs, runs === 1 ? "partie" : "parties"]].map(([v, l]) => (
                  <div key={l} style={{ flex: 1, border: "1px solid #E8E0D4", borderRadius: 14,
                                        padding: "13px 8px", background: "white", textAlign: "center" }}>
                    <b style={{ display: "block", fontFamily: "'DM Mono', monospace", fontSize: 20,
                                fontVariantNumeric: "tabular-nums", color: brief.accent }}>{v}</b>
                    <span style={{ fontSize: 11, color: "#9B8A6E", letterSpacing: ".05em",
                                   textTransform: "uppercase", fontFamily: "'DM Mono', monospace" }}>{l}</span>
                  </div>
                ))}
              </div>

              {best > 0 && (
                <div style={{
                  display: "flex", alignItems: "center", gap: 10, marginBottom: 20,
                  padding: "12px 16px", borderRadius: 14, background: brief.soft,
                }}>
                  <span style={{ fontSize: 18 }}>{best >= 100 ? "🏆" : best >= 80 ? "⭐" : "📈"}</span>
                  <span style={{ fontSize: 14, color: "#5C4A2E" }}>
                    Meilleur score&nbsp;: <b style={{ color: brief.accent }}>{best}%</b>
                    {stage === "pratiquer" && stats?.passed ? " · leçon validée ✓" : ""}
                  </span>
                </div>
              )}

              {preview.length > 0 && (
                <div style={{ marginBottom: 8 }}>
                  <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: ".1em",
                              textTransform: "uppercase", color: "#9B8A6E", margin: "0 0 10px" }}>
                    Au programme
                  </p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                    {preview.slice(0, 8).map(fr => (
                      <span key={fr} style={{
                        border: "1px solid #E8E0D4", background: "white", borderRadius: 20,
                        padding: "7px 13px", fontSize: 13, color: "#5C4A2E",
                      }}>{fr}</span>
                    ))}
                    {preview.length > 8 && (
                      <span style={{ padding: "7px 4px", fontSize: 13, color: "#9B8A6E" }}>
                        +{preview.length - 8} autres
                      </span>
                    )}
                  </div>
                </div>
              )}
            </div>

            <button onClick={() => setStarted(true)} style={{
              width: "100%", minHeight: 56, border: "none", borderRadius: 14,
              background: `linear-gradient(135deg, ${brief.accent}, ${stage === "elargir" ? "#4A8B4C" : "#9333EA"})`,
              color: "white", fontSize: 17, fontWeight: 700, cursor: "pointer",
              fontFamily: "'DM Sans', sans-serif", marginTop: 18,

    // ── Lingala TTS — calls Space directly from browser (no Vercel proxy) ───────
    // Proxy times out on free Vercel plan (10s); ESPnet2 CPU inference takes 20-40s.
    // Space is public — no API key to protect.
    const LINGALA_TTS_SPACE = "https://kemz42-monoko-lingala-tts.hf.space";

    const chatAudioCache = {}; // module-level — survives re-renders, shared across chat messages

    async function lingalaTTS(text) {
      // Step 1: start Gradio prediction
      // Gradio 6.x uses /gradio_api/ prefix (was /call/ in 4.x)
      const startRes = await fetch(`${LINGALA_TTS_SPACE}/gradio_api/call/synthesise`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: [text] }),
      });
      if (!startRes.ok) {
        const errText = await startRes.text().catch(() => "");
        throw new Error(`Space ${startRes.status}: ${errText.slice(0,100)}`);
      }
      const startJson = await startRes.json();
      const event_id = startJson.event_id;
      if (!event_id) throw new Error(`No event_id. Got: ${JSON.stringify(startJson).slice(0,100)}`);

      // Step 2: stream SSE — do NOT use .text() (connection stays open in Gradio 6.x)
      // Gradio 6.x sends "event: complete"; older versions send "process_completed".
      const sseRes = await fetch(`${LINGALA_TTS_SPACE}/gradio_api/call/synthesise/${event_id}`);
      if (!sseRes.ok) throw new Error(`SSE ${sseRes.status}`);

      const reader = sseRes.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let audioUrl = null;

      try {
        outer: while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // Gradio 6.x sends "event: complete", older sends "process_completed"
          const DONE_MARKER = buffer.includes("event: complete") ? "event: complete"
                            : buffer.includes("process_completed") ? "process_completed"
                            : null;
          if (!DONE_MARKER) continue;

          const lines = buffer.split("\n");
          for (let i = 0; i < lines.length; i++) {
            if (!lines[i].includes(DONE_MARKER)) continue;
            for (let j = i + 1; j < lines.length; j++) {
              if (!lines[j].startsWith("data: ")) continue;
              try {
                const raw = lines[j].slice(6).trim();
                // Gradio 6.x "event: complete" data is a JSON array directly: [{"path":...,"url":...}]
                const parsed = JSON.parse(raw);
                const d = Array.isArray(parsed) ? parsed : (parsed.output?.data ?? parsed.data);
                if (!Array.isArray(d) || !d[0]) break;
                const a = d[0];
                const src = (typeof a === "string") ? a : (a?.url || a?.path || a?.name);
                if (src) audioUrl = src.startsWith("http") ? src : `${LINGALA_TTS_SPACE}/gradio_api/file=${src}`;
              } catch {}
              break outer;
            }
            break outer;
          }
        }
      } finally {
        reader.cancel();
      }

      if (!audioUrl) throw new Error(`No audio in SSE. Buffer: ${buffer.slice(0,200)}`);
      return audioUrl;
    }

    // ── Live Translation View ─────────────────────────────────────────────────
    function LiveTranslationView({ langName, langId, onBack }) {
      const [direction, setDirection] = useState("fr_to_lingala");
      const [isListening, setIsListening] = useState(false);
      const [segments, setSegments] = useState([]);
      const [liveText, setLiveText] = useState("");
      const [translating, setTranslating] = useState(false);
      const [error, setError] = useState("");
      const [playingId, setPlayingId] = useState(null);

      const isListeningRef = useRef(false);
      const directionRef = useRef("fr_to_lingala");
      const recognitionRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const chunkTimerRef = useRef(null);
      const translateTimerRef = useRef(null);
      const liveStreamRef = useRef(null); // persistent mic stream — reused across start/stop cycles
      const mimeTypeRef = useRef("audio/webm");
      const audioCacheRef = useRef({});
      const transEndRef = useRef(null);
      const analyserRef = useRef(null);   // { ctx, analyser, stream } — stream only set when we own it
      const rafRef = useRef(null);
      const barRefs = useRef([]);
      const vadTimerRef = useRef(null);
      const silenceStartRef = useRef(null);
      const utteranceStartRef = useRef(null);
      const liveHistoryRef = useRef([]);  // rolling last-4-turns for conversation memory

      // Warm-up TTS Space + RAG endpoints on mount so the first segment is fast
      useEffect(() => {
        fetch("/api/mms-tts").catch(() => {});
        if (langId) {
          fetch("/api/rag-context",    { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:"warm", language_id:langId }) }).catch(() => {});
          fetch("/api/lesson-context", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:"warm", language_id:langId }) }).catch(() => {});
        }
      }, []);

      // Keep refs in sync with state (needed inside async callbacks)
      useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
      useEffect(() => { directionRef.current = direction; }, [direction]);

      // Auto-scroll to bottom when new content arrives
      useEffect(() => { transEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [segments, liveText, translating]);

      // Cleanup on unmount — stop everything including the persistent stream
      useEffect(() => () => {
        stopAll();
        if (liveStreamRef.current) {
          liveStreamRef.current.getTracks().forEach(t => t.stop());
          liveStreamRef.current = null;
        }
      }, []);

      const stopAmplitudeLoop = () => {
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        if (analyserRef.current) {
          try { analyserRef.current.ctx.close(); } catch(e) {}
          analyserRef.current = null;
        }
        barRefs.current.forEach(el => { if (el) el.style.height = "4px"; });
      };

      const stopVAD = () => {
        if (vadTimerRef.current) { clearInterval(vadTimerRef.current); vadTimerRef.current = null; }
        silenceStartRef.current = null;
        utteranceStartRef.current = null;
      };

      // Replaces the fixed 6-second timer. Uses the AnalyserNode from startAmplitudeLoop
      // to detect real silence (RMS < threshold for 700ms) and trigger mediaRecorder.stop().
      // Falls back to a 6s timeout if AudioContext isn't available.
      const VAD_POLL_MS = 50;
      const VAD_SILENCE_MS = 700;
      const VAD_SILENCE_THRESH = 0.01;
      const VAD_MAX_MS = 15000;

      const startVAD = () => {
        stopVAD();
        if (!analyserRef.current) {
          // AudioContext unavailable — fall back to original fixed-window behaviour
          chunkTimerRef.current = setTimeout(() => {
            if (mediaRecorderRef.current?.state === "recording") mediaRecorderRef.current.stop();
          }, 6000);
          return;
        }
        silenceStartRef.current = null;
        utteranceStartRef.current = Date.now();
        vadTimerRef.current = setInterval(() => {
          if (!analyserRef.current || !isListeningRef.current || mediaRecorderRef.current?.state !== "recording") return;
          const { analyser } = analyserRef.current;
          const data = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteTimeDomainData(data);
          let rms = 0;
          for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; rms += v * v; }
          rms = Math.sqrt(rms / data.length);
          const now = Date.now();
          // Hard ceiling — split after VAD_MAX_MS regardless of speech
          if (utteranceStartRef.current && now - utteranceStartRef.current >= VAD_MAX_MS) {
            if (mediaRecorderRef.current?.state === "recording") mediaRecorderRef.current.stop();
            stopVAD();
            return;
          }
          if (rms < VAD_SILENCE_THRESH) {
            if (!silenceStartRef.current) silenceStartRef.current = now;
            else if (now - silenceStartRef.current >= VAD_SILENCE_MS) {
              if (mediaRecorderRef.current?.state === "recording") mediaRecorderRef.current.stop();
              stopVAD();
            }
          } else {
            silenceStartRef.current = null; // reset on speech
          }
        }, VAD_POLL_MS);
      };

      // ownStream=true: we opened the stream just for the waveform and must close it.
      // ownStream=false: MediaRecorder owns the stream; we must not stop its tracks.
      const startAmplitudeLoop = (stream, ownStream = false) => {
        stopAmplitudeLoop();
        try {
          const ctx = new AudioContext();
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 128;
          source.connect(analyser);
          const data = new Uint8Array(analyser.frequencyBinCount);
          analyserRef.current = { ctx, analyser, stream: ownStream ? stream : null };
          const tick = () => {
            analyser.getByteTimeDomainData(data);
            let rms = 0;
            for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; rms += v * v; }
            rms = Math.sqrt(rms / data.length);
            const scale = Math.min(rms * 8, 1);
            const now = Date.now();
            barRefs.current.forEach((el, i) => {
              if (!el) return;
              const wobble = 0.65 + 0.35 * Math.sin(now / 180 + i * 0.75);
              el.style.height = Math.round(4 + 28 * scale * wobble) + "px";
            });
            rafRef.current = requestAnimationFrame(tick);
          };
          tick();
        } catch(e) { /* AudioContext unsupported — waveform stays flat */ }
      };

      const stopAll = () => {
        clearTimeout(chunkTimerRef.current);
        clearTimeout(translateTimerRef.current);
        stopVAD();
        if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch(e) {} recognitionRef.current = null; }
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
          try { mediaRecorderRef.current.stop(); } catch(e) {}
        }
        stopAmplitudeLoop();
      };

      const toggleListening = async () => {
        if (isListening) {
          stopAll();
          setIsListening(false);
          setLiveText("");
        } else {
          setError("");
          if (direction === "lingala_to_fr") await startLingalaSTT();
          else startFrenchSTT();
        }
      };

      // ── French STT via Web Speech API ─────────────────────────────────────
      const startFrenchSTT = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          setError("La reconnaissance vocale n'est pas supportée dans ce navigateur. Utilisez Chrome ou Safari.");
          return;
        }
        const recognition = new SR();
        recognition.lang = "fr-FR";
        recognition.continuous = true;
        recognition.interimResults = true;
        let finalBuffer = "";

        recognition.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalBuffer += r[0].transcript + " ";
            else interim += r[0].transcript;
          }
          setLiveText(finalBuffer + interim);
          // Auto-translate after 1s pause — no punctuation needed
          if (finalBuffer.trim()) {
            clearTimeout(translateTimerRef.current);
            translateTimerRef.current = setTimeout(() => {
              const toTranslate = finalBuffer.trim();
              if (toTranslate) {
                finalBuffer = "";
                setLiveText("");
                handleTranslate(toTranslate, directionRef.current);
              }
            }, 1000);
          }
        };

        let fatalError = false;
        recognition.onerror = (e) => {
          if (e.error === "not-allowed" || e.error === "audio-capture") {
            fatalError = true;
            setError("Accès au microphone refusé. Autorisez le microphone dans les paramètres de votre navigateur.");
            setIsListening(false); isListeningRef.current = false;
          }
          // "no-speech" and "network" are transient — onend will handle restart
        };

        recognition.onend = () => {
          // Flush remaining text as a sentence
          if (finalBuffer.trim()) { handleTranslate(finalBuffer.trim(), directionRef.current); finalBuffer = ""; }
          // Chrome stops mid-session on silence — restart after a short delay so the
          // browser has time to fully close the previous session (avoids InvalidStateError)
          if (isListeningRef.current && !fatalError) {
            setTimeout(() => {
              if (isListeningRef.current) { try { recognition.start(); } catch(e) {} }
            }, 250);
          }
        };

        recognitionRef.current = recognition;
        recognition.start();
        setIsListening(true);
        isListeningRef.current = true;
        // Web Speech API doesn't expose raw audio — use/reuse liveStreamRef for the waveform
        const existingStream = liveStreamRef.current;
        if (existingStream && existingStream.getTracks().every(t => t.readyState === "live")) {
          startAmplitudeLoop(existingStream);
        } else {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => { liveStreamRef.current = stream; startAmplitudeLoop(stream); })
            .catch(() => {}); // waveform is cosmetic — fail silently
        }
      };

      // ── Lingala STT via ElevenLabs Scribe (chunked) ───────────────────────
      const blobToBase64 = (blob) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });

      const sendChunk = async () => {
        if (!audioChunksRef.current.length) return;
        const mime = mimeTypeRef.current;
        const blob = new Blob(audioChunksRef.current, { type: mime });
        audioChunksRef.current = [];
        if (blob.size < 500) { restartChunk(); return; } // skip silence

        try {
          const base64 = await blobToBase64(blob);
          const res = await fetch("/api/elevenlabs-stt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ audio: base64, mimeType: mime }),
          });
          if (res.ok) {
            const data = await res.json();
            const transcript = (data.text || "").trim();
            if (transcript) {
              setLiveText(transcript);
              await handleTranslate(transcript, directionRef.current);
              setLiveText("");
            }
          } else {
            const err = await res.json().catch(() => ({}));
            setError(`STT Lingala: ${err.error || res.status}. Vérifiez la clé ElevenLabs.`);
          }
        } catch(e) { console.error("Lingala STT error:", e); }
        restartChunk();
      };

      const restartChunk = () => {
        if (!isListeningRef.current || !mediaRecorderRef.current) return;
        try {
          if (mediaRecorderRef.current.state === "inactive") mediaRecorderRef.current.start();
          startVAD();
        } catch(e) {}
      };

      const startLingalaSTT = async () => {
        try {
          // Reuse the existing stream if tracks are still live — avoids re-prompting on mobile
          let stream = liveStreamRef.current;
          if (!stream || stream.getTracks().some(t => t.readyState === "ended")) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            liveStreamRef.current = stream;
          }
          const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
            : "audio/mp4";
          mimeTypeRef.current = mimeType;
          const recorder = new MediaRecorder(stream, { mimeType });
          // timeslice=250 ensures ondataavailable fires reliably every 250ms
          recorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
          recorder.onstop = sendChunk;
          mediaRecorderRef.current = recorder;
          recorder.start(250);
          setIsListening(true);
          isListeningRef.current = true;
          startAmplitudeLoop(stream); // MediaRecorder owns this stream; don't stop its tracks
          startVAD();
        } catch(e) {
          setError(e.name === "NotAllowedError"
            ? "Accès au microphone refusé. Autorisez le microphone dans les paramètres."
            : `Erreur microphone: ${e.message}`);
        }
      };

      // ── RAG translation pipeline ──────────────────────────────────────────
      const handleTranslate = async (sourceText, currentDirection) => {
        if (!sourceText.trim()) return;
        setTranslating(true);
        const fromLingala = currentDirection === "lingala_to_fr";

        try {
          const [ragRes, lessonRes] = await Promise.allSettled([
            fetch("/api/rag-context", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:sourceText, language_id:langId, min_similarity:0.5 }) }).then(r => r.ok ? r.json() : null),
            fetch("/api/lesson-context", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ query:sourceText, language_id:langId }) }).then(r => r.ok ? r.json() : null),
          ]);
          const ragContext    = ragRes.value?.context    || "";
          const lessonContext = lessonRes.value?.context || "";

          // Include last 4 turns so pronouns and continuations resolve correctly across segments
          const chatRes = await fetch("/api/chat", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              mode: "live-translation",
              direction: fromLingala ? "lingala_to_fr" : "fr_to_lingala",
              ragContext,
              lessonContext,
              languageId: langId,
              messages: [...liveHistoryRef.current.slice(-8), { role:"user", content:sourceText }],
            }),
          });
          if (!chatRes.ok) { setTranslating(false); return; }
          // api/chat streams SSE — accumulate full translation before rendering the segment
          const reader = chatRes.body.getReader();
          const decoder = new TextDecoder();
          let accumulated = "";
          let lineBuffer = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split("\n");
            lineBuffer = lines.pop();
            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const payload = line.slice(6).trim();
              if (payload === "[DONE]") continue;
              try { const p = JSON.parse(payload); if (p.delta) accumulated += p.delta; } catch {}
            }
          }
          const translation = accumulated.trim();
          if (translation) {
            // Update rolling history before rendering (keep last 4 turns = 8 messages)
            liveHistoryRef.current = [...liveHistoryRef.current, { role:"user", content:sourceText }, { role:"assistant", content:translation }].slice(-8);
            const newSeg = { id:Date.now(), source:sourceText, translation, audioUrl:null, fromLingala };
            setSegments(prev => [...prev, newSeg]);
          }
        } catch(e) { console.error("Translation error:", e); }
        setTranslating(false);
      };

      // ── Audio playback ────────────────────────────────────────────────────
      const playAudio = async (seg) => {
        setPlayingId(seg.id);
        if (seg.fromLingala) {
          // Target is French → Web Speech API
          const synth = window.speechSynthesis;
          if (!synth) { setPlayingId(null); return; }

          const doSpeak = () => {
            const u = new SpeechSynthesisUtterance(seg.translation);
            u.lang = "fr-FR";
            u.rate = 0.95;
            // Pick a French voice if available (avoids "canceled" on first load in Chrome)
            const voices = synth.getVoices();
            const frVoice = voices.find(v => v.lang.startsWith("fr"));
            if (frVoice) u.voice = frVoice;
            u.onend = () => setPlayingId(null);
            // Ignore "canceled" — fired when cancel() clears a stuck queue, not a real error
            u.onerror = (e) => { if (e.error !== "canceled") setPlayingId(null); };
            synth.speak(u);
          };

          synth.cancel(); // clear any stuck queue
          // Voices may not be loaded yet (Chrome loads them async)
          if (synth.getVoices().length === 0) {
            synth.onvoiceschanged = () => { synth.onvoiceschanged = null; doSpeak(); };
          } else {
            setTimeout(doSpeak, 50); // small gap for cancel() to settle
          }
          return;
        }
        // TODO: Fine-tune VITS on native Lingala recordings (Borgeas studio sessions)
        // Current: DigitalUmuganda/lingala_vits_tts via Kemz42/monoko-lingala-tts Space
        // Called directly from browser (bypasses Vercel 10s timeout — inference takes 20-40s)
        // Fallback: /api/elevenlabs-tts (English accent bias, but reliable)
        if (audioCacheRef.current[seg.translation]) {
          const audio = new Audio(audioCacheRef.current[seg.translation]);
          audio.onended = () => setPlayingId(null);
          audio.play();
          return;
        }
        try {
          const audioUrl = await lingalaTTS(seg.translation);
          audioCacheRef.current[seg.translation] = audioUrl;
          setSegments(prev => prev.map(s => s.id === seg.id ? { ...s, audioFailed:false } : s));
          const audio = new Audio(audioUrl);
          audio.onended = () => setPlayingId(null);
          audio.play();
        } catch(e) {
          console.error("TTS error:", e);
          // ── ElevenLabs fallback (English accent, but reliable) ────────────
          // try {
          //   const res = await fetch("/api/elevenlabs-tts", {
          //     method:"POST", headers:{"Content-Type":"application/json"},
          //     body: JSON.stringify({ text: seg.translation }),
          //   });
          //   if (!res.ok) throw new Error(`ElevenLabs ${res.status}`);
          //   const blob = await res.blob();
          //   const url = URL.createObjectURL(blob);
          //   audioCacheRef.current[seg.translation] = url;
          //   const audio = new Audio(url);
          //   audio.onended = () => setPlayingId(null);
          //   audio.play(); return;
          // } catch(e2) { console.error("ElevenLabs fallback failed:", e2); }
          // ─────────────────────────────────────────────────────────────────
          setSegments(prev => prev.map(s => s.id === seg.id ? { ...s, audioFailed:true, audioError:e.message } : s));
          setPlayingId(null);
        }
      };

      const swapDirection = () => {
        if (isListening) { stopAll(); setIsListening(false); isListeningRef.current = false; setLiveText(""); }
        setDirection(prev => prev === "fr_to_lingala" ? "lingala_to_fr" : "fr_to_lingala");
        setError("");
        liveHistoryRef.current = []; // conversation context is language-specific — reset on swap
      };

      const isFromLingala = direction === "lingala_to_fr";
      const sourceLang = isFromLingala ? langName : "Français";
      const targetLang = isFromLingala ? "Français" : langName;


      return (
        <div style={{ animation:"fadeIn 0.3s ease-out", display:"flex", flexDirection:"column", height:"calc(100dvh - 80px)", paddingTop:12 }}>

          {/* ── Top bar ── */}
          <div style={{ flexShrink:0, display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
            <button onClick={() => { stopAll(); onBack(); }} style={{
              display:"flex", alignItems:"center", gap:5, background:"none", border:"none",
              color:"#8B6D47", fontSize:14, fontWeight:600, cursor:"pointer", padding:"6px 0",
              fontFamily:"'DM Sans', sans-serif",
            }}><ArrowLeft size={16} /> Accueil</button>

            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
{segments.length > 0 && (
                <button onClick={() => { setSegments([]); setLiveText(""); }} style={{
                  background:"none", border:"none", color:"#C4B8A4", fontSize:12,
                  cursor:"pointer", fontFamily:"'DM Sans', sans-serif", padding:"6px 0",
                }}>Effacer</button>
              )}
            </div>
          </div>

          {/* ── Language switcher ── */}
          <div style={{
            flexShrink:0, display:"flex", alignItems:"center",
            background:"white", borderRadius:18, border:"1px solid #E8E0D4",
            boxShadow:"0 2px 8px rgba(0,0,0,0.06)", marginBottom:12, overflow:"hidden",
          }}>
            <div style={{ flex:1, textAlign:"center", padding:"14px 10px" }}>
              <div style={{ fontSize:10, fontWeight:700, color:"#9B8A6E", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:3 }}>Je parle</div>
              <div style={{ fontSize:17, fontWeight:800, color:"#2D2118", fontFamily:"'DM Sans', sans-serif" }}>{sourceLang}</div>
            </div>
            <button onClick={swapDirection} title="Inverser" style={{
              flexShrink:0, width:44, height:44, borderRadius:"50%",
              background:"linear-gradient(135deg, #2D2118, #4A3728)",
              border:"none", color:"white", fontSize:18, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center",
              boxShadow:"0 2px 8px rgba(0,0,0,0.18)", transition:"transform 0.2s",
            }}>⇄</button>
            <div style={{ flex:1, textAlign:"center", padding:"14px 10px" }}>
              <div style={{ fontSize:10, fontWeight:700, color:"#9B8A6E", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:3 }}>Traduction</div>
              <div style={{ fontSize:17, fontWeight:800, color:"#16A34A", fontFamily:"'DM Sans', sans-serif" }}>{targetLang}</div>
            </div>
          </div>

          {/* ── Error banner ── */}
          {error && (
            <div style={{ flexShrink:0, background:"#FEF2F2", border:"1px solid #FECACA", borderRadius:12, padding:"10px 14px", marginBottom:10, fontSize:13, color:"#DC2626" }}>
              ⚠️ {error}
            </div>
          )}

          {/* ── Conversation scroll ── */}
          <div style={{ flex:1, minHeight:0, overflowY:"auto", paddingBottom:4 }}>

            {/* Empty state */}
            {segments.length === 0 && !liveText && !translating && (
              <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100%", gap:12, color:"#C4B8A4" }}>
                <div style={{ fontSize:40 }}>🎙️</div>
                <p style={{ fontSize:14, fontStyle:"italic", textAlign:"center", lineHeight:1.6, maxWidth:220 }}>
                  {isListening ? `Parlez en ${sourceLang}…` : "Appuyez sur le micro et parlez — la traduction s'affiche en temps réel"}
                </p>
              </div>
            )}

            {/* Segments — side-aligned by speaker: FR left, Lingala right */}
            {segments.map((s, idx) => {
              const sFromLang = s.fromLingala ? langName : "Français";
              const isRight = s.fromLingala;
              return (
                <div key={s.id} style={{
                  marginBottom:10, width:"85%",
                  marginLeft: isRight ? "auto" : 0,
                  marginRight: isRight ? 0 : "auto",
                  background: isRight ? "#F0FDF4" : "white",
                  borderRadius:16,
                  border: `1px solid ${isRight ? "#BBF7D0" : "#E8E0D4"}`,
                  boxShadow:"0 1px 6px rgba(0,0,0,0.05)",
                  overflow:"hidden", animation:"slideIn 0.25s ease-out",
                }}>
                  {/* Source text */}
                  <div style={{ padding:"10px 14px 6px", borderBottom:`1px solid ${isRight ? "#DCFCE7" : "#F2EDE6"}` }}>
                    <span style={{ fontSize:11, fontWeight:700, color: isRight ? "#16A34A" : "#C4B8A4", textTransform:"uppercase", letterSpacing:"0.07em", marginRight:6 }}>{sFromLang}</span>
                    <span style={{ fontSize:13, color:"#9B8A6E", fontFamily:"'Source Serif 4', serif" }}>{s.source}</span>
                  </div>
                  {/* Translation */}
                  <div style={{ padding:"10px 14px 12px", display:"flex", alignItems:"center", gap:10 }}>
                    <div style={{ flex:1, fontSize:17, fontWeight:700, color:"#2D2118", lineHeight:1.5, fontFamily:"'DM Sans', sans-serif" }}>
                      {s.translation}
                    </div>
                    {!s.audioFailed ? (
                      <button onClick={() => playAudio(s)} style={{
                        flexShrink:0, width:38, height:38, borderRadius:"50%", border:"none",
                        cursor:"pointer", fontSize:14, display:"flex", alignItems:"center", justifyContent:"center",
                        background: playingId === s.id ? "#16A34A" : "#F0F9F0",
                        color: playingId === s.id ? "white" : "#16A34A",
                        transition:"all 0.15s",
                      }}>
                        {playingId === s.id ? "■" : "▶"}
                      </button>
                    ) : (
                      <span style={{ fontSize:11, color:"#C4B8A4" }}>—</span>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Live interim text while speaking */}
            {liveText && (
              <div style={{ padding:"8px 14px", borderRadius:12, background:"#FAFAF8", border:"1px dashed #E8E0D4", marginBottom:8 }}>
                <span style={{ fontSize:11, fontWeight:700, color:"#C4B8A4", textTransform:"uppercase", letterSpacing:"0.07em", marginRight:6 }}>{sourceLang}</span>
                <span style={{ fontSize:14, color:"#9B8A6E", fontStyle:"italic" }}>{liveText}</span>
              </div>
            )}

            {/* Translating spinner */}
            {translating && (
              <div style={{ padding:"10px 14px", borderRadius:12, background:"#F0FDF4", border:"1px solid #BBF7D0", marginBottom:8, display:"flex", alignItems:"center", gap:8 }}>
                <span style={{ fontSize:13, color:"#16A34A", animation:"spin 1s linear infinite", display:"inline-block" }}>⟳</span>
                <span style={{ fontSize:13, color:"#16A34A", fontStyle:"italic" }}>Traduction en cours…</span>
              </div>
            )}

            <div ref={transEndRef} />
          </div>

          {/* ── Bottom mic section ── */}
          <div style={{ flexShrink:0, paddingTop:10 }}>

            {/* Waveform — heights driven by real mic amplitude via AnalyserNode */}
            <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:3, height:36, marginBottom:12 }}>
              {Array.from({length:9}).map((_, i) => (
                <div key={i} ref={el => barRefs.current[i] = el} style={{
                  width:4, borderRadius:3,
                  background: isListening ? "#16A34A" : "#E8E0D4",
                  height:"4px",
                  transition:"background 0.3s",
                }} />
              ))}
            </div>

            {/* Mic button */}
            <div style={{ display:"flex", justifyContent:"center", marginBottom:10 }}>
              <button onClick={toggleListening} style={{
                width:80, height:80, borderRadius:"50%", border:"none", cursor:"pointer",
                background: isListening
                  ? "linear-gradient(135deg, #16A34A, #15803D)"
                  : "linear-gradient(135deg, #2D2118, #4A3728)",
                color:"white", fontSize:30,
                display:"flex", alignItems:"center", justifyContent:"center",
                animation: isListening ? "micRing 1.8s ease-in-out infinite" : "none",
                transition:"background 0.25s, transform 0.15s",
                transform: isListening ? "scale(1.05)" : "scale(1)",
              }}>
                {isListening ? "■" : "🎤"}
              </button>
            </div>

            {/* Status label */}
            <div style={{ textAlign:"center", fontSize:12, fontWeight:600, fontFamily:"'DM Sans', sans-serif", paddingBottom:4,
              color: translating ? "#16A34A" : isListening ? "#16A34A" : "#9B8A6E" }}>
              {translating ? "Traduction…" : isListening ? `En écoute — ${sourceLang}` : "Appuyer pour parler"}
            </div>

          </div>
        </div>
      );
    }

      const [mastery, setMastery] = useState({ done: 0, total: 0 });

      const [chatCorpusPairs, setChatCorpusPairs] = useState([]);

      // Load languages on mount
      useEffect(() => {

      const selectLanguage = async (lang) => {

      const switchLanguage = () => {

      // ── Progress helpers ──────────────────────────────────────────────────────
      const loadUserProgress = async (userId, languageId) => {
        if (!userId || !languageId) return;
        try {
          const { data } = await supabaseClient
            .from("user_progress")
            .select("lesson_id")
            .eq("user_id", userId)
            .eq("language_id", languageId);
          if (data) setUserProgress(new Set(data.map(r => r.lesson_id)));
        } catch(e) { console.error("loadUserProgress:", e); }
      };


      // ── Exercise stages ───────────────────────────────────────────────────────
      // Pratiquer draws on what the professor wrote into this lesson; Élargir on
      // what the routing pass placed there. Two disjoint pools, one builder.
      const STAGE_TIERS = {
        pratiquer: "tier=eq.native",
        elargir:   "tier=in.(approved,reassigned)",
      };

      const loadStageState = async (lessonId) => {
        if (!currentUser || !lessonId) { setStageState(null); setMastery({ done: 0, total: 0 }); return; }
        try {
          const [{ data: state }, native, correct] = await Promise.all([
            supabaseClient.from("lesson_stage_state").select("*")
              .eq("user_id", currentUser.id).eq("lesson_id", lessonId).maybeSingle(),
            supaFetch("lesson_pool", `lesson_id=eq.${lessonId}&tier=eq.native&select=id&limit=1000`),
            supabaseClient.from("exercise_attempts").select("pool_item_id")
              .eq("user_id", currentUser.id).eq("lesson_id", lessonId)
              .eq("stage", "pratiquer").eq("correct", true),
          ]);
          setStageState(state || null);
          // Distinct items, not attempts — answering the same word right in ten
          // sessions is one item mastered, not ten.
          const ids = new Set((correct.data || []).map(r => r.pool_item_id));
          const nativeIds = new Set((native || []).map(r => r.id));
          setMastery({
            done: [...ids].filter(id => nativeIds.has(id)).length,
            total: nativeIds.size,
          });
        } catch (e) {
          console.error("loadStageState:", e);
          setStageState(null); setMastery({ done: 0, total: 0 });
        }
      };

      // What this learner has already been asked in this lesson and stage, so a
      // repeat session can move on rather than re-roll. Keyed by `lesson_pool.id`
      // and valued by the most recent answer, which lets the builder put never-
      // seen items first and stalest-first after that.
      //
      // Read at session start rather than kept in state: attempts are written at
      // session END, so this is the only moment it can change.
      const loadSeenItems = async (lessonId, stage) => {
        if (!currentUser || !lessonId) return null;
        try {
          const { data } = await supabaseClient
            .from("exercise_attempts")
            .select("pool_item_id, answered_at")
            .eq("user_id", currentUser.id).eq("lesson_id", lessonId).eq("stage", stage)
            .order("answered_at", { ascending: false })
            .limit(2000);
          const seen = new Map();
          for (const r of data || []) {
            const t = Date.parse(r.answered_at) || 0;
            if (!seen.has(r.pool_item_id)) seen.set(r.pool_item_id, t);   // rows arrive newest-first
          }
          return seen;
        } catch (e) { console.error("loadSeenItems:", e); return null; }
      };

      // Chooses the material; `buildSession` decides what to do with it. The tier
      // filter is the whole stage split — without it practice served corpus rows
      // the lesson never taught (178 items for Salutations against 29 written).
      const startSession = async (stage) => {
        if (!selectedLesson) return;
        setPoolLoading(true);
        try {
          const level = selectedCourse?.course_order || 1;
          const [items, seen] = await Promise.all([
            supaFetch("lesson_pool",
              `lesson_id=eq.${selectedLesson.id}&${STAGE_TIERS[stage]}&select=*&limit=1000`),
            loadSeenItems(selectedLesson.id, stage),
          ]);
          const built = buildSession(items, level, SESSION_QUESTIONS, seen);
          if (!built.length) {
            setSessionNote(stage === "pratiquer"
              ? "Pas encore assez de contenu court dans cette leçon pour un exercice."
              : "Pas encore assez de contenu supplémentaire pour cette leçon.");
            return;
          }
          setSessionNote("");
          primeClips(exerciseClips(built[0]));   // first screen is instant too
          setSessionPoolSize(items.length);
          setSessionStage(stage);
          setSessionExercises(built);
        } catch (e) {
          console.error("startSession:", e);
          setSessionNote("Impossible de charger l'exercice. Réessayez.");
        } finally { setPoolLoading(false); }
      };

      // Called once per session, completed or abandoned. Attempts are written
      // either way — they are the mastery counter's evidence — but only a
      // completed session may move the gate.
      const handleSessionEnd = async ({ completed, stage, attempts, pct, xp }) => {
        if (!currentUser || !selectedLesson) return;
        const lessonId = selectedLesson.id;
        try {
          if (attempts.length) {
            await supabaseClient.from("exercise_attempts").insert(
              attempts.map(a => ({
                user_id: currentUser.id, pool_item_id: a.pool_item_id, lesson_id: lessonId,
                stage, format: a.format, correct: a.correct,
              })));
          }
          if (completed) {
            const prev = stageState || {};
            await supabaseClient.from("lesson_stage_state").upsert({
              user_id: currentUser.id, lesson_id: lessonId, language_id: langId,
              // Passing is a one-way door: a later weaker session must not take
              // Élargir away from someone who has already earned it.
              pratiquer_passed: prev.pratiquer_passed || (stage === "pratiquer" && pct >= PASS_PCT),
              pratiquer_best: stage === "pratiquer" ? Math.max(prev.pratiquer_best || 0, pct) : (prev.pratiquer_best || 0),
              elargir_best:   stage === "elargir"   ? Math.max(prev.elargir_best || 0, pct)   : (prev.elargir_best || 0),
              elargir_xp:     (prev.elargir_xp || 0) + (stage === "elargir" ? xp : 0),
              // Only completed sessions count as a play — quitting after two
              // questions is not a game, and counting it would make the number
              // dishonest to the person reading it.
              pratiquer_runs: (prev.pratiquer_runs || 0) + (stage === "pratiquer" ? 1 : 0),
              elargir_runs:   (prev.elargir_runs   || 0) + (stage === "elargir"   ? 1 : 0),
              updated_at: new Date().toISOString(),
            }, { onConflict: "user_id,lesson_id" });
          }
        } catch (e) {
          console.error("handleSessionEnd:", e);
        } finally {
          loadStageState(lessonId);      // refresh the gate and the counter
        }
      };

      // A learner flagging "this does not belong here" is the only QA pass that
      // scales to 4,849 routed rows. It lands in the existing corrections queue,
      // typed so the professor can tell a routing complaint from a translation
      // fix — the pair itself is already verified; its placement is what is in
      // question.
      const reportPoolItem = async (item) => {
        if (!item) return;
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/corrections`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json", Prefer: "return=minimal",
            },
            body: JSON.stringify({
              language_id: langId,
              user_query: `Signalement d'exercice — ${selectedLesson?.title || ""}`,
              ai_response: `${item.fr} → ${item.ln}`,
              correction_type: "routing",
              correct_french: item.fr,
              correct_lingala: item.ln,
              tester_name: testerName.trim() || null,
              session_id: testerSessionId || null,
              status: "pending",
            }),
          });
        } catch (e) { console.error("reportPoolItem:", e); }
      };

      const markLessonComplete = async () => {
        if (!currentUser || !selectedLesson || userProgress.has(selectedLesson.id)) return;
        try {
          const { error } = await supabaseClient.from("user_progress").upsert(
            { user_id: currentUser.id, lesson_id: selectedLesson.id, language_id: langId },
            { onConflict: "user_id,lesson_id" }
          );
          if (!error) setUserProgress(prev => new Set([...prev, selectedLesson.id]));
        } catch(e) { console.error("markLessonComplete:", e); }
      };

      const resumeLesson = async () => {
        if (!lastLesson || !currentUser) return;
        setLoading(true);
        try {
          const [courseArr, lessonsData] = await Promise.all([
            supaFetch("courses", `id=eq.${lastLesson.courseId}&select=*`),
            supaFetch("lessons", `course_id=eq.${lastLesson.courseId}&select=*,lesson_items(id)&order=lesson_order`),
          ]);
          const course = courseArr[0];
          if (!course) { setLoading(false); return; }
          setSelectedCourse({ ...course, lessons: lessonsData.map(l => ({ ...l, itemCount: l.lesson_items?.length || 0 })) });
          const target = lessonsData.find(l => l.id === lastLesson.lessonId);
          if (target) {
            setSelectedLesson(target);
            const items = await supaFetch("lesson_items", `lesson_id=eq.${target.id}&select=*&order=item_order`);
            setLessonItems(items);
            setCurrentCardIdx(0);
            setCardFlipped(false);
            setView("lesson");
          } else {
            setView("course_detail");
          }
        } catch(e) { console.error(e); }
        setLoading(false);
      };

      const requireAuth = (returnTo) => {
        setAuthReturnTo(returnTo);
        setAuthMode("login");
        setAuthEmail(""); setAuthPassword(""); setAuthDisplayName(""); setAuthError("");
        setView("auth");
      };

      const openChat = () => {
        if (!currentUser) { requireAuth("chat"); return; }
        setView("chat");
      };

      const saveTesterNameAndOpenChat = () => {
        const normalized = pendingTesterName.trim();
        if (!normalized) return;
        setTesterName(normalized);
        setView("chat");
      };

      const handleAuthSubmit = async () => {
        setAuthError(""); setAuthSubmitting(true);
        try {
          if (authMode === "signup") {
            const { data, error } = await supabaseClient.auth.signUp({
              email: authEmail.trim(),
              password: authPassword,
              options: {
                data: { display_name: authDisplayName.trim() || authEmail.trim().split("@")[0] },
                emailRedirectTo: "https://monoko-dictionary.vercel.app",
              },
            });
            if (error) throw error;
            if (data.user && !data.session) {
              setAuthError("✓ Vérifiez votre email pour confirmer votre compte.");
              setAuthSubmitting(false); return;
            }
          } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email: authEmail.trim(), password: authPassword });
            if (error) throw error;
          }
          // Success — navigate to intended destination
          if (authReturnTo === "chat") { setView("chat"); }
          else if (authReturnTo === "live") { setView("live"); }
          else if (authReturnTo === "courses") {
            setView("courses");
            if (langId) {
              setLoading(true);
              try { const d = await supaFetch("courses", `language_id=eq.${langId}&select=*,lessons(id)&order=course_order`); setCourses(d); }
              catch(e) { console.error(e); }
              setLoading(false);
            }
          } else { setView("home"); }
          setAuthReturnTo(null);
        } catch(e) {
          const msg = e.message || "";
          if (msg.includes("Invalid login")) setAuthError("Email ou mot de passe incorrect.");
          else if (msg.includes("already registered")) setAuthError("Cet email est déjà utilisé. Connectez-vous.");
          else if (msg.includes("Password")) setAuthError("Mot de passe trop court (6 caractères minimum).");
          else setAuthError(msg);
        }
        setAuthSubmitting(false);
      };

      const handleSignOut = async () => {
        await supabaseClient.auth.signOut();
        setTesterName("");
        setView("home");
      };

      useEffect(() => {
        if (view === "search" && inputRef.current) setTimeout(() => inputRef.current?.focus(), 100);
        if (view === "chat") fetch("/api/mms-tts").catch(() => {});
      }, [view]);

      // Reload progress whenever the logged-in user or active language changes
      useEffect(() => {
        if (currentUser && selectedLang) loadUserProgress(currentUser.id, selectedLang.id);
        else setUserProgress(new Set());
      }, [currentUser?.id, selectedLang?.id]);

      // The gate and the mastery counter are per lesson, so they load with it.
      useEffect(() => {
        loadStageState(selectedLesson?.id);
      }, [currentUser?.id, selectedLesson?.id]);

      const langId = selectedLang?.id;
      const langName = selectedLang?.name || "";

      // Derived per-course completion counts (requires courses to have been loaded with lessons(id))
      const courseProgress = (course) => {
        if (!course.lessons) return { done: 0, total: 0 };
        const done = course.lessons.filter(l => userProgress.has(l.id)).length;
        return { done, total: course.lessons.length };
      };
      const theme = LANG_THEMES[langName] || defaultTheme;

      const doSearch = useCallback(async () => {
        const q = query.trim();
        if (!q || !langId) return;
        setLoading(true); setHasSearched(true);
        try {
          if (searchMode === "french") {
            const data = await supaFetch("words", `select=id,french_word,letter,senses(dialect_word)&language_id=eq.${langId}&french_word=ilike.*${encodeURIComponent(q)}*&order=french_word&limit=50`);
            setResults(data.map(w => ({ id: w.id, french_word: w.french_word, dialect_words: w.senses?.map(s => s.dialect_word).join(" · ") || "" })));
          } else {
            const senseData = await supaFetch("senses", `select=id,dialect_word,word_id,words!inner(id,french_word,language_id)&words.language_id=eq.${langId}&dialect_word=ilike.*${encodeURIComponent(q)}*&limit=50`);
            const seen = new Set();
            const mapped = [];
            for (const s of senseData) {
              if (s.words && !seen.has(s.words.id)) {
                seen.add(s.words.id);
                mapped.push({ id: s.words.id, french_word: s.words.french_word, dialect_words: s.dialect_word });
              }
            }
            setResults(mapped);
          }
        } catch (e) { console.error(e); setResults([]); }
        setLoading(false);
      }, [query, searchMode, langId]);

      const loadBrowse = useCallback(async (letter) => {
        if (!langId) return;
        setBrowseLetter(letter); setLoading(true);
        try {
          const accentMap = { 'A':['A','À','Â'], 'E':['E','É','Ê','È'], 'I':['I','Î','Ï'], 'O':['O','Ô'], 'U':['U','Ù','Û','Ü'], 'C':['C','Ç'] };
          const prefixes = accentMap[letter] || [letter];
          const orFilter = prefixes.map(p => `french_word.ilike.${encodeURIComponent(p + '%')}`).join(",");
          const data = await supaFetch("words", `select=id,french_word,senses(dialect_word)&language_id=eq.${langId}&or=(${orFilter})&order=french_word&limit=500`);
          setBrowseWords(data.map(w => ({ id: w.id, french_word: w.french_word, dialect_words: w.senses?.map(s => s.dialect_word).join(" · ") || "" })));
        } catch (e) { console.error(e); setBrowseWords([]); }
        setLoading(false);
      }, [langId]);

      const openWord = (id, fromView) => { setPrevView(fromView || view); setSelectedWordId(id); setView("detail"); };

      // ── Chat TTS helpers ──
      const extractLingalaFragments = (text) => {
        const frags = new Set();
        // Primary: text after → (these are always Lingala translations in our prompt format)
        for (const m of text.matchAll(/→\s*([^✓~\n()[\]{}"]{2,60})/g)) {
          const f = m[1].trim().replace(/[✓~,;:.]+$/, "").trim();
          if (f.length >= 2) frags.add(f);
        }
        // Fallback: quoted strings when no arrow fragments found
        if (frags.size === 0) {
          for (const m of text.matchAll(/"([^"]{3,60})"/g)) frags.add(m[1].trim());
        }
        return [...frags];
      };

      const playChatLingala = async (idx, text) => {
        const fragments = extractLingalaFragments(text);
        if (!fragments.length) return;
        setChatPlayingIdx(idx);
        for (const frag of fragments) {
          try {
            let url = chatAudioCache[frag];
            if (!url) { url = await lingalaTTS(frag); chatAudioCache[frag] = url; }
            await new Promise(resolve => {
              const audio = new Audio(url);
              audio.onended = resolve;
              audio.onerror = resolve;
              audio.play().catch(resolve);
            });
          } catch(e) { console.error("Chat TTS:", e); }
        }
        setChatPlayingIdx(null);
      };

      // ── Chat functions ──
      const searchContext = async (userMsg) => {
        if (!langId) return { context: "", pairs: [] };

        // Fire rag-context (parallel_sentences pgvector) and lesson-context in parallel
        const [ragResult, lessonResult] = await Promise.allSettled([
          fetch("/api/rag-context", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMsg, language_id: langId }),
          }).then(r => r.ok ? r.json() : null).catch(() => null),

          fetch("/api/lesson-context", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMsg, language_id: langId }),
          }).then(r => r.ok ? r.json() : null).catch(() => null),
        ]);

        const ragContext    = ragResult.value?.context    || "";
        const lessonContext = lessonResult.value?.context || "";

        // Parse top 3 verified pairs from the formatted context string for the loading preview
        const pairs = [];
        const pairRe = /^• (.+?) → (.+?) \[(vérifié|auto)\]$/;
        for (const line of ragContext.split("\n")) {
          const m = pairRe.exec(line.trim());
          if (m) pairs.push({ fr: m[1], ln: m[2], quality: m[3] });
          if (pairs.length >= 3) break;
        }

        return { ragContext, lessonContext, pairs };
      };

      const sendChat = async () => {
        const msg = chatInput.trim();
        if (!msg || chatLoading) return;

        const newMessages = [...chatMessages, { role: "user", content: msg }];
        // Add empty assistant placeholder immediately — loading dots show until first token arrives
        setChatMessages([...newMessages, { role: "assistant", content: "" }]);
        setChatInput("");
        setChatLoading(true);
        setChatCorpusPairs([]);

        try {
          const t0 = performance.now();
          const { ragContext, lessonContext, pairs } = await searchContext(msg);
          const tRagMs = Math.round(performance.now() - t0);
          if (pairs.length) setChatCorpusPairs(pairs);

          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mode: "chat",
              ragContext,
              lessonContext,
              messages: newMessages.slice(-12).map(m => ({ role: m.role, content: m.content })),
              testerName: testerName.trim() || null,
              sessionId: testerSessionId || null,
              languageId: langId,
              userQuery: msg,
              turnNumber: Math.ceil(newMessages.length / 2),
              tRagMs,
            }),
          });

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: `⚠️ Erreur: ${data.error || "Réponse vide du modèle."}` }]);
            setChatLoading(false);
            return;
          }

          // Consume the SSE stream — each chunk carries { delta: "..." }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let accumulated = "";
          let lineBuffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split("\n");
            lineBuffer = lines.pop(); // keep any incomplete trailing line

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const payload = line.slice(6).trim();
              if (payload === "[DONE]") continue;
              try {
                const parsed = JSON.parse(payload);
                if (parsed.delta) {
                  if (!accumulated) setChatCorpusPairs([]); // hide corpus preview on first token
                  accumulated += parsed.delta;
                  const snap = accumulated;
                  setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: snap }]);
                }
              } catch {}
            }
          }

          if (!accumulated) {
            setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: "⚠️ Réponse vide du modèle." }]);
          }
        } catch (e) {
          setChatMessages(prev => [...prev.slice(0, -1), { role: "assistant", content: `⚠️ Erreur de connexion: ${e.message}` }]);
        }

        setChatLoading(false);
      };

      const submitCorrection = async (msgIndex) => {
        if (!correctionText.trim() || !correctionFrench.trim()) return;
        const original = chatMessages[msgIndex];
        const userMsg = msgIndex > 0 ? chatMessages[msgIndex - 1]?.content : "";
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/corrections`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              Prefer: "return=minimal",
            },
            body: JSON.stringify({
              language_id: langId,
              user_query: userMsg,
              ai_response: original?.content || "",
              correction_type: correctionType,
              correct_lingala: correctionText.trim(),

                                </span>

                                  textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace",
                                  borderLeft:"1px solid #E8E0D4" }}>

                                </div>
                              </div>
                              {group.items.map((item, idx) => (

                                  <div style={{ flex:1, padding:"12px 14px", fontSize:14, color:"#2D2118", lineHeight:1.5 }}>

                                    <LessonAudioText text={item.dialect} audioUrl={item.audio_url} title={`Ecouter ${item.dialect}`} />
                                  </div>
                                </div>

                          Français
