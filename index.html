                        <div style={{ flex:1, padding:"10px 14px", fontSize:11, fontWeight:700, color:"#2C5F2D",
                          textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace",
                          borderLeft:"1px solid #E8E0D4" }}>
                          {langName}

                              <div key={i} style={{ fontSize:12, color:"#9B8A6E", lineHeight:1.8, fontFamily:"'DM Sans', sans-serif" }}>
                                <span style={{ color:"#5C4A2E" }}>{p.fr}</span>
                                <span style={{ color:"#C4B8A4", margin:"0 5px" }}>→</span>
                                <span style={{ color:"#5C4A2E" }}>{p.ln}</span>
                                {p.quality === "vérifié" && <span style={{ color:"#16A34A", marginLeft:4, fontSize:10 }}>✓</span>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {chatLoading && chatMessages[chatMessages.length - 1]?.content === "" && (
                        <div style={{ alignSelf:"flex-start", maxWidth:"85%" }}>
                          <div style={{ background:"white", border:"1px solid #E8E0D4", padding:"12px 20px", borderRadius:"16px 16px 16px 4px" }}>
                            <div style={{ display:"flex", gap:4 }}>
                              {[0,1,2].map(i => (
                                <div key={i} style={{ width:8, height:8, borderRadius:"50%", background:"#0EA5E9", animation:`float 1.2s ease-in-out ${i*0.2}s infinite` }} />
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={chatEndRef} />
                    </div>

                    {/* Chat input */}
                    <div style={{ display:"flex", gap:8, paddingBottom:8 }}>
                      <div style={{ flex:1, display:"flex", alignItems:"center", background:"white", borderRadius:14, border:"2px solid #E8E0D4", padding:"0 14px" }}>
                        <input value={chatInput}
                          onChange={e => setChatInput(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } }}
                          placeholder={`Écrivez en français ou ${langName.toLowerCase()}...`}
                          style={{ flex:1, border:"none", outline:"none", fontSize:16, padding:"13px 0", background:"transparent", color:"#2D2118", fontFamily:"'DM Sans', sans-serif" }}
                          onFocus={e => e.target.parentElement.style.borderColor="#0EA5E9"}
                          onBlur={e => e.target.parentElement.style.borderColor="#E8E0D4"}
                          disabled={chatLoading}
                        />
                      </div>
                      <button onClick={sendChat} disabled={chatLoading || !chatInput.trim()} style={{
                        background: chatInput.trim() ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "#E8E0D4",
                        color: "white", border:"none", borderRadius:14, width:48, height:48,
                        display:"flex", alignItems:"center", justifyContent:"center", cursor: chatInput.trim() ? "pointer" : "default",
                        transition:"all 0.2s", flexShrink:0,
                      }}><SendIcon /></button>
                    </div>
                </React.Fragment>

                {/* Correction modal */}
                {correctionMsg !== null && (
                  <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:999, animation:"fadeIn 0.2s" }}>
                    <div style={{ background:"#F7F3ED", borderRadius:"20px 20px 0 0", width:"100%", maxWidth:480, padding:"24px 20px 32px", animation:"slideIn 0.25s ease-out" }}>
                      {correctionSent ? (
                        <div style={{ textAlign:"center", padding:"20px 0" }}>
                          <CheckCircle />
                          <p style={{ fontSize:16, fontWeight:700, color:"#2C5F2D", marginTop:12, fontFamily:"'Playfair Display', serif" }}>Merci pour votre correction !</p>
                          <p style={{ fontSize:13, color:"#9B8A6E" }}>Elle sera examinée par l'administrateur.</p>
                        </div>
                      ) : (
                        <React.Fragment>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                            <h3 style={{ fontSize:18, fontWeight:700, color:"#2D2118", margin:0, fontFamily:"'Playfair Display', serif" }}>Corriger Monoko</h3>
                            <button onClick={() => setCorrectionMsg(null)} style={{ background:"none", border:"none", cursor:"pointer", color:"#9B8A6E", padding:4 }}><CloseIcon /></button>
                          </div>

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Type d'erreur</p>
                          <div style={{ display:"flex", gap:6, marginBottom:16, flexWrap:"wrap" }}>
                            {[
                              { key:"incorrect", label:"Incorrecte" },
                              { key:"partial", label:"Partiellement correcte" },
                              { key:"missing", label:"Contexte manquant" },
                            ].map(t => (
                              <button key={t.key} onClick={() => setCorrectionType(t.key)} style={{
                                padding:"8px 14px", borderRadius:10, fontSize:12, fontWeight:600, cursor:"pointer",
                                fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s",
                                background: correctionType === t.key ? "#0EA5E920" : "white",
                                border: correctionType === t.key ? "2px solid #0EA5E9" : "1px solid #E8E0D4",
                                color: correctionType === t.key ? "#0EA5E9" : "#5C4A2E",
                              }}>{t.label}</button>
                            ))}
                          </div>

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Traduction correcte en {langName} *</p>
                          <textarea value={correctionText} onChange={e => setCorrectionText(e.target.value)}
                            placeholder={`Écrivez la traduction correcte en ${langName}...`}
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid #E8E0D4", borderRadius:12, fontSize:16, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:12 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="#E8E0D4"}
                          />

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Traduction française correspondante *</p>
                          <textarea value={correctionFrench} onChange={e => setCorrectionFrench(e.target.value)}
                            placeholder="Écrivez la phrase en français correspondante..."
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid #E8E0D4", borderRadius:12, fontSize:16, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:12 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="#E8E0D4"}
                          />

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Phrase d'exemple (optionnel)</p>
                          <textarea value={correctionExample} onChange={e => setCorrectionExample(e.target.value)}
                            placeholder="Une phrase utilisant ce mot en contexte..."
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid #E8E0D4", borderRadius:12, fontSize:14, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:16 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="#E8E0D4"}
                          />

                          <button onClick={() => submitCorrection(correctionMsg)}
                            disabled={!correctionText.trim() || !correctionFrench.trim()}
                            style={{
                              width:"100%", padding:"14px", border:"none", borderRadius:12, fontSize:15, fontWeight:700,
                              cursor: (correctionText.trim() && correctionFrench.trim()) ? "pointer" : "default",
                              fontFamily:"'DM Sans', sans-serif",
                              background: (correctionText.trim() && correctionFrench.trim()) ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "#E8E0D4",
                              color: "white",
                            }}>
                            Envoyer la correction
                          </button>
                        </React.Fragment>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
