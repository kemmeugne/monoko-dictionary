                  <p style={{ fontSize:14, color:"#5C4A2E", lineHeight:1.6, marginBottom:12 }}>
                    Le nom du testeur sera envoyé avec chaque message et chaque correction pour suivre correctement le travail effectué.
                  </p>

                  <input
                    value={pendingTesterName}
                    onChange={e => setPendingTesterName(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); saveTesterNameAndOpenChat(); } }}
                    placeholder="Nom du professeur ou du testeur"
                    style={{ width:"100%", border:"2px solid #E8E0D4", borderRadius:14, outline:"none", fontSize:16, padding:"13px 14px", color:"#2D2118", fontFamily:"'DM Sans', sans-serif", background:"#FCFBF8", marginBottom:14 }}
                  />

                  <button
                    onClick={saveTesterNameAndOpenChat}
                    disabled={!pendingTesterName.trim()}
                    style={{
                      width:"100%", border:"none", borderRadius:14, padding:"14px 18px",
                      background: pendingTesterName.trim() ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "#E8E0D4",
                      color:"white", fontSize:14, fontWeight:700, cursor: pendingTesterName.trim() ? "pointer" : "default",
                      fontFamily:"'DM Sans', sans-serif",
                    }}
                  >
                    Continuer vers le chat
                  </button>
                </div>
              </div>
            )}

            {/* CHAT WITH MONOKO */}
            {view === "chat" && selectedLang && (
              <div style={{ animation:"fadeIn 0.3s ease-out", paddingTop:20, display:"flex", flexDirection:"column", minHeight:"calc(100dvh - 120px)" }}>
                <button onClick={() => { setView("home"); }} style={{
                  display:"flex", alignItems:"center", gap:6, background:"none", border:"none",
                  color:"#8B6D47", fontSize:14, fontWeight:600, cursor:"pointer", padding:"8px 0", marginBottom:12,
                  fontFamily:"'DM Sans', sans-serif",
                }}><ArrowLeft /> Accueil</button>

                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
                  <div style={{ width:44, height:44, borderRadius:14, background:"linear-gradient(135deg, #0EA5E9, #2563EB)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22 }}>🗣️</div>
                  <div>
                    <h2 style={{ fontFamily:"'Playfair Display', serif", fontSize:22, fontWeight:800, color:"#2D2118", margin:0, lineHeight:1.1 }}>Parler avec Monoko</h2>
                    <p style={{ fontSize:12, color:"#9B8A6E", margin:"2px 0 0" }}>IA conversationnelle en {langName}</p>
                  </div>
                </div>

                <div style={{ background:"white", border:"1px solid #E8E0D4", borderRadius:14, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
                  <div>
                    <p style={{ fontSize:11, fontWeight:600, color:"#8B6D47", margin:"0 0 2px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>
                      Connecté
                    </p>
                    <p style={{ fontSize:14, color:"#2D2118", margin:0, fontWeight:600 }}>
                      {currentUser ? (currentUser.user_metadata?.display_name || currentUser.email) : (testerName || "Non renseigné")}
                    </p>
                  </div>
                  <button
                    onClick={handleSignOut}
                    style={{ background:"none", border:"1px solid #E8E0D4", borderRadius:10, padding:"8px 12px", fontSize:12, color:"#8B6D47", cursor:"pointer", fontFamily:"'DM Sans', sans-serif", fontWeight:600 }}
                  >
                    Déconnexion
                  </button>
                </div>

                <React.Fragment>
                    {/* Chat messages */}
                    <div style={{ flex:1, overflowY:"auto", marginBottom:12, display:"flex", flexDirection:"column", gap:8 }}>
                      {chatMessages.length === 0 && (
                        <div style={{ textAlign:"center", padding:"40px 20px" }}>
                          <div style={{ fontSize:48, marginBottom:12 }}>🗣️</div>
                          <p style={{ fontSize:16, fontWeight:700, color:"#2D2118", margin:"0 0 8px", fontFamily:"'Playfair Display', serif" }}>Mbote!</p>
                          <p style={{ fontSize:14, color:"#9B8A6E", lineHeight:1.5, maxWidth:280, margin:"0 auto" }}>
                            Posez une question en français ou en {langName}. Demandez une traduction, de la grammaire, ou discutez directement.
                          </p>
                          <div style={{ display:"flex", flexWrap:"wrap", gap:6, justifyContent:"center", marginTop:16 }}>
                            {["Comment dit-on bonjour ?", "Traduis: je vais au marché", "Mbote na yo!", "Les pronoms en " + langName].map((s, i) => (
                              <button key={i} onClick={() => { setChatInput(s); }} style={{
                                background:"white", border:"1px solid #E8E0D4", borderRadius:20,
                                padding:"8px 14px", fontSize:12, color:"#5C4A2E", cursor:"pointer",
                                fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s",
                              }}
                              onMouseOver={e => { e.currentTarget.style.borderColor="#0EA5E9"; e.currentTarget.style.background="#F0F9FF"; }}
                              onMouseOut={e => { e.currentTarget.style.borderColor="#E8E0D4"; e.currentTarget.style.background="white"; }}>
                                {s}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {chatMessages.map((msg, idx) => !msg.content ? null : (
                        <div key={idx} style={{
                          alignSelf: msg.role === "user" ? "flex-end" : "flex-start",
                          maxWidth: "85%",
                          animation: "slideIn 0.2s ease-out",
                        }}>
                          <div style={{
                            background: msg.role === "user"
                              ? "linear-gradient(135deg, #0EA5E9, #2563EB)"
                              : "white",
                            color: msg.role === "user" ? "white" : "#2D2118",
                            padding: "12px 16px",
                            borderRadius: msg.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                            fontSize: 14, lineHeight: 1.6,
                            border: msg.role === "user" ? "none" : "1px solid #E8E0D4",
                            fontFamily: "'DM Sans', sans-serif",
                            whiteSpace: "pre-wrap",
                          }}>
                            {msg.content}
                          </div>
                          {/* Action buttons for AI messages — only when streaming is complete */}
                          {msg.role === "assistant" && !msg.content.startsWith("⚠️") && !chatLoading && (
                            <div style={{ display:"flex", gap:6, marginTop:4, marginLeft:4 }}>
                              <button onClick={() => { setCorrectionMsg(idx); setCorrectionSent(false); setCorrectionText(""); setCorrectionExample(""); }}
                                style={{ display:"flex", alignItems:"center", gap:4, background:"none", border:"1px solid #E8E0D4", borderRadius:8, padding:"4px 10px", fontSize:11, color:"#9B8A6E", cursor:"pointer", fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s" }}
                                onMouseOver={e => { e.currentTarget.style.borderColor="#E57373"; e.currentTarget.style.color="#E57373"; }}
                                onMouseOut={e => { e.currentTarget.style.borderColor="#E8E0D4"; e.currentTarget.style.color="#9B8A6E"; }}>
                                <FlagIcon /> Corriger
                              </button>
                              {extractLingalaFragments(msg.content).length > 0 && (
                                <button
                                  onClick={() => playChatLingala(idx, msg.content)}
                                  disabled={chatPlayingIdx !== null && chatPlayingIdx !== idx}
                                  title="Écouter les traductions en Lingala"
                                  style={{ display:"flex", alignItems:"center", gap:4, background:"none", border:"1px solid #E8E0D4", borderRadius:8, padding:"4px 10px", fontSize:11, color: chatPlayingIdx === idx ? "#16A34A" : "#9B8A6E", cursor:"pointer", fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s" }}
                                  onMouseOver={e => { if (chatPlayingIdx !== idx) e.currentTarget.style.borderColor="#16A34A"; }}
                                  onMouseOut={e => { if (chatPlayingIdx !== idx) e.currentTarget.style.borderColor="#E8E0D4"; }}>
                                  {chatPlayingIdx === idx ? "⏳" : "🔊"}
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      ))}

                      {chatLoading && chatMessages[chatMessages.length - 1]?.content === "" && chatCorpusPairs.length > 0 && (
                        <div style={{ alignSelf:"flex-start", maxWidth:"90%", animation:"fadeIn 0.3s ease-out" }}>
                          <div style={{ background:"#FAFAF8", border:"1px solid #E8E0D4", borderRadius:12, padding:"10px 14px", marginBottom:6 }}>
                            <p style={{ fontSize:10, fontWeight:700, color:"#C4B8A4", textTransform:"uppercase", letterSpacing:"0.07em", margin:"0 0 8px", fontFamily:"'DM Mono', monospace" }}>
                              Trouvé dans le corpus
                            </p>
                            {chatCorpusPairs.map((p, i) => (
                              <div key={i} style={{ fontSize:12, color:"#9B8A6E", lineHeight:1.8, fontFamily:"'DM Sans', sans-serif" }}>
                                <span style={{ color:"#5C4A2E" }}>{p.fr}</span>
                                <span style={{ color:"#C4B8A4", margin:"0 5px" }}>→</span>
                                <span style={{ color:"#5C4A2E" }}>{p.ln}</span>
                                {p.quality === "vérifié" && <span style={{ color:"#16A34A", marginLeft:4, fontSize:10 }}>✓</span>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {chatLoading && chatMessages[chatMessages.length - 1]?.content === "" && (
                        <div style={{ alignSelf:"flex-start", maxWidth:"85%" }}>
                          <div style={{ background:"white", border:"1px solid #E8E0D4", padding:"12px 20px", borderRadius:"16px 16px 16px 4px" }}>
                            <div style={{ display:"flex", gap:4 }}>
                              {[0,1,2].map(i => (
                                <div key={i} style={{ width:8, height:8, borderRadius:"50%", background:"#0EA5E9", animation:`float 1.2s ease-in-out ${i*0.2}s infinite` }} />
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={chatEndRef} />
                    </div>

                    {/* Chat input */}
                    <div style={{ display:"flex", gap:8, paddingBottom:8 }}>
                      <div style={{ flex:1, display:"flex", alignItems:"center", background:"white", borderRadius:14, border:"2px solid #E8E0D4", padding:"0 14px" }}>
                        <input value={chatInput}
                          onChange={e => setChatInput(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } }}
                          placeholder={`Écrivez en français ou ${langName.toLowerCase()}...`}
                          style={{ flex:1, border:"none", outline:"none", fontSize:16, padding:"13px 0", background:"transparent", color:"#2D2118", fontFamily:"'DM Sans', sans-serif" }}
                          onFocus={e => e.target.parentElement.style.borderColor="#0EA5E9"}
                          onBlur={e => e.target.parentElement.style.borderColor="#E8E0D4"}
                          disabled={chatLoading}
                        />
                      </div>
                      <button onClick={sendChat} disabled={chatLoading || !chatInput.trim()} style={{
                        background: chatInput.trim() ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "#E8E0D4",
                        color: "white", border:"none", borderRadius:14, width:48, height:48,
                        display:"flex", alignItems:"center", justifyContent:"center", cursor: chatInput.trim() ? "pointer" : "default",
                        transition:"all 0.2s", flexShrink:0,
                      }}><SendIcon /></button>
                    </div>
                </React.Fragment>

                {/* Correction modal */}
                {correctionMsg !== null && (
                  <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:999, animation:"fadeIn 0.2s" }}>
                    <div style={{ background:"#F7F3ED", borderRadius:"20px 20px 0 0", width:"100%", maxWidth:480, padding:"24px 20px 32px", animation:"slideIn 0.25s ease-out" }}>
                      {correctionSent ? (
                        <div style={{ textAlign:"center", padding:"20px 0" }}>
                          <CheckCircle />
                          <p style={{ fontSize:16, fontWeight:700, color:"#2C5F2D", marginTop:12, fontFamily:"'Playfair Display', serif" }}>Merci pour votre correction !</p>
                          <p style={{ fontSize:13, color:"#9B8A6E" }}>Elle sera examinée par l'administrateur.</p>
                        </div>
                      ) : (
                        <React.Fragment>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                            <h3 style={{ fontSize:18, fontWeight:700, color:"#2D2118", margin:0, fontFamily:"'Playfair Display', serif" }}>Corriger Monoko</h3>
                            <button onClick={() => setCorrectionMsg(null)} style={{ background:"none", border:"none", cursor:"pointer", color:"#9B8A6E", padding:4 }}><CloseIcon /></button>
                          </div>

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Type d'erreur</p>
                          <div style={{ display:"flex", gap:6, marginBottom:16, flexWrap:"wrap" }}>
                            {[
                              { key:"incorrect", label:"Incorrecte" },
                              { key:"partial", label:"Partiellement correcte" },
                              { key:"missing", label:"Contexte manquant" },
                            ].map(t => (
                              <button key={t.key} onClick={() => setCorrectionType(t.key)} style={{
                                padding:"8px 14px", borderRadius:10, fontSize:12, fontWeight:600, cursor:"pointer",
                                fontFamily:"'DM Sans', sans-serif", transition:"all 0.15s",
                                background: correctionType === t.key ? "#0EA5E920" : "white",
                                border: correctionType === t.key ? "2px solid #0EA5E9" : "1px solid #E8E0D4",
                                color: correctionType === t.key ? "#0EA5E9" : "#5C4A2E",
                              }}>{t.label}</button>
                            ))}
                          </div>

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Traduction correcte en {langName} *</p>
                          <textarea value={correctionText} onChange={e => setCorrectionText(e.target.value)}
                            placeholder={`Écrivez la traduction correcte en ${langName}...`}
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid #E8E0D4", borderRadius:12, fontSize:16, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:12 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="#E8E0D4"}
                          />

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Traduction française correspondante *</p>
                          <textarea value={correctionFrench} onChange={e => setCorrectionFrench(e.target.value)}
                            placeholder="Écrivez la phrase en français correspondante..."
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid #E8E0D4", borderRadius:12, fontSize:16, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:12 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="#E8E0D4"}
                          />

                          <p style={{ fontSize:12, fontWeight:600, color:"#8B6D47", margin:"0 0 8px", textTransform:"uppercase", letterSpacing:"0.06em", fontFamily:"'DM Mono', monospace" }}>Phrase d'exemple (optionnel)</p>
                          <textarea value={correctionExample} onChange={e => setCorrectionExample(e.target.value)}
                            placeholder="Une phrase utilisant ce mot en contexte..."
                            rows={2}
                            style={{ width:"100%", padding:"12px 14px", border:"2px solid #E8E0D4", borderRadius:12, fontSize:14, fontFamily:"'DM Sans', sans-serif", background:"white", outline:"none", resize:"vertical", marginBottom:16 }}
                            onFocus={e => e.target.style.borderColor="#0EA5E9"}
                            onBlur={e => e.target.style.borderColor="#E8E0D4"}
                          />

                          <button onClick={() => submitCorrection(correctionMsg)}
                            disabled={!correctionText.trim() || !correctionFrench.trim()}
                            style={{
                              width:"100%", padding:"14px", border:"none", borderRadius:12, fontSize:15, fontWeight:700,
                              cursor: (correctionText.trim() && correctionFrench.trim()) ? "pointer" : "default",
                              fontFamily:"'DM Sans', sans-serif",
                              background: (correctionText.trim() && correctionFrench.trim()) ? "linear-gradient(135deg, #0EA5E9, #2563EB)" : "#E8E0D4",
                              color: "white",
                            }}>
                            Envoyer la correction
                          </button>
                        </React.Fragment>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
