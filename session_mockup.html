<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monɔkɔ — maquette de session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens lifted from index.html so the mockup is judged in the app's own
     visual language, not a new one. */
  :root{
    --ground:#FDFBF7; --card:#FFFFFF; --ink:#2D2118; --muted:#9B8A6E;
    --hairline:#E8E0D4; --purple:#6B21A8; --purple-soft:#F3F0FF;
    --green:#2C5F2D; --success:#16A34A; --success-soft:#EAF7EE;
    --error:#DC2626; --error-soft:#FDF0F0;
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --display:'Playfair Display',Georgia,serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#EFEAE1; font-family:var(--sans); color:var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    gap:28px; padding:24px 16px; flex-wrap:wrap;
  }

  /* Phone frame — only for viewing on a desktop. On a real phone the app
     fills the viewport, which is what .screen models. */
  .frame{
    width:375px; height:760px; background:var(--ground);
    border-radius:34px; border:1px solid var(--hairline);
    box-shadow:0 18px 50px rgba(45,33,24,.14); overflow:hidden;
    display:flex; flex-direction:column; position:relative;
  }
  @media (max-width:820px){
    body{padding:0;background:var(--ground)}
    .frame{width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none}
    .caption{display:none}
  }
  .caption{
    width:375px; font:500 12px/1.5 var(--mono); color:#6b6257;
    letter-spacing:.06em; text-transform:uppercase; margin:0 0 10px;
  }

  .screen{flex:1;display:flex;flex-direction:column;min-height:0;
          padding:calc(env(safe-area-inset-top) + 14px) 18px
                  calc(env(safe-area-inset-bottom) + 16px);}

  /* ── header: quit, progress, score ─────────────────────────────── */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .quit{
    width:44px;height:44px;margin-left:-10px;border:none;background:none;
    color:var(--muted);font-size:26px;line-height:1;cursor:pointer;border-radius:12px;
  }
  .quit:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
  .track{flex:1;height:10px;border-radius:5px;background:var(--hairline);overflow:hidden}
  .fill{height:100%;width:0;border-radius:5px;background:var(--purple);
        transition:width .45s cubic-bezier(.4,0,.2,1)}
  .xp{font:500 13px var(--mono);color:var(--purple);font-variant-numeric:tabular-nums;
      min-width:46px;text-align:right}

  /* ── prompt ────────────────────────────────────────────────────── */
  .eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;
           color:var(--muted);margin:0 0 6px}
  .task{font:600 19px/1.35 var(--sans);margin:0 0 20px;text-wrap:balance}

  /* ── pairing grid ──────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
  .tile{
    min-height:60px;padding:12px 10px;border-radius:14px;
    border:1.5px solid var(--hairline);background:var(--card);
    font:500 15px/1.3 var(--sans);color:var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;
    cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
  }
  .tile.ln{font-family:var(--display);font-weight:700;font-size:17px;color:var(--green)}
  .tile:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
  .tile[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-soft);
                             transform:scale(.97)}
  .tile.ok{border-color:var(--success);background:var(--success-soft);color:var(--success)}
  .tile.ok.ln{color:var(--success)}
  .tile.bad{border-color:var(--error);background:var(--error-soft);
            animation:shake .34s cubic-bezier(.36,.07,.19,.97)}
  /* A solved pair stays in place, dimmed. Removing it would leave a hole, and
     collapsing the grid would shift the remaining tiles under the user's thumb
     mid-session — both worse than simply retiring the tile where it sits. */
  .tile.gone{opacity:.34;pointer-events:none;transition:opacity .3s;
             border-color:var(--hairline);background:var(--card);color:var(--muted)}
  .tile.gone.ln{color:var(--muted)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}
                   50%{transform:translateX(-4px)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  .spacer{flex:1;min-height:12px}

  /* ── feedback bar: replaces the action row, never overlaps it ──── */
  .feedback{border-radius:16px;padding:14px 16px;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.good{background:var(--success-soft)}
  .feedback.bad{background:var(--error-soft)}
  .fb-title{font:700 15px var(--sans);margin:0 0 4px;display:flex;align-items:center;gap:7px}
  .good .fb-title{color:var(--success)} .bad .fb-title{color:var(--error)}
  .fb-body{font:400 14px/1.45 var(--sans);color:var(--ink);margin:0}
  .fb-body b{font-family:var(--display);font-weight:700;color:var(--green)}
  .why{
    margin-top:11px;min-height:44px;padding:0 15px;border-radius:11px;
    border:1.5px solid var(--error);background:transparent;color:var(--error);
    font:600 14px var(--sans);cursor:pointer;
  }

  .cta{
    width:100%;min-height:52px;border:none;border-radius:14px;background:var(--purple);
    color:#fff;font:700 16px var(--sans);cursor:pointer;
  }
  .cta[disabled]{background:var(--hairline);color:#B5A995;cursor:default}
  .cta.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--hairline)}

  /* ── summary ───────────────────────────────────────────────────── */
  .sum{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px}
  .sum h2{font:800 30px var(--display);margin:0}
  .sum .big{font:800 46px var(--mono);color:var(--purple);
            font-variant-numeric:tabular-nums;margin:8px 0 0}
  .sum p{color:var(--muted);font-size:14px;margin:0}
  .stats{display:flex;gap:10px;margin:22px 0 0}
  .stat{flex:1;border:1px solid var(--hairline);border-radius:14px;padding:13px 8px;background:var(--card)}
  .stat b{display:block;font:600 20px var(--mono);font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
             font-family:var(--mono)}
  .review{margin-top:18px;text-align:left;border:1px solid var(--hairline);
          border-radius:14px;background:var(--card);overflow:hidden}
  .review h3{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;
             color:var(--muted);margin:0;padding:11px 14px;border-bottom:1px solid var(--hairline)}
  .review div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px;
              border-bottom:1px solid #F4EFE7}
  .review div:last-child{border-bottom:none}
  .review em{font-family:var(--display);font-weight:700;color:var(--green);font-style:normal}
</style>
</head>
<body>

<div>
  <p class="caption">Session · appariement</p>
  <div class="frame"><div class="screen" id="app"></div></div>
</div>

<div>
  <p class="caption">Résumé de fin</p>
  <div class="frame"><div class="screen" id="app2"></div></div>
</div>

<script>
// Real rows from lesson_pool: lesson 351 "La famille et les relations",
// tier=native, toned, <=2 tokens, all with professor audio.
const PAIRS = [
  {fr:"Mère",      ln:"Mama"},
  {fr:"Père",      ln:"Tata"},
  {fr:"Enfant",    ln:"Mwana"},
  {fr:"Oncle",     ln:"Noko"},
  {fr:"Jumeaux",   ln:"Mapasa"},
];
const TOTAL = 15;                 // questions in a session
let solved = 0, xp = 0, wrong = [], pickedFr = null, pickedLn = null, busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffled = a => a.map(v => [Math.random(), v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

const LN_ORDER = shuffled(PAIRS.map(p => p.ln));

function render(){
  const done = solved + wrong.length * 0;             // progress = pairs solved
  document.getElementById('app').innerHTML = `
    <div class="top">
      <button class="quit" aria-label="Quitter la session">&times;</button>
      <div class="track"><i class="fill" id="fill"></i></div>
      <span class="xp" id="xp">${xp} XP</span>
    </div>

    <p class="eyebrow">La famille et les relations</p>
    <h1 class="task">Associez chaque mot à sa traduction</h1>

    <div class="grid" id="grid">
      ${PAIRS.map(p => `
        <button class="tile fr" data-fr="${esc(p.fr)}" aria-pressed="false">${esc(p.fr)}</button>
        <button class="tile ln" data-ln="${esc(LN_ORDER[PAIRS.indexOf(p)])}" aria-pressed="false"
        >${esc(LN_ORDER[PAIRS.indexOf(p)])}</button>`).join('')}
    </div>

    <div class="spacer"></div>

    <div class="feedback" id="fb"></div>
    <button class="cta" id="cta" ${solved < PAIRS.length ? 'disabled' : ''}>
      ${solved < PAIRS.length ? 'Associez les paires' : 'Continuer'}
    </button>`;

  document.getElementById('fill').style.width = (100 * (solved + 3) / TOTAL) + '%';
  document.querySelectorAll('.tile').forEach(t => t.onclick = () => tap(t));
  document.getElementById('cta').onclick = () => { if (solved >= PAIRS.length) summary(); };
}

function tap(tile){
  if (busy || tile.classList.contains('gone') || tile.classList.contains('ok')) return;
  const isFr = tile.dataset.fr !== undefined;
  const prev = isFr ? pickedFr : pickedLn;
  if (prev === tile){ tile.setAttribute('aria-pressed','false'); isFr ? pickedFr=null : pickedLn=null; return; }
  if (prev) prev.setAttribute('aria-pressed','false');
  tile.setAttribute('aria-pressed','true');
  isFr ? pickedFr = tile : pickedLn = tile;
  if (pickedFr && pickedLn) judge();
}

function judge(){
  const fr = pickedFr.dataset.fr, ln = pickedLn.dataset.ln;
  const right = PAIRS.find(p => p.fr === fr).ln === ln;
  const a = pickedFr, b = pickedLn;
  pickedFr = pickedLn = null; busy = true;

  if (right){
    [a,b].forEach(t => { t.setAttribute('aria-pressed','false'); t.classList.add('ok'); });
    solved++; xp += 10;
    setTimeout(() => { [a,b].forEach(t => t.classList.add('gone')); busy = false; sync(); }, 480);
    return;
  }

  // Wrong: name the error, give the answer, offer the rule — then re-queue.
  [a,b].forEach(t => { t.setAttribute('aria-pressed','false'); t.classList.add('bad'); });
  const truth = PAIRS.find(p => p.fr === fr).ln;
  wrong.push({fr, given: ln, truth});
  const fb = document.getElementById('fb');
  fb.className = 'feedback bad show';
  fb.innerHTML = `<p class="fb-title">✕ Pas tout à fait</p>
    <p class="fb-body">« ${esc(fr)} » se dit <b>${esc(truth)}</b>.</p>
    <button class="why">Pourquoi&nbsp;? Voir la leçon</button>`;
  setTimeout(() => { [a,b].forEach(t => t.classList.remove('bad')); busy = false; }, 900);
}

function sync(){
  document.getElementById('xp').textContent = xp + ' XP';
  document.getElementById('fill').style.width = (100 * (solved + 3) / TOTAL) + '%';
  const cta = document.getElementById('cta');
  if (solved >= PAIRS.length){ cta.disabled = false; cta.textContent = 'Continuer'; }
}

function summary(){ document.getElementById('app2').scrollIntoView({behavior:'smooth'}); }

// Static end-of-session screen, shown alongside so both states are visible at once.
document.getElementById('app2').innerHTML = `
  <div class="top">
    <button class="quit" aria-label="Fermer">&times;</button>
    <div class="track"><i class="fill" style="width:100%"></i></div>
    <span class="xp">150 XP</span>
  </div>
  <div class="sum">
    <h2>Session terminée</h2>
    <p class="big">150 XP</p>
    <p>La famille et les relations</p>
    <div class="stats">
      <div class="stat"><b>15</b><span>questions</span></div>
      <div class="stat"><b>87%</b><span>réussite</span></div>
      <div class="stat"><b>4</b><span>jours</span></div>
    </div>
    <div class="review">
      <h3>À revoir</h3>
      <div><span>Oncle</span><em>Noko</em></div>
      <div><span>Jumeaux</span><em>Mapasa</em></div>
    </div>
  </div>
  <button class="cta" style="margin-top:18px">Continuer</button>
  <button class="cta ghost" style="margin-top:10px">Refaire cette leçon</button>`;

render();
</script>
</body>
</html>
